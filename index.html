};

/* ---------------------------------------------------------------------
   3. СХЕМА ДАННЫХ. Фабрики и миграция. Раздел 5 ТЗ.
   Имена полей менять нельзя: на них завязаны экспорт, импорт и будущие версии.
   --------------------------------------------------------------------- */
var Schema = {
  newSettings: function () {
    return {
      roundsCount: 2,
      roundMinutes: 5,
      theme: 'auto',
      expressMode: false,
      /* Блок синхронизации свой у каждого устройства и в облако не уходит:
         номер файла общий, а состояние подключения местное. */
      cloud: {
        provider: 'google',
        connected: false,
        lastSync: 0,
        folderId: '',
        fileId: '',
        lastVersion: 0,
        pendingLocal: false
      }
    };
  },

  newRoot: function () {
    return { schema: C.SCHEMA, settings: Schema.newSettings(), situations: [], formulaLibrary: [] };
  },

  newRole: function (name, order, interest) {
    var n = String(name || '');
    return {
      id: U.id('r_'),
      name: n,
      short: Schema.shortOf(n),
      order: order || 1,
      hard: false,
      interest: interest || ''   // отступление от раздела 5.1 ТЗ, см. CHANGELOG
    };
  },

  shortOf: function (name) {
    var s = String(name || '').trim();
    if (!s) return '';
    return U.cut(s, 1).toUpperCase();
  },

  newSituation: function (title) {
    var ts = U.now();
    var roles = [];
    for (var i = 1; i <= C.ROLES_MIN; i++) roles.push(Schema.newRole('Роль ' + i, i));
    return {
      id: U.id('s_'),
      title: title || C.TITLE_DEFAULT,
      sourceText: '',
      context: '',
      createdAt: ts,
      updatedAt: ts,
      deletedAt: 0,        // корзина, раздел 11 ТЗ: 0 значит живая ситуация
      roles: roles,
      step1: { fabula: '', plot: '', essence: '', retell: ['', '', ''] },
      step2: { phrases: [], layerNotes: Schema.emptyLayerNotes() },
      step3: { byRole: {} },
      step4: { common: [], byRole: {} },
      step5: {
        judgeStatement: '', criteria: '', decision: '',
        consequences: { nodes: [], premortem: [] }
      },
      step6: { byRole: {}, cells: {} },
      step7: { common: [], byRole: {} },
      step8: { byRole: {} },
      step9: { strategy: '', rounds: [] },
      secondQuestions: [],
      comments: [],
      afterNotes: ''
    };
  },

  newAssumption: function () {
    return { id: U.id('a_'), text: '', necessary: false, sufficient: false };
  },

  emptyLayerNotes: function () {
    var o = {};
    C.LAYERS.forEach(function (l) { o[l.id] = ''; });
    return o;
  },
  newPhrase: function (quote) {
    return {
      id: U.id('p_'), quote: String(quote || ''), purpose: '',
      readings: [], layers: [],
      wordMeanings: [],   // значения отдельных слов: { id, word, layer, text }
      silent: []          // слои, в которых фраза осознанно "не звучит"
    };
  },
  newReading: function (layer) {
    return { id: U.id('rd_'), text: '', use: '', starred: false, layer: layer || '' };
  },
  newWordMeaning: function (word, layer) {
    return { id: U.id('wm_'), word: String(word || ''), layer: layer || '', text: '' };
  },

  /* Формула внутри ситуации, раздел 5.8 ТЗ. В нее ложится копия текста
     заготовки, а не ссылка: правка копилки не должна задним числом
     переписывать прошлые подготовки. originId помнит, откуда взято. */
  newSitFormula: function (type, text, originId) {
    return {
      id: U.id('sf_'),
      type: Schema.formulaType(type, 'refusal'),
      text: String(text || ''),
      originId: originId || null,
      threatId: null,     // угроза шага 4
      outcome: ''         // разбор после поединка: '', 'worked', 'failed'
    };
  },

  /* Заготовка в копилке, раздел 5.13 ТЗ. */
  newLibFormula: function (type, text) {
    return {
      id: U.id('f_'),
      type: Schema.formulaType(type, 'refusal'),
      text: String(text || ''),
      comment: '',
      tags: [],
      createdAt: U.now(),
      usedIn: [],
      worked: 0,
      failed: 0
    };
  },

  formulaType: function (v, fallback) {
    var t = String(v || '');
    for (var i = 0; i < C.FORMULA_TYPES.length; i++) if (C.FORMULA_TYPES[i].id === t) return t;
    return fallback || 'other';
  },

  normalizeSitFormula: function (f) {
    return {
      id: String((f && f.id) || U.id('sf_')),
      type: Schema.formulaType(f && f.type, 'other'),
      text: String((f && f.text) || ''),
      originId: (f && f.originId) ? String(f.originId) : null,
      threatId: (f && f.threatId) ? String(f.threatId) : null,
      outcome: ((f && f.outcome) === 'worked' || (f && f.outcome) === 'failed') ? f.outcome : ''
    };
  },

  normalizeLibFormula: function (f) {
    if (!f || typeof f !== 'object') return null;
    return {
      id: String(f.id || U.id('f_')),
      type: Schema.formulaType(f.type, 'other'),
      text: String(f.text || ''),
      comment: String(f.comment || ''),
      tags: (Array.isArray(f.tags) ? f.tags : []).map(function (t) { return String(t || '').trim(); })
        .filter(Boolean).slice(0, C.LIB_TAGS_MAX),
      createdAt: Number(f.createdAt) || U.now(),
      usedIn: (Array.isArray(f.usedIn) ? f.usedIn : []).map(String),
      worked: Math.max(0, Number(f.worked) || 0),
      failed: Math.max(0, Number(f.failed) || 0)
    };
  },

  /* Слои фразы не отмечаются руками, а считаются: слой задействован,
     если в нем есть трактовка фразы или значение слова. */
  layersOf: function (phrase) {
    var out = [];
    C.LAYERS.forEach(function (l) {
      var has = (phrase.readings || []).some(function (r) { return r && r.layer === l.id && String(r.text || '').trim(); }) ||
        (phrase.wordMeanings || []).some(function (m) { return m && m.layer === l.id && String(m.text || '').trim(); });
      if (has) out.push(l.id);
    });
    return out;
  },

  /* Фраза пройдена в слое, если в нем есть содержание или отметка "не звучит" */
  passedInLayer: function (phrase, layerId) {
    if ((phrase.silent || []).indexOf(layerId) >= 0) return true;
    return Schema.layersOf(phrase).indexOf(layerId) >= 0;
  },

  /* Слова фразы для разбора: цитата без знаков, повторы убраны */
  wordsOf: function (quote) {
    var out = [], seen = {};
    String(quote || '').split(/[^А-Яа-яЁёA-Za-z0-9\-]+/).forEach(function (w) {
      w = w.replace(/^-+|-+$/g, '');
      if (w.length < 2) return;
      var k = w.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      out.push(w);
    });
    return out;
  },

  /* Нарезка текста на фразы по предложениям, для первого прогона */
  sentences: function (text) {
    var t = String(text || '').replace(/\r/g, '');
    var out = [];
    t.split('\n').forEach(function (line) {
      line = line.trim();
      if (!line) return;
      /* без lookbehind: Safari iOS младше 16.4 его не понимает */
      var buf = '';
      var parts = line.split(/(\s+)/);
      for (var i = 0; i < parts.length; i++) {
        var chunk = parts[i];
        if (/^\s+$/.test(chunk)) {
          var next = parts[i + 1] || '';
          if (/[.!?]["»)]?$/.test(buf.trim()) && /^[А-ЯЁA-Z0-9«"]/.test(next)) {
            if (buf.trim().length >= 2) out.push(buf.trim());
            buf = '';
          } else {
            buf += chunk;
          }
        } else {
          buf += chunk;
        }
      }
      if (buf.trim().length >= 2) out.push(buf.trim());
    });
    return out;
  },

  step3ForRole: function (sit, roleId) {
    if (!sit.step3) sit.step3 = { byRole: {} };
    if (!sit.step3.byRole) sit.step3.byRole = {};
    if (!sit.step3.byRole[roleId]) sit.step3.byRole[roleId] = { heroVersion: '', assumptions: [] };
    return sit.step3.byRole[roleId];
  },
  /* ---- шаг 9: стратегия связанных раундов, раздел 5.10 ТЗ ---- */

  newRound: function (n, roleId) {
    return { n: n || 1, myRoleId: roleId || '', goal: '', carryOver: '', ifFails: '' };
  },

  normalizeRound: function (r, i, roleIds) {
    var rid = String((r && r.myRoleId) || '');
    return {
      n: i + 1,                                   // номер производный: он и есть место в ленте
      myRoleId: roleIds.indexOf(rid) >= 0 ? rid : '',
      goal: String((r && r.goal) || ''),
      carryOver: String((r && r.carryOver) || ''),
      ifFails: String((r && r.ifFails) || '')
    };
  },

  ensureStep9: function (sit, wanted) {
    if (!sit.step9 || typeof sit.step9 !== 'object' || Array.isArray(sit.step9)) sit.step9 = {};
    if (typeof sit.step9.strategy !== 'string') sit.step9.strategy = '';
    if (!Array.isArray(sit.step9.rounds)) sit.step9.rounds = [];
    var want = Math.min(Math.max(Number(wanted) || sit.step9.rounds.length || 2, C.ROUNDS_MIN), C.ROUNDS_MAX);
    while (sit.step9.rounds.length < want) sit.step9.rounds.push(Schema.newRound(sit.step9.rounds.length + 1));
    sit.step9.rounds.forEach(function (r, i) { r.n = i + 1; });
    return sit.step9;
  },

  /* Связка последнего раунда никуда не ведет, поэтому ее и не спрашивают:
     раздел 5.10 ТЗ. Разрыв ленты это раунд без связки, кроме последнего. */
  roundLinked: function (rounds, i) {
    if (i >= rounds.length - 1) return true;
    return !!String(rounds[i].carryOver || '').trim();
  },

  /* Раздел 6 ТЗ: у всех раундов есть цель, у всех кроме последнего связка. */
  step9Ready: function (sit) {
    var rs = (sit.step9 && sit.step9.rounds) || [];
    if (!rs.length) return false;
    return rs.every(function (r, i) {
      return String(r.goal || '').trim() && Schema.roundLinked(rs, i);
    });
  },
  step9Progress: function (sit) {
    var rs = (sit.step9 && sit.step9.rounds) || [];
    var goals = rs.filter(function (r) { return String(r.goal || '').trim(); }).length;
    var breaks = rs.filter(function (r, i) { return !Schema.roundLinked(rs, i); }).length;
    return { total: rs.length, goals: goals, breaks: breaks };
  },

  /* ---- комментарии к полям, раздел 5.12 ТЗ ---- */

  newComment: function (path, author) {
    return {
      id: U.id('c_'),
      path: String(path || ''),
      text: '',
      author: author === 'second' ? 'second' : 'self',
      resolved: false,
      ts: U.now()
    };
  },
  normalizeComment: function (c) {
    return {
      id: String((c && c.id) || U.id('c_')),
      path: String((c && c.path) || ''),
      text: String((c && c.text) || ''),
      author: ((c && c.author) === 'second') ? 'second' : 'self',
      resolved: !!(c && c.resolved),
      ts: Number(c && c.ts) || U.now()
    };
  },

  /* ---- вопросы секунданта, раздел 5.11 ТЗ ---- */

  newQuestion: function (author) {
    return {
      id: U.id('q_'),
      text: '',
      author: author === 'second' ? 'second' : 'self',
      answer: '',
      confident: false,
      ts: U.now()
    };
  },
  normalizeQuestion: function (q) {
    return {
      id: String((q && q.id) || U.id('q_')),
      text: String((q && q.text) || ''),
      author: ((q && q.author) === 'second') ? 'second' : 'self',
      answer: String((q && q.answer) || ''),
      confident: !!(q && q.confident),
      ts: Number(q && q.ts) || U.now()
    };
  },
  /* Незакрытый вопрос: есть текст, но нет уверенного ответа.
     Такие отдельным блоком уходят на экран «Готов?» в 0.7. */
  openQuestions: function (sit) {
    return (sit.secondQuestions || []).filter(function (q) {
      return String(q.text || '').trim() && !q.confident;
    });
  },

  /* ---- шаг 5: позиция судьи и последствия, раздел 5.6 ТЗ ---- */

  newConsequence: function (parent, sign) {
    return {
      id: U.id('n_'),
      parent: parent || null,
      text: '',
      coord: [],
      horizon: 'near',
      sign: Schema.oneOf(sign, C.SIGNS, 'minus')
    };
  },
  newPremortem: function () {
    return { id: U.id('m_'), text: '', counter: '' };
  },
  oneOf: function (v, list, fallback) {
    var x = String(v || '');
    for (var i = 0; i < list.length; i++) if (list[i].id === x) return x;
    return fallback;
  },

  normalizeConsequence: function (nd) {
    var codes = C.COORDS.map(function (c) { return c.id; });
    var src = (nd && Array.isArray(nd.coord)) ? nd.coord : [];
    var coord = [];
    codes.forEach(function (c) { if (src.indexOf(c) >= 0) coord.push(c); });  // порядок фиксирован, дублей нет
    return {
      id: String((nd && nd.id) || U.id('n_')),
      parent: (nd && nd.parent) ? String(nd.parent) : null,
      text: String((nd && nd.text) || ''),
      coord: coord,
      horizon: Schema.oneOf(nd && nd.horizon, C.HORIZONS, 'near'),
      sign: Schema.oneOf(nd && nd.sign, C.SIGNS, 'minus')
    };
  },

  ensureStep5: function (sit) {
    if (!sit.step5 || typeof sit.step5 !== 'object' || Array.isArray(sit.step5)) sit.step5 = {};
    var s5 = sit.step5;
    if (typeof s5.judgeStatement !== 'string') s5.judgeStatement = '';
    if (typeof s5.criteria !== 'string') s5.criteria = '';
    if (typeof s5.decision !== 'string') s5.decision = '';
    if (!s5.consequences || typeof s5.consequences !== 'object') s5.consequences = {};
    if (!Array.isArray(s5.consequences.nodes)) s5.consequences.nodes = [];
    if (!Array.isArray(s5.consequences.premortem)) s5.consequences.premortem = [];
    return s5;
  },

  /* Прямые следствия узла в порядке хранения. Корень адресуется null. */
  childrenOf: function (nodes, parentId) {
    return (nodes || []).filter(function (x) { return (x.parent || null) === (parentId || null); });
  },

  /* Глубина узла: корень нулевой. Считается по ссылкам вверх, с защитой
     от кольца, которое может приехать из чужого файла. */
  depthOf: function (nodes, node) {
    var byId = {};
    (nodes || []).forEach(function (x) { byId[x.id] = x; });
    var d = 0, cur = node, seen = {};
    while (cur && cur.parent && byId[cur.parent] && !seen[cur.id]) {
      seen[cur.id] = 1;
      cur = byId[cur.parent];
      d++;
      if (d > 50) break;
    }
    return d;
  },

  /* Можно ли добавить следствие: ветвление до трех уровней и не больше
     четырех следствий на узел. Раздел 5.6 ТЗ. */
  canBranch: function (nodes, node) {
    if (Schema.depthOf(nodes, node) + 1 >= C.TREE_DEPTH) return false;
    return Schema.childrenOf(nodes, node.id).length < C.TREE_KIDS_MAX;
  },

  /* Узел и все, что под ним. Нужно при удалении ветки. */
  subtreeIds: function (nodes, rootId) {
    var out = [rootId], added = true, guard = 0;
    while (added && guard++ < 50) {
      added = false;
      (nodes || []).forEach(function (x) {
        if (x.parent && out.indexOf(x.parent) >= 0 && out.indexOf(x.id) < 0) { out.push(x.id); added = true; }
      });
    }
    return out;
  },

  /* Сводка по дереву: сколько узлов с текстом и как они разложены. */
  treeStats: function (sit) {
    var nodes = (sit.step5 && sit.step5.consequences && sit.step5.consequences.nodes) || [];
    var filled = nodes.filter(function (x) { return String(x.text || '').trim(); });
    var s = { total: nodes.length, filled: filled.length, plus: 0, minus: 0, near: 0, far: 0 };
    filled.forEach(function (x) {
      s[x.sign === 'plus' ? 'plus' : 'minus']++;
      s[x.horizon === 'far' ? 'far' : 'near']++;
    });
    return s;
  },

  /* Раздел 6 ТЗ: решение и критерий заполнены, в дереве не меньше пяти
     узлов, пре-мортем не пуст. */
  step5Ready: function (sit) {
    var s5 = sit.step5 || {};
    var st = Schema.treeStats(sit);
    var pm = ((s5.consequences && s5.consequences.premortem) || []).filter(function (m) {
      return String(m.text || '').trim();
    });
    return !!(String(s5.decision || '').trim() && String(s5.criteria || '').trim() &&
      st.filled >= C.TREE_NODES_GREEN && pm.length > 0);
  },

  /* ---- шаг 4: нежелательные построения и блоки, раздел 5.5 ТЗ ---- */

  newThreat: function () {
    return { id: U.id('t_'), text: '', why: '', block: '', preemptive: false };
  },

  normalizeThreat: function (t) {
    return {
      id: String((t && t.id) || U.id('t_')),
      text: String((t && t.text) || ''),
      why: String((t && t.why) || ''),
      block: String((t && t.block) || ''),
      preemptive: !!(t && t.preemptive)
    };
  },

  ensureStep4: function (sit) {
    if (!sit.step4 || typeof sit.step4 !== 'object' || Array.isArray(sit.step4)) sit.step4 = { common: [], byRole: {} };
    if (!Array.isArray(sit.step4.common)) sit.step4.common = [];
    if (!sit.step4.byRole || typeof sit.step4.byRole !== 'object') sit.step4.byRole = {};
    return sit.step4;
  },
  step4ForRole: function (sit, roleId) {
    var s4 = Schema.ensureStep4(sit);
    if (!s4.byRole[roleId] || typeof s4.byRole[roleId] !== 'object') s4.byRole[roleId] = { threats: [] };
    if (!Array.isArray(s4.byRole[roleId].threats)) s4.byRole[roleId].threats = [];
    return s4.byRole[roleId];
  },

  /* Все угрозы, которые видит роль: общие плюс свои. Общие идут первыми
     и помечены, потому что правятся только в общем блоке. */
  threatsOf: function (sit, roleId) {
    var s4 = (sit && sit.step4) || {};
    var out = [];
    (s4.common || []).forEach(function (t, i) { out.push({ threat: t, common: true, index: i }); });
    var r = s4.byRole && s4.byRole[roleId];
    ((r && r.threats) || []).forEach(function (t, i) { out.push({ threat: t, common: false, index: i }); });
    return out.filter(function (x) { return x.threat && String(x.threat.text || '').trim(); });
  },

  /* Чем закрыта угроза: своим блоком или формулой шага 7, которая
     на нее сослалась. Раздел 5.8 ТЗ: связь видна с обеих сторон. */
  threatClosedBy: function (sit, roleId, threatId) {
    var out = { block: false, formula: null };
    var all = [];
    var s4 = (sit && sit.step4) || {};
    (s4.common || []).forEach(function (t) { all.push(t); });
    var r4 = s4.byRole && s4.byRole[roleId];
    ((r4 && r4.threats) || []).forEach(function (t) { all.push(t); });
    all.forEach(function (t) {
      if (t && t.id === threatId && String(t.block || '').trim()) out.block = true;
    });
    var s7 = (sit && sit.step7) || {};
    var take = function (list) {
      (list || []).forEach(function (f) {
        if (!out.formula && f && f.threatId === threatId && String(f.text || '').trim()) out.formula = f;
      });
    };
    take(s7.common);
    take(s7.byRole && s7.byRole[roleId] && s7.byRole[roleId].formulas);
    return out;
  },
  threatClosed: function (sit, roleId, threatId) {
    var c = Schema.threatClosedBy(sit, roleId, threatId);
    return !!(c.block || c.formula);
  },

  /* Сколько угроз роли закрыто. Раздел 6 ТЗ: зеленый требует двух. */
  threatsClosedCount: function (sit, roleId) {
    return Schema.threatsOf(sit, roleId).filter(function (x) {
      return Schema.threatClosed(sit, roleId, x.threat.id);
    }).length;
  },
  step4Ready: function (sit, roleId) {
    return Schema.threatsClosedCount(sit, roleId) >= C.THREATS_PER_ROLE;
  },

  /* Блоки на упреждение для роли: подсказка шага 8 и карточка репетиции. */
  preemptiveOf: function (sit, roleId) {
    return Schema.threatsOf(sit, roleId).filter(function (x) { return x.threat.preemptive; });
  },

  /* ---- шаг 6: ролевые соотношения, раздел 5.7 ТЗ ---- */

  ensureStep6: function (sit) {
    if (!sit.step6 || typeof sit.step6 !== 'object' || Array.isArray(sit.step6)) sit.step6 = { byRole: {}, cells: {} };
    if (!sit.step6.byRole || typeof sit.step6.byRole !== 'object') sit.step6.byRole = {};
    if (!sit.step6.cells || typeof sit.step6.cells !== 'object') sit.step6.cells = {};
    return sit.step6;
  },
  step6ForRole: function (sit, roleId) {
    var s6 = Schema.ensureStep6(sit);
    if (!s6.byRole[roleId] || typeof s6.byRole[roleId] !== 'object') s6.byRole[roleId] = { helpAny: '' };
    if (typeof s6.byRole[roleId].helpAny !== 'string') s6.byRole[roleId].helpAny = '';
    return s6.byRole[roleId];
  },
  cellKey: function (mine, theirs) { return mine + '|' + theirs; },
  newCell: function () { return { state: 'empty', notes: '', helpOverride: '' }; },
  normalizeCell: function (c) {
    var states = C.CELL_STATES.map(function (x) { return x.id; });
    var st = String((c && c.state) || 'empty');
    return {
      state: states.indexOf(st) >= 0 ? st : 'empty',
      notes: String((c && c.notes) || ''),
      helpOverride: String((c && c.helpOverride) || '')
    };
  },
  cellOf: function (sit, mine, theirs) {
    var s6 = Schema.ensureStep6(sit);
    var k = Schema.cellKey(mine, theirs);
    if (!s6.cells[k] || typeof s6.cells[k] !== 'object') s6.cells[k] = Schema.newCell();
    return s6.cells[k];
  },

  /* Разобрано столько-то из стольких-то. Диагональ в счет не идет,
     "как обычно" считается разобранным: раздел 5.7 ТЗ. */
  step6Progress: function (sit) {
    var roles = (sit.roles || []).map(function (r) { return r.id; });
    var total = 0, done = 0;
    roles.forEach(function (a) {
      roles.forEach(function (b) {
        if (a === b) return;
        total++;
        var c = (sit.step6 && sit.step6.cells && sit.step6.cells[Schema.cellKey(a, b)]) || null;
        if (c && c.state && c.state !== 'empty') done++;
      });
    });
    return { done: done, total: total };
  },
  step6Ready: function (sit) {
    var p = Schema.step6Progress(sit);
    var everyone = (sit.roles || []).every(function (r) {
      var d = sit.step6 && sit.step6.byRole && sit.step6.byRole[r.id];
      return d && String(d.helpAny || '').trim();
    });
    return everyone && p.total > 0 && p.done === p.total;
  },

  ensureStep7: function (sit) {
    if (!sit.step7 || typeof sit.step7 !== 'object' || Array.isArray(sit.step7)) sit.step7 = { common: [], byRole: {} };
    if (!Array.isArray(sit.step7.common)) sit.step7.common = [];
    if (!sit.step7.byRole || typeof sit.step7.byRole !== 'object') sit.step7.byRole = {};
    return sit.step7;
  },
  step7ForRole: function (sit, roleId) {
    var s7 = Schema.ensureStep7(sit);
    if (!s7.byRole[roleId] || typeof s7.byRole[roleId] !== 'object') s7.byRole[roleId] = { formulas: [] };
    if (!Array.isArray(s7.byRole[roleId].formulas)) s7.byRole[roleId].formulas = [];
    return s7.byRole[roleId];
  },

  /* Сколько формул каждого типа есть у роли. Раздел 6 ТЗ прямо требует
     считать сумму общего уровня и уровня роли. Пустой текст не считается. */
  formulaTypesOf: function (sit, roleId) {
    var out = {};
    var take = function (list) {
      (list || []).forEach(function (f) {
        if (f && String(f.text || '').trim()) out[f.type] = (out[f.type] || 0) + 1;
      });
    };
    var s7 = (sit && sit.step7) || {};
    take(s7.common);
    take(s7.byRole && s7.byRole[roleId] && s7.byRole[roleId].formulas);
    return out;
  },
  /* Закрыты ли все четыре типа: зеленая точка светофора по шагу 7. */
  formulasReady: function (sit, roleId) {
    var have = Schema.formulaTypesOf(sit, roleId);
    return C.FORMULA_REQUIRED.every(function (t) { return have[t]; });
  },

  step8ForRole: function (sit, roleId) {
    if (!sit.step8) sit.step8 = { byRole: {} };
    if (!sit.step8.byRole) sit.step8.byRole = {};
    if (!sit.step8.byRole[roleId]) sit.step8.byRole[roleId] = { firstPhrase: '', roleAssignment: '', roundGoal: '' };
    return sit.step8.byRole[roleId];
  },

  /* Приведение ситуации к полной схеме. Вызывается для всего, что пришло
     снаружи: из базы, из импортированного архива. Ничего не удаляет:
     разделы будущих версий переживают чтение старым клиентом. */
  normalizeSituation: function (s) {
    if (!s || typeof s !== 'object') return null;
    var base = Schema.newSituation();
    var out = {};
    var k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    for (k in s) if (Object.prototype.hasOwnProperty.call(s, k)) out[k] = s[k];

    out.id = String(out.id || U.id('s_'));
    out.title = String(out.title == null ? C.TITLE_DEFAULT : out.title);
    out.sourceText = String(out.sourceText || '');
    out.context = String(out.context || '');
    out.createdAt = Number(out.createdAt) || U.now();
    out.updatedAt = Number(out.updatedAt) || out.createdAt;
    out.deletedAt = Number(out.deletedAt) || 0;
    out.afterNotes = String(out.afterNotes || '');
    out.secondQuestions = (Array.isArray(out.secondQuestions) ? out.secondQuestions : [])
      .filter(function (q) { return q && typeof q === 'object'; })
      .map(Schema.normalizeQuestion);
    out.comments = (Array.isArray(out.comments) ? out.comments : [])
      .filter(function (c) { return c && typeof c === 'object'; })
      .map(Schema.normalizeComment)
      .filter(function (c) { return c.path; });   // комментарий без поля адресует пустоту

    if (!Array.isArray(out.roles)) out.roles = [];
    out.roles = out.roles.filter(function (r) { return r && typeof r === 'object'; }).map(function (r, i) {
      return {
        id: String(r.id || U.id('r_')),
        name: String(r.name || ''),
        short: String(r.short || Schema.shortOf(r.name)),
        order: Number(r.order) || (i + 1),
        hard: !!r.hard,
        interest: String(r.interest || '')
      };
    });
    while (out.roles.length < C.ROLES_MIN) {
      out.roles.push(Schema.newRole('Роль ' + (out.roles.length + 1), out.roles.length + 1));
    }
    if (out.roles.length > C.ROLES_MAX) out.roles = out.roles.slice(0, C.ROLES_MAX);

    // шаг 1
    var s1 = (out.step1 && typeof out.step1 === 'object') ? out.step1 : {};
    out.step1 = {
      fabula: String(s1.fabula || ''),
      plot: String(s1.plot || ''),
      essence: String(s1.essence || ''),
      retell: Array.isArray(s1.retell) ? s1.retell.slice(0, C.RETELL_COUNT).map(function (t) { return String(t || ''); }) : []
    };
    while (out.step1.retell.length < C.RETELL_COUNT) out.step1.retell.push('');

    // шаг 2
    var s2 = (out.step2 && typeof out.step2 === 'object') ? out.step2 : {};
    var notes = Schema.emptyLayerNotes();
    if (s2.layerNotes && typeof s2.layerNotes === 'object') {
      C.LAYERS.forEach(function (l) { notes[l.id] = String(s2.layerNotes[l.id] || ''); });
    }
    var layerIds = C.LAYERS.map(function (l) { return l.id; });
    out.step2 = {
      phrases: (Array.isArray(s2.phrases) ? s2.phrases : []).filter(function (p) { return p && typeof p === 'object'; })
        .map(function (p) {
          var out2 = {
            id: String(p.id || U.id('p_')),
            quote: String(p.quote || ''),
            purpose: String(p.purpose || ''),
            readings: (Array.isArray(p.readings) ? p.readings : []).map(function (r) {
              var lay = String((r && r.layer) || '');
              return {
                id: String((r && r.id) || U.id('rd_')),
                text: String((r && r.text) || ''),
                use: String((r && r.use) || ''),
                starred: !!(r && r.starred),
                layer: layerIds.indexOf(lay) >= 0 ? lay : ''
              };
            }),
            wordMeanings: (Array.isArray(p.wordMeanings) ? p.wordMeanings : []).map(function (m) {
              var lay2 = String((m && m.layer) || '');
              return {
                id: String((m && m.id) || U.id('wm_')),
                word: String((m && m.word) || ''),
                layer: layerIds.indexOf(lay2) >= 0 ? lay2 : '',
                text: String((m && m.text) || '')
              };
            }).filter(function (m) { return m.word; }),
            silent: (Array.isArray(p.silent) ? p.silent : []).filter(function (x) { return layerIds.indexOf(x) >= 0; }),
            layers: []
          };
          // поле layers производное, руками его больше не ставят
          out2.layers = Schema.layersOf(out2);
          return out2;
        }),
      layerNotes: notes
    };

    // шаг 3
    if (!out.step3 || typeof out.step3 !== 'object') out.step3 = {};
    if (!out.step3.byRole || typeof out.step3.byRole !== 'object') out.step3.byRole = {};
    // шаг 8
    if (!out.step8 || typeof out.step8 !== 'object') out.step8 = {};
    if (!out.step8.byRole || typeof out.step8.byRole !== 'object') out.step8.byRole = {};
    /* шаг 9: раунды это список, номер производный от места в нем.
       Роль, которой в ситуации больше нет, сбрасывается: раунд остается,
       ссылка в пустоту уходит. */
    var s9in = (out.step9 && typeof out.step9 === 'object' && !Array.isArray(out.step9)) ? out.step9 : {};
    var roleIds = out.roles.map(function (r) { return r.id; });
    var rounds = (Array.isArray(s9in.rounds) ? s9in.rounds : [])
      .filter(function (r) { return r && typeof r === 'object'; })
      .slice(0, C.ROUNDS_MAX)
      .map(function (r, i) { return Schema.normalizeRound(r, i, roleIds); });
    out.step9 = { strategy: String(s9in.strategy || ''), rounds: rounds };

    /* шаг 5: узлы дерева последствий лежат плоским списком со ссылкой
       на родителя. Ссылка в пустоту рвется, кольца разрываются, лишние
       уровни и лишние следствия отсекаются: дерево должно оставаться
       деревом, каким бы ни был файл снаружи. */
    var s5in = (out.step5 && typeof out.step5 === 'object' && !Array.isArray(out.step5)) ? out.step5 : {};
    var cin = (s5in.consequences && typeof s5in.consequences === 'object') ? s5in.consequences : {};
    var rawNodes = (Array.isArray(cin.nodes) ? cin.nodes : [])
      .filter(function (x) { return x && typeof x === 'object'; })
      .map(Schema.normalizeConsequence);
    var seenId = {};
    rawNodes = rawNodes.filter(function (x) {
      if (seenId[x.id]) return false;
      seenId[x.id] = 1;
      return true;
    });
    var alive5 = {};
    rawNodes.forEach(function (x) { alive5[x.id] = x; });
    var keep = [], kids = {};
    rawNodes.forEach(function (x) {
      // ссылка в пустоту: узел становится корневым, а не пропадает
      if (x.parent && !alive5[x.parent]) x.parent = null;
      // кольцо: узел, дошедший до самого себя, отвязывается
      var cur = alive5[x.parent], hops = 0;
      while (cur && hops++ < 60) {
        if (cur.id === x.id) { x.parent = null; break; }
        cur = alive5[cur.parent];
      }
    });
    rawNodes.forEach(function (x) {
      var d = Schema.depthOf(rawNodes, x);
      if (d >= C.TREE_DEPTH) return;                     // глубже трех уровней не держим
      var k = x.parent || '';
      kids[k] = (kids[k] || 0) + 1;
      if (kids[k] > C.TREE_KIDS_MAX) return;             // больше четырех следствий на узел
      keep.push(x);
    });
    // узел, чей родитель не уцелел, уходит вместе с ним: сирот в дереве не бывает
    var keptIds = {};
    keep.forEach(function (x) { keptIds[x.id] = 1; });
    keep = keep.filter(function (x) { return !x.parent || keptIds[x.parent]; });
    out.step5 = {
      judgeStatement: String(s5in.judgeStatement || ''),
      criteria: String(s5in.criteria || ''),
      decision: String(s5in.decision || ''),
      consequences: {
        nodes: keep,
        premortem: (Array.isArray(cin.premortem) ? cin.premortem : [])
          .filter(function (m) { return m && typeof m === 'object'; })
          .map(function (m) {
            return {
              id: String(m.id || U.id('m_')),
              text: String(m.text || ''),
              counter: String(m.counter || '')
            };
          })
      }
    };

    // шаг 4: общий уровень плюс уровень роли
    var s4in = (out.step4 && typeof out.step4 === 'object' && !Array.isArray(out.step4)) ? out.step4 : {};
    out.step4 = {
      common: (Array.isArray(s4in.common) ? s4in.common : [])
        .filter(function (t) { return t && typeof t === 'object'; })
        .map(Schema.normalizeThreat),
      byRole: {}
    };
    // шаг 6: общий ответ по ролям плюс матрица соотношений
    var s6in = (out.step6 && typeof out.step6 === 'object' && !Array.isArray(out.step6)) ? out.step6 : {};
    out.step6 = { byRole: {}, cells: {} };
    // шаг 7: общий уровень плюс уровень роли
    var s7in = (out.step7 && typeof out.step7 === 'object' && !Array.isArray(out.step7)) ? out.step7 : {};
    out.step7 = {
      common: (Array.isArray(s7in.common) ? s7in.common : [])
        .filter(function (f) { return f && typeof f === 'object'; })
        .map(Schema.normalizeSitFormula),
      byRole: {}
    };

    out.roles.forEach(function (r) {
      var a = out.step3.byRole[r.id];
      out.step3.byRole[r.id] = {
        heroVersion: String((a && a.heroVersion) || ''),
        assumptions: (a && Array.isArray(a.assumptions) ? a.assumptions : []).map(function (x) {
          return {
            id: String((x && x.id) || U.id('a_')),
            text: String((x && x.text) || ''),
            necessary: !!(x && x.necessary),
            sufficient: !!(x && x.sufficient)
          };
        })
      };
      var c4 = (s4in.byRole && s4in.byRole[r.id]) || null;
      out.step4.byRole[r.id] = {
        threats: (c4 && Array.isArray(c4.threats) ? c4.threats : [])
          .filter(function (t) { return t && typeof t === 'object'; })
          .map(Schema.normalizeThreat)
      };
      var c6 = (s6in.byRole && s6in.byRole[r.id]) || null;
      out.step6.byRole[r.id] = { helpAny: String((c6 && c6.helpAny) || '') };
      var c7 = (s7in.byRole && s7in.byRole[r.id]) || null;
      out.step7.byRole[r.id] = {
        formulas: (c7 && Array.isArray(c7.formulas) ? c7.formulas : [])
          .filter(function (f) { return f && typeof f === 'object'; })
          .map(Schema.normalizeSitFormula)
      };
      var b = out.step8.byRole[r.id];
      out.step8.byRole[r.id] = {
        firstPhrase: U.cut(String((b && b.firstPhrase) || ''), C.PHRASE_MAX),
        roleAssignment: String((b && b.roleAssignment) || ''),
        roundGoal: String((b && b.roundGoal) || '')
      };
    });

    /* Клетки матрицы соотношений переносятся только между живыми ролями:
       удалили роль - клетки с ней уходят вместе с ней. */
    var alive = {};
    out.roles.forEach(function (r) { alive[r.id] = 1; });
    var cellsIn = (s6in.cells && typeof s6in.cells === 'object') ? s6in.cells : {};
    Object.keys(cellsIn).forEach(function (k) {
      var pair = String(k).split('|');
      if (pair.length !== 2 || pair[0] === pair[1]) return;
      if (!alive[pair[0]] || !alive[pair[1]]) return;
      var c = Schema.normalizeCell(cellsIn[k]);
      if (c.state === 'empty' && !c.notes && !c.helpOverride) return;  // пустые не храним
      out.step6.cells[k] = c;
    });

    /* Ссылка формулы на угрозу переживает чтение только если угроза
       на месте: иначе связь молча указывала бы в пустоту. */
    var threatIds = {};
    (out.step4.common || []).forEach(function (t) { threatIds[t.id] = 1; });
    out.roles.forEach(function (r) {
      (out.step4.byRole[r.id].threats || []).forEach(function (t) { threatIds[t.id] = 1; });
    });
    var fixLinks = function (list) {
      (list || []).forEach(function (f) { if (f.threatId && !threatIds[f.threatId]) f.threatId = null; });
    };
    fixLinks(out.step7.common);
    out.roles.forEach(function (r) { fixLinks(out.step7.byRole[r.id].formulas); });

    return out;
  },

  /* Миграция корня. Раздел 11 ТЗ: понижение версии - отказ.
     Написана заранее, хотя мигрировать пока не с чего. */
  migrate: function (raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      var e0 = new Error('Файл не похож на архив приложения');
      e0.code = 'bad-file';
      throw e0;
    }
    var v = Number(raw.schema) || 1;
    if (v > C.SCHEMA) {
      var e1 = new Error('Данные сохранены более новой версией приложения (схема ' + v +
        ', эта версия понимает ' + C.SCHEMA + '). Открывать их нельзя: часть полей будет потеряна.');
      e1.code = 'schema-too-new';
      throw e1;
    }
    var root = U.clone(raw);
    if (v < 2) {
      // 1 -> 2: в первой схеме не было отдельного слоя настроек облака
      root.settings = root.settings || {};
      root.schema = 2;
    }
    root.schema = C.SCHEMA;

    var def = Schema.newSettings();
    var st = (root.settings && typeof root.settings === 'object') ? root.settings : {};
    root.settings = {
      roundsCount: Number(st.roundsCount) || def.roundsCount,
      roundMinutes: Number(st.roundMinutes) || def.roundMinutes,
      theme: (['auto', 'light', 'dark'].indexOf(st.theme) >= 0) ? st.theme : def.theme,
      expressMode: !!st.expressMode,
      cloud: {
        provider: String((st.cloud && st.cloud.provider) || def.cloud.provider),
        connected: !!(st.cloud && st.cloud.connected),
        lastSync: Number(st.cloud && st.cloud.lastSync) || 0,
        folderId: String((st.cloud && st.cloud.folderId) || ''),
        fileId: String((st.cloud && st.cloud.fileId) || ''),
        lastVersion: Number(st.cloud && st.cloud.lastVersion) || 0,
        pendingLocal: !!(st.cloud && st.cloud.pendingLocal)
      }
    };

    if (!Array.isArray(root.situations)) root.situations = [];
    root.situations = root.situations.map(Schema.normalizeSituation).filter(Boolean);
    if (!Array.isArray(root.formulaLibrary)) root.formulaLibrary = [];
    root.formulaLibrary = root.formulaLibrary.map(Schema.normalizeLibFormula).filter(Boolean);
    return root;
  }
};
/* ---------------------------------------------------------------------
   4. IDB. Единственное место в файле, где приложение обращается к базе
   браузера напрямую. Если такое обращение нашлось где-то еще - слой протек.
   --------------------------------------------------------------------- */
var IDB = (function () {
  var db = null;

  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      var req;
      try {
        req = indexedDB.open(C.DB_NAME, C.DB_VERSION);
      } catch (e) {
        return reject(e);
      }
      req.onupgradeneeded = function (ev) {
        var d = ev.target.result;
        if (!d.objectStoreNames.contains('situations')) d.createObjectStore('situations', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('formulas')) d.createObjectStore('formulas', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('history')) {
          var h = d.createObjectStore('history', { keyPath: 'seq', autoIncrement: true });
          h.createIndex('bySituation', 'situationId', { unique: false });
        }
        /* Автоснимки, раздел 3.1 ТЗ: целые состояния ситуации рядом
           с журналом отдельных правок. Заведены в схеме базы 2. */
        if (!d.objectStoreNames.contains('snapshots')) {
          var sn = d.createObjectStore('snapshots', { keyPath: 'seq', autoIncrement: true });
          sn.createIndex('bySituation', 'situationId', { unique: false });
        }
      };
      req.onsuccess = function () {
        db = req.result;
        db.onversionchange = function () { try { db.close(); } catch (e) {} db = null; };
        resolve(db);
      };
      req.onerror = function () { reject(req.error || new Error('Не удалось открыть базу данных')); };
      req.onblocked = function () { reject(new Error('База занята другой вкладкой приложения')); };
    });
  }

  function run(stores, mode, body) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(stores, mode);
        var out;
        tx.oncomplete = function () { resolve(out); };
        tx.onerror = function () { reject(tx.error || new Error('Ошибка записи в базу')); };
        tx.onabort = function () { reject(tx.error || new Error('Запись отменена')); };
        try {
          out = body(tx);
        } catch (e) {
          try { tx.abort(); } catch (e2) {}
          reject(e);
        }
      });
    });
  }

  return {
    open: open,

    // прочитать все хранилища разом
    readAll: function () {
      var res = { situations: [], meta: [], formulas: [] };
      return run(['situations', 'meta', 'formulas'], 'readonly', function (tx) {
        var a = tx.objectStore('situations').getAll();
        a.onsuccess = function () { res.situations = a.result || []; };
        var b = tx.objectStore('meta').getAll();
        b.onsuccess = function () { res.meta = b.result || []; };
        var f = tx.objectStore('formulas').getAll();
        f.onsuccess = function () { res.formulas = f.result || []; };
      }).then(function () { return res; });
    },

    /* Одна транзакция на всю пачку правок: либо записалось все, либо ничего.
       batch = { situations:[], removed:[id], meta:[{key,value}], history:[], trim:[sid],
                 formulas:[], formulasRemoved:[id] } */
    write: function (batch) {
      return run(['situations', 'meta', 'history', 'formulas'], 'readwrite', function (tx) {
        var sSit = tx.objectStore('situations');
        var sMeta = tx.objectStore('meta');
        var sHist = tx.objectStore('history');
        var sForm = tx.objectStore('formulas');

        (batch.situations || []).forEach(function (s) { sSit.put(s); });
        (batch.removed || []).forEach(function (id) { sSit.delete(id); });
        (batch.meta || []).forEach(function (m) { sMeta.put(m); });
        (batch.history || []).forEach(function (h) { sHist.add(h); });
        (batch.formulas || []).forEach(function (f) { sForm.put(f); });
        (batch.formulasRemoved || []).forEach(function (id) { sForm.delete(id); });

        // журнал: не больше C.HISTORY_PER_SITUATION записей на ситуацию
        (batch.trim || []).forEach(function (sid) {
          var idx = sHist.index('bySituation');
          var keys = [];
          var cur = idx.openCursor(IDBKeyRange.only(sid));
          cur.onsuccess = function (ev) {
            var c = ev.target.result;
            if (c) { keys.push(c.primaryKey); c.continue(); return; }
            var extra = keys.length - C.HISTORY_PER_SITUATION;
            for (var i = 0; i < extra; i++) sHist.delete(keys[i]);
          };
        });

        // журнал удаленной ситуации не нужен
        (batch.removed || []).forEach(function (sid) {
          var idx2 = sHist.index('bySituation');
          var cur2 = idx2.openCursor(IDBKeyRange.only(sid));
          cur2.onsuccess = function (ev) {
            var c = ev.target.result;
            if (c) { sHist.delete(c.primaryKey); c.continue(); }
          };
        });
      });
    },

    // полная замена содержимого: импорт архива
    replaceAll: function (situations, meta, formulas) {
      return run(['situations', 'meta', 'formulas', 'history', 'snapshots'], 'readwrite', function (tx) {
        tx.objectStore('situations').clear();
        tx.objectStore('meta').clear();
        tx.objectStore('formulas').clear();
        tx.objectStore('history').clear();
        tx.objectStore('snapshots').clear();
        situations.forEach(function (s) { tx.objectStore('situations').put(s); });
        meta.forEach(function (m) { tx.objectStore('meta').put(m); });
        (formulas || []).forEach(function (f) { tx.objectStore('formulas').put(f); });
      });
    },

    // служебные записи устройства: в облако не уходят, в модель данных не входят
    getMeta: function (key) {
      var out = null;
      return run(['meta'], 'readonly', function (tx) {
        var r = tx.objectStore('meta').get(key);
        r.onsuccess = function () { out = r.result ? r.result.value : null; };
      }).then(function () { return out; });
    },
    putMeta: function (key, value) {
      return run(['meta'], 'readwrite', function (tx) {
        if (value === null || value === undefined) tx.objectStore('meta').delete(key);
        else tx.objectStore('meta').put({ key: key, value: value });
      });
    },

    /* Снимок состояния ситуации целиком. Раздел 3.1 ТЗ: последние десять. */
    putSnapshot: function (situationId, data, ts) {
      return run(['snapshots'], 'readwrite', function (tx) {
        var st = tx.objectStore('snapshots');
        st.add({ situationId: situationId, ts: ts || Date.now(), data: data });
        var keys = [];
        var cur = st.index('bySituation').openCursor(IDBKeyRange.only(situationId));
        cur.onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { keys.push(c.primaryKey); c.continue(); return; }
          var extra = keys.length - C.SNAPSHOTS_PER_SITUATION;
          for (var i = 0; i < extra; i++) st.delete(keys[i]);
        };
      });
    },
    snapshotsOf: function (situationId) {
      var out = [];
      return run(['snapshots'], 'readonly', function (tx) {
        var cur = tx.objectStore('snapshots').index('bySituation').openCursor(IDBKeyRange.only(situationId));
        cur.onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { out.push(c.value); c.continue(); }
        };
      }).then(function () { return out; });
    },
    dropSnapshots: function (situationId) {
      return run(['snapshots'], 'readwrite', function (tx) {
        var st = tx.objectStore('snapshots');
        var cur = st.index('bySituation').openCursor(IDBKeyRange.only(situationId));
        cur.onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { st.delete(c.primaryKey); c.continue(); }
        };
      });
    },

    historyOf: function (situationId) {
      var out = [];
      return run(['history'], 'readonly', function (tx) {
        var idx = tx.objectStore('history').index('bySituation');
        var cur = idx.openCursor(IDBKeyRange.only(situationId));
        cur.onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { out.push(c.value); c.continue(); }
        };
      }).then(function () { return out; });
    }
  };
})();

/* ---------------------------------------------------------------------
   5. LocalAdapter. Реализация хранения поверх IDB.
   Позже рядом встанет CloudAdapter с тем же набором методов,
   и приложение об этом не узнает.
   --------------------------------------------------------------------- */
var LocalAdapter = {
  name: 'local',

  init: function () {
    return IDB.readAll().then(function (raw) {
      var metaMap = {};
      raw.meta.forEach(function (m) { metaMap[m.key] = m.value; });
      var root = Schema.migrate({
        schema: metaMap.schema || C.SCHEMA,
        settings: metaMap.settings || Schema.newSettings(),
        situations: raw.situations || [],
        formulaLibrary: raw.formulas || []
      });
      // первый запуск или база без служебных записей: доводим ее до порядка сразу,
      // чтобы версия схемы лежала в базе, а не подразумевалась
      if (metaMap.schema !== root.schema || !metaMap.settings) {
        return IDB.write({
          meta: [{ key: 'schema', value: root.schema }, { key: 'settings', value: root.settings }]
        }).then(function () { return root; });
      }
      return root;
    });
  },

  write: function (batch) { return IDB.write(batch); },

  readLocal: function (key) { return IDB.getMeta('local.' + key); },
  writeLocal: function (key, value) { return IDB.putMeta('local.' + key, value); },

  replaceAll: function (root) {
    var meta = [
      { key: 'schema', value: root.schema },
      { key: 'settings', value: root.settings }
    ];
    return IDB.replaceAll(root.situations, meta, root.formulaLibrary);
  },

  status: function () { return 'local'; }
};

/* ---------------------------------------------------------------------
   6. Storage. Единственная дверь к данным для всего интерфейса.
   Раздел 4 ТЗ: load, getSituation, patch, remove, subscribe, status.
   Добавлено в 0.1: create, setSetting, replaceAll (см. CHANGELOG).
   --------------------------------------------------------------------- */
var Storage = (function () {
  var adapter = LocalAdapter;
  var root = null;              // кеш состояния, живет все время работы
  var loading = null;
  var subs = [];
  var saveState = 'saved';      // saved | dirty | saving

  var dirtySits = Object.create(null);   // id -> true
  var removedSits = Object.create(null); // id -> true
  var dirtySettings = false;
  var lastSnap = Object.create(null);     // id ситуации -> когда снимали
  var dirtyForms = Object.create(null);   // id заготовки -> true
  var removedForms = Object.create(null); // id заготовки -> true
  var histPending = Object.create(null); // "sid|path" -> запись журнала
  var writing = false;
  var rewriteAfter = false;

  function emit(ev) { subs.forEach(function (fn) { try { fn(ev); } catch (e) {} }); }

  function setState(s) {
    if (saveState === s) return;
    saveState = s;
    emit({ type: 'save', state: s });
  }

  function markDirty() {
    setState('dirty');
    schedule();
  }

  var schedule = U.debounce(function () { flush().catch(function () {}); }, C.AUTOSAVE_MS);

  function collect() {
    var batch = { situations: [], removed: [], meta: [], history: [], trim: [], formulas: [], formulasRemoved: [] };
    var id;
    for (id in removedForms) batch.formulasRemoved.push(id);
    for (id in dirtyForms) {
      if (removedForms[id]) continue;
      var f0 = findFormula(id);
      if (f0) batch.formulas.push(U.clone(f0));
    }
    for (id in removedSits) batch.removed.push(id);
    for (id in dirtySits) {
      if (removedSits[id]) continue;
      var s = find(id);
      if (s) batch.situations.push(U.clone(s));
    }
    if (dirtySettings) {
      batch.meta.push({ key: 'settings', value: U.clone(root.settings) });
      batch.meta.push({ key: 'schema', value: root.schema });
    }
    var seen = Object.create(null);
    for (var k in histPending) {
      var h = histPending[k];
      if (removedSits[h.situationId]) continue;
      batch.history.push(h);
      if (!seen[h.situationId]) { seen[h.situationId] = true; batch.trim.push(h.situationId); }
    }
    return batch;
  }

  function flush() {
    schedule.cancel();
    /* Стоп-кран второй вкладки: раздел 11 ТЗ. Правки остаются в памяти
       и в очереди, но в базу не идут - иначе две вкладки затрут друг друга. */
    if (typeof Tabs !== 'undefined' && !Tabs.canWrite()) return Promise.resolve();
    if (writing) { rewriteAfter = true; return Promise.resolve(); }
    var batch = collect();
    var empty = !batch.situations.length && !batch.removed.length && !batch.meta.length &&
      !batch.history.length && !batch.formulas.length && !batch.formulasRemoved.length;
    if (empty) { setState('saved'); return Promise.resolve(); }

    dirtySits = Object.create(null);
    removedSits = Object.create(null);
    dirtySettings = false;
    dirtyForms = Object.create(null);
    removedForms = Object.create(null);
    histPending = Object.create(null);

    writing = true;
    setState('saving');
    var snapped = batch.situations.map(function (x) { return x.id; });
    return adapter.write(batch).then(function () {
      writing = false;
      if (typeof Tabs !== 'undefined') Tabs.announce();   // объявляем запись соседним вкладкам
      snapped.forEach(function (sid) { Storage.snapshot(sid); });
      if (rewriteAfter) { rewriteAfter = false; return flush(); }
      setState(hasPending() ? 'dirty' : 'saved');
    }).catch(function (err) {
      writing = false;
      // правки не выброшены: возвращаем их в очередь и говорим об этом вслух
      batch.situations.forEach(function (s) { dirtySits[s.id] = true; });
      batch.removed.forEach(function (id) { removedSits[id] = true; });
      if (batch.meta.length) dirtySettings = true;
      batch.formulas.forEach(function (f) { dirtyForms[f.id] = true; });
      batch.formulasRemoved.forEach(function (id) { removedForms[id] = true; });
      batch.history.forEach(function (h) { histPending[h.situationId + '|' + h.path] = h; });
      setState('dirty');
      emit({ type: 'error', error: err });
      throw err;
    });
  }

  function hasPending() {
    for (var a in dirtySits) return true;
    for (var b in removedSits) return true;
    for (var c in histPending) return true;
    for (var d in dirtyForms) return true;
    for (var e in removedForms) return true;
    return dirtySettings;
  }

  function find(id) {
    if (!root) return null;
    for (var i = 0; i < root.situations.length; i++) if (root.situations[i].id === id) return root.situations[i];
    return null;
  }

  function findFormula(id) {
    if (!root) return null;
    for (var i = 0; i < root.formulaLibrary.length; i++) if (root.formulaLibrary[i].id === id) return root.formulaLibrary[i];
    return null;
  }

  return {
    /* ---- раздел 4 ТЗ ---- */

    load: function () {
      if (root) return Promise.resolve(root);
      if (!loading) {
        loading = adapter.init().then(function (r) {
          root = r;
          loading = null;
          return root;
        }, function (e) { loading = null; throw e; });
      }
      return loading;
    },

    getSituation: function (id) { return find(id); },

    /* Точечное изменение поля с меткой времени.
       Путь адресует поле внутри ситуации: step8.byRole.r2.firstPhrase */
    patch: function (situationId, path, value) {
      var s = find(situationId);
      if (!s) return false;
      var old = U.getPath(s, path);
      if (U.same(old, value)) return false;

      U.setPath(s, path, value);
      s.updatedAt = U.now();
      dirtySits[s.id] = true;

      // журнал: правки одного поля подряд склеиваются в одну запись
      var key = s.id + '|' + path;
      var prev = histPending[key];
      histPending[key] = {
        situationId: s.id,
        path: path,
        oldValue: prev ? prev.oldValue : U.clone(old === undefined ? null : old),
        newValue: U.clone(value),
        ts: U.now()
      };
      markDirty();
      return true;
    },

    /* Мягкое удаление: ситуация уходит в корзину на 30 дней.
       Раздел 11 ТЗ. Стереть насовсем можно из корзины. */
    remove: function (id) {
      var s = find(id);
      if (!s || s.deletedAt) return false;
      s.deletedAt = U.now();
      s.updatedAt = U.now();
      dirtySits[id] = true;
      markDirty();
      return true;
    },

    restore: function (id) {
      var s = find(id);
      if (!s || !s.deletedAt) return false;
      s.deletedAt = 0;
      s.updatedAt = U.now();
      dirtySits[id] = true;
      markDirty();
      return true;
    },

    /* Окончательное удаление: из корзины или при чистке по сроку. */
    purge: function (id) {
      if (!root) return false;
      var i = root.situations.findIndex(function (s) { return s.id === id; });
      if (i < 0) return false;
      root.situations.splice(i, 1);
      removedSits[id] = true;
      delete dirtySits[id];
      markDirty();
      return true;
    },

    subscribe: function (fn) {
      subs.push(fn);
      return function () {
        var i = subs.indexOf(fn);
        if (i >= 0) subs.splice(i, 1);
      };
    },

    status: function () { return adapter.status(); },

    /* ---- добавлено в 0.1 ---- */

    create: function (situation) {
      if (!root) return null;
      var s = Schema.normalizeSituation(situation || Schema.newSituation());
      root.situations.push(s);
      dirtySits[s.id] = true;
      markDirty();
      return s;
    },

    setSetting: function (path, value) {
      if (!root) return false;
      var old = U.getPath(root.settings, path);
      if (U.same(old, value)) return false;
      U.setPath(root.settings, path, value);
      dirtySettings = true;
      markDirty();
      return true;
    },

    // импорт архива и, в будущем, ответ "взять облачную" из раздела 9.4 ТЗ
    replaceAll: function (nextRoot) {
      var next = Schema.migrate(nextRoot);
      schedule.cancel();
      dirtySits = Object.create(null);
      removedSits = Object.create(null);
      histPending = Object.create(null);
      dirtyForms = Object.create(null);
      removedForms = Object.create(null);
      dirtySettings = false;
      // корень меняется по месту: ссылки, которые держит интерфейс, остаются живыми
      root.schema = next.schema;
      root.settings = next.settings;
      root.situations.length = 0;
      next.situations.forEach(function (s) { root.situations.push(s); });
      root.formulaLibrary.length = 0;
      next.formulaLibrary.forEach(function (f) { root.formulaLibrary.push(f); });

      setState('saving');
      return adapter.replaceAll(root).then(function () {
        setState('saved');
        emit({ type: 'external' });
        return root;
      }).catch(function (err) {
        setState('dirty');
        emit({ type: 'error', error: err });
        throw err;
      });
    },

    /* ---- копилка формул, раздел 5.13 ТЗ ----
       Копилка живет рядом с ситуациями, а не внутри них: заготовка
       переживает ситуацию, из которой родилась. Журнал правок на нее
       не ведется - он привязан к ситуации по устройству хранилища. */

    formulas: function () { return root ? root.formulaLibrary : []; },
    getFormula: findFormula,

    addFormula: function (f) {
      if (!root) return null;
      var nf = Schema.normalizeLibFormula(f || Schema.newLibFormula());
      if (!nf) return null;
      root.formulaLibrary.push(nf);
      dirtyForms[nf.id] = true;
      markDirty();
      return nf;
    },

    patchFormula: function (id, path, value) {
      var f = findFormula(id);
      if (!f) return false;
      var old = U.getPath(f, path);
      if (U.same(old, value)) return false;
      U.setPath(f, path, value);
      dirtyForms[id] = true;
      markDirty();
      return true;
    },

    removeFormula: function (id) {
      if (!root) return false;
      var i = root.formulaLibrary.findIndex(function (f) { return f.id === id; });
      if (i < 0) return false;
      root.formulaLibrary.splice(i, 1);
      removedForms[id] = true;
      delete dirtyForms[id];
      markDirty();
      return true;
    },

    /* ---- служебное ---- */
    current: function () { return root; },   // кеш без промиса, для тех, кто уже дождался load

    /* Записи, привязанные к устройству: в модель данных не входят,
       в архив не попадают, в облако не уходят. */
    readLocal: function (key) { return adapter.readLocal ? adapter.readLocal(key) : Promise.resolve(null); },
    writeLocal: function (key, value) { return adapter.writeLocal ? adapter.writeLocal(key, value) : Promise.resolve(); },

    /* Перечитать состояние с диска: вторая вкладка изменила базу,
       а на экране списка терять нечего. */
    reload: function () {
      if (!root) return Promise.resolve(null);
      return LocalAdapter.init().then(function (next) {
        root.schema = next.schema;
        root.situations.length = 0;
        next.situations.forEach(function (x) { root.situations.push(x); });
        root.formulaLibrary.length = 0;
        next.formulaLibrary.forEach(function (f) { root.formulaLibrary.push(f); });
        emit({ type: 'external' });
        return root;
      });
    },

    /* Автоснимки, раздел 3.1 ТЗ. Снимок пишется не чаще, чем раз
       в две минуты на ситуацию: снимок на каждую букву не нужен. */
    snapshot: function (id) {
      var s = find(id);
      if (!s) return Promise.resolve(false);
      var now = U.now();
      if (lastSnap[id] && now - lastSnap[id] < C.SNAPSHOT_MS) return Promise.resolve(false);
      lastSnap[id] = now;
      return IDB.putSnapshot(id, U.clone(s), now).then(function () { return true; }, function () { return false; });
    },
    snapshotsOf: function (id) { return IDB.snapshotsOf(id); },

    /* Вернуть ситуацию к состоянию снимка целиком. Прежнее состояние
       уходит в снимки перед заменой: откат тоже должен быть обратим. */
    restoreSnapshot: function (id, data) {
      var s = find(id);
      if (!s || !data) return Promise.resolve(false);
      return IDB.putSnapshot(id, U.clone(s), U.now()).catch(function () {}).then(function () {
        var next = Schema.normalizeSituation(U.clone(data));
        if (!next) return false;
        next.id = s.id;
        next.updatedAt = U.now();
        Object.keys(s).forEach(function (k) { if (!(k in next)) delete s[k]; });
        Object.keys(next).forEach(function (k) { s[k] = next[k]; });
        lastSnap[id] = 0;
        dirtySits[id] = true;
        markDirty();
        return true;
      });
    },

    flush: flush,
    saveState: function () { return saveState; },
    hasPending: hasPending,
    historyOf: function (id) { return IDB.historyOf(id); },
    useAdapter: function (a) { adapter = a; }
  };
})();
/* ---------------------------------------------------------------------
   6a. GoogleAuth. Вход без сторонних библиотек.
   Окно входа открывается на адрес Google, возвращается на наш же адрес
   с токеном в хвосте ссылки. Токен живет только в памяти вкладки:
   ни в базе, ни в ключ-значение хранилищах он не оседает.
   --------------------------------------------------------------------- */
var GoogleAuth = (function () {
  var token = null;      // { value, exp }
  var stateKey = '';
  var waiting = null;    // { resolve, reject, timer }

  function redirectUri() {
    // должен совпасть с зарегистрированным в консоли Google буква в букву
    var p = window.location.pathname.replace(/index\.html$/i, '');
    return window.location.origin + p;
  }

  function authUrl() {
    stateKey = U.id('st_') + U.id('');
    var q = [
      'client_id=' + encodeURIComponent(C.CLOUD.CLIENT_ID),
      'redirect_uri=' + encodeURIComponent(redirectUri()),
      'response_type=token',
      'scope=' + encodeURIComponent(C.CLOUD.SCOPE),
      'include_granted_scopes=true',
      'state=' + encodeURIComponent(stateKey)
    ];
    return C.CLOUD.AUTH_URL + '?' + q.join('&');
  }

  function accept(p) {
    if (!p) return;
    if (p.state && stateKey && p.state !== stateKey) {
      finish(null, new Error('Ответ входа не совпал с запросом'));
      return;
    }
    if (p.error) {
      finish(null, new Error(p.error === 'access_denied' ? 'Вход отменен' : ('Google вернул ошибку: ' + p.error)));
      return;
    }
    if (!p.access_token) return;
    token = {
      value: p.access_token,
      exp: U.now() + (Number(p.expires_in) || 3600) * 1000 - 60000
    };
    // кладем в базу устройства: Safari на iPhone выгружает страницу из памяти
    // при каждом переключении приложений, и без этого вход просили бы заново
    Storage.writeLocal('auth', token).catch(function () {});
    finish(token, null);
  }

  function finish(tok, err) {
    if (!waiting) return;
    var w = waiting;
    waiting = null;
    if (w.timer) clearTimeout(w.timer);
    if (err) w.reject(err); else w.resolve(tok);
  }

  window.addEventListener('message', function (ev) {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || !ev.data.ppOAuth) return;
    accept(ev.data.ppOAuth);
  });

  return {
    redirectUri: redirectUri,
    authUrl: authUrl,
    accept: accept,

    has: function () { return !!token && token.exp > U.now(); },
    value: function () { return token ? token.value : ''; },
    drop: function () {
      token = null;
      Storage.writeLocal('auth', null).catch(function () {});
    },
    expiresIn: function () { return token ? Math.max(0, token.exp - U.now()) : 0; },

    /* Поднять вход, переживший перезагрузку страницы. */
    restore: function () {
      return Storage.readLocal('auth').then(function (t) {
        if (t && t.value && Number(t.exp) > U.now()) { token = t; return true; }
        if (t) Storage.writeLocal('auth', null).catch(function () {});
        return false;
      }).catch(function () { return false; });
    },

    /* Вход. Вызывается только по нажатию кнопки: без жеста браузер
       не даст открыть окно. Если окно заблокировано, уходим на вход
       прямо этой вкладкой, правки к этому моменту уже сохранены. */
    signIn: function () {
      if (GoogleAuth.has()) return Promise.resolve(token);
      if (!C.CLOUD.CLIENT_ID) return Promise.reject(new Error('Идентификатор клиента Google не задан в коде приложения'));
      var url = authUrl();
      var win = null;
      try {
        win = window.open(url, 'pp_google_auth', 'width=520,height=680,menubar=no,toolbar=no');
      } catch (e) { win = null; }
      if (!win) {
        return Storage.flush().catch(function () {}).then(function () {
          window.location.href = url;
          return new Promise(function () {});
        });
      }
      return new Promise(function (resolve, reject) {
        waiting = { resolve: resolve, reject: reject, timer: null };
        waiting.timer = setTimeout(function () {
          finish(null, new Error('Вход не завершен за две минуты'));
        }, 120000);
        var watch = setInterval(function () {
          if (win.closed) {
            clearInterval(watch);
            setTimeout(function () { finish(null, new Error('Окно входа закрыто')); }, 400);
          }
          if (!waiting) clearInterval(watch);
        }, 500);
      });
    }
  };
})();

/* ---------------------------------------------------------------------
   6b. Drive. Три операции: найти, прочитать, записать.
   Область доступа drive.file: приложение видит только то, что создало само.
   --------------------------------------------------------------------- */
var Drive = (function () {
  function req(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers.Authorization = 'Bearer ' + GoogleAuth.value();
    if (!navigator.onLine) return Promise.reject(mkErr('offline', 'Нет связи'));
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) {
        GoogleAuth.drop();
        return Promise.reject(mkErr('needauth', 'Доступ к Диску потерян, нужен вход заново'));
      }
      if (!r.ok) {
        return r.text().then(function (t) {
          var body = String(t);
          /* 403 у Google означает и потерю доступа, и превышение частоты запросов.
             Вход сбрасываем только в первом случае, иначе значок желтел бы на ровном месте. */
          if (r.status === 403 && /authError|insufficientPermissions|Invalid Credentials|invalid_token/i.test(body)) {
            GoogleAuth.drop();
            return Promise.reject(mkErr('needauth', 'Доступ к Диску потерян, нужен вход заново'));
          }
          return Promise.reject(mkErr('api', 'Диск ответил ' + r.status + '. ' + body.slice(0, 160)));
        });
      }
      return r;
    }, function () {
      return Promise.reject(mkErr('offline', 'Нет связи с Диском'));
    });
  }

  function mkErr(code, msg) {
    var e = new Error(msg);
    e.code = code;
    return e;
  }

  function list(q) {
    var url = C.CLOUD.API + '/files?q=' + encodeURIComponent(q) +
      '&spaces=drive&fields=' + encodeURIComponent('files(id,name,modifiedTime)') + '&pageSize=10';
    return req(url).then(function (r) { return r.json(); }).then(function (j) { return j.files || []; });
  }

  return {
    mkErr: mkErr,

    findFolder: function (name) {
      return list("name='" + name + "' and mimeType='application/vnd.google-apps.folder' and trashed=false")
        .then(function (f) { return f.length ? f[0].id : ''; });
    },

    createFolder: function (name) {
      return req(C.CLOUD.API + '/files?fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ name: name, mimeType: 'application/vnd.google-apps.folder' })
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    },

    findFile: function (folderId, name) {
      return list("'" + folderId + "' in parents and name='" + name + "' and trashed=false")
        .then(function (f) { return f.length ? f[0].id : ''; });
    },

    read: function (fileId) {
      return req(C.CLOUD.API + '/files/' + encodeURIComponent(fileId) + '?alt=media')
        .then(function (r) { return r.text(); })
        .then(function (t) {
          try { return JSON.parse(t); }
          catch (e) { throw mkErr('bad-file', 'Файл на Диске поврежден и не читается как JSON'); }
        });
    },

    create: function (folderId, name, obj) {
      var b = '-------pp' + U.id('b');
      var meta = { name: name, mimeType: 'application/json', parents: [folderId] };
      var body =
        '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
        '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(obj) +
        '\r\n--' + b + '--';
      return req(C.CLOUD.UPLOAD + '/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + b },
        body: body
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    },

    update: function (fileId, obj) {
      return req(C.CLOUD.UPLOAD + '/files/' + encodeURIComponent(fileId) + '?uploadType=media&fields=id', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(obj)
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    }
  };
})();

/* ---------------------------------------------------------------------
   6c. Cloud. Зеркало состояния в файле на Диске.
   Раздел 9.2 ТЗ: четыре точки обмена, фонового опроса нет.
   Раздел 9.4: автоматического слияния нет, при расхождении спрашиваем.
   --------------------------------------------------------------------- */
var Cloud = (function () {
  var st = 'off';        // off | idle | busy | offline | needauth | conflict | error
  var lastError = '';
  var subs = [];
  var pushTimer = null;
  var running = false;
  var askConflict = null; // App подставляет сюда свой вопрос пользователю

  function emit() { subs.forEach(function (fn) { try { fn(st, lastError); } catch (e) {} }); }
  function set(s, err) {
    st = s;
    lastError = err || '';
    emit();
  }

  function cfg() {
    var r = Storage.current();
    return (r && r.settings && r.settings.cloud) || Schema.newSettings().cloud;
  }
  function saveCfg(patch) {
    var k;
    for (k in patch) Storage.setSetting('cloud.' + k, patch[k]);
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' :
      /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' :
        /Windows/.test(ua) ? 'Windows' : 'браузер';
    var br = /CriOS|Chrome/.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' :
      /Safari/.test(ua) ? 'Safari' : 'браузер';
    return br + ' на ' + os;
  }

  /* Что уходит в облако. Блок настроек синхронизации остается местным:
     у каждого устройства свой номер файла, свой токен и свое состояние. */
  function payload(root, version) {
    var state = U.clone(root);
    delete state.settings.cloud;
    return {
      app: 'poedinok-prep',
      format: 1,
      version: version,
      device: deviceName(),
      savedAt: U.now(),
      state: state
    };
  }

  function unpack(file, localRoot) {
    if (!file || file.app !== 'poedinok-prep' || !file.state) {
      throw Drive.mkErr('bad-file', 'Это не файл приложения «Подготовка к поединку»');
    }
    var next = Schema.migrate(file.state);
    next.settings.cloud = U.clone(localRoot.settings.cloud); // местное не трогаем
    return next;
  }

  /* Чистое решение о том, что делать. Вынесено отдельно, чтобы проверять без сети. */
  function decide(remoteVersion, lastVersion, pendingLocal) {
    if (remoteVersion === null) return 'create';
    if (remoteVersion === lastVersion) return pendingLocal ? 'push' : 'nothing';
    if (remoteVersion > lastVersion) return pendingLocal ? 'ask' : 'pull';
    return 'push'; // в облаке версия старше нашей: наша новее, дописываем
  }

  function ensurePlace() {
    var c = cfg();
    if (c.folderId && c.fileId) return Promise.resolve();
    return Promise.resolve(c.folderId || Drive.findFolder(C.CLOUD.FOLDER))
      .then(function (fid) { return fid || Drive.createFolder(C.CLOUD.FOLDER); })
      .then(function (fid) {
        saveCfg({ folderId: fid });
        return Drive.findFile(fid, C.CLOUD.FILE);
      })
      .then(function (id) { saveCfg({ fileId: id || '' }); });
  }

  function readRemote() {
    var c = cfg();
    if (!c.fileId) return Promise.resolve(null);
    return Drive.read(c.fileId);
  }

  function writeRemote(root, version) {
    var c = cfg();
    var obj = payload(root, version);
    var p = c.fileId ? Drive.update(c.fileId, obj) : Drive.create(c.folderId, C.CLOUD.FILE, obj);
    return p.then(function (id) {
      saveCfg({ fileId: id, lastVersion: version, lastSync: U.now(), pendingLocal: false });
      return version;
    });
  }

  /* Одна попытка обмена. reason: 'open' | 'focus' | 'idle' | 'hide' | 'manual' */
  function sync(reason) {
    var c = cfg();
    if (!c.connected) return Promise.resolve('off');
    if (running) return Promise.resolve('busy');
    if (!navigator.onLine) { set('offline'); return Promise.resolve('offline'); }
    if (!GoogleAuth.has()) { set('needauth'); return Promise.resolve('needauth'); }

    running = true;
    set('busy');
    var root;
    return Storage.load()
      .then(function (r) { root = r; return Storage.flush().catch(function () {}); })
      .then(ensurePlace)
      .then(readRemote)
      .then(function (remote) {
        var c2 = cfg();
        var remoteVersion = remote ? (Number(remote.version) || 0) : null;
        var action = decide(remoteVersion, Number(c2.lastVersion) || 0, !!c2.pendingLocal);

        if (action === 'nothing') { saveCfg({ lastSync: U.now() }); return 'ok'; }
        if (action === 'create') return writeRemote(root, 1).then(function () { return 'ok'; });
        if (action === 'push') return writeRemote(root, (remoteVersion || 0) + 1).then(function () { return 'ok'; });
        if (action === 'pull') {
          var next = unpack(remote, root);
          return Storage.replaceAll(next).then(function () {
            saveCfg({ lastVersion: remoteVersion, lastSync: U.now(), pendingLocal: false });
            return 'pulled';
          });
        }
        // расхождение: молча не решаем, спрашиваем
        set('conflict');
        if (!askConflict) return 'conflict';
        return askConflict({
          remoteVersion: remoteVersion,
          localVersion: Number(c2.lastVersion) || 0,
          device: remote.device || '',
          savedAt: Number(remote.savedAt) || 0
        }).then(function (answer) {
          if (answer === 'remote') {
            var next2 = unpack(remote, root);
            return Storage.replaceAll(next2).then(function () {
              saveCfg({ lastVersion: remoteVersion, lastSync: U.now(), pendingLocal: false });
              return 'pulled';
            });
          }
          if (answer === 'local') {
            return writeRemote(root, remoteVersion + 1).then(function () { return 'ok'; });
          }
          return 'conflict';
        });
      })
      .then(function (res) {
        running = false;
        if (res === 'conflict') set('conflict');
        else set('idle');
        return res;
      })
      .catch(function (e) {
        running = false;
        if (e && e.code === 'offline') set('offline');
        else if (e && e.code === 'needauth') set('needauth');
        else set('error', e && e.message ? e.message : String(e));
        return 'error';
      });
  }

  return {
    decide: decide,
    payload: payload,
    unpack: unpack,
    deviceName: deviceName,

    state: function () { return st; },
    error: function () { return lastError; },
    subscribe: function (fn) { subs.push(fn); return function () { var i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; },
    onConflict: function (fn) { askConflict = fn; },

    connected: function () { return !!cfg().connected; },
    sync: sync,

    /* Первое подключение. Раздел 9.5 ТЗ. */
    connect: function () {
      return GoogleAuth.signIn().then(function () {
        Storage.setSetting('cloud.connected', true);
        Storage.setSetting('cloud.provider', 'google');
        return sync('open');
      });
    },

    signInAgain: function () {
      return GoogleAuth.signIn().then(function () { return sync('manual'); });
    },

    /* Поднять вход после перезагрузки страницы и, если он жив, сразу обменяться. */
    resume: function () {
      return GoogleAuth.restore().then(function (alive) {
        if (!cfg().connected) { set('off'); return 'off'; }
        if (!alive) { set('needauth'); return 'needauth'; }
        return sync('open');
      });
    },

    disconnect: function () {
      GoogleAuth.drop();
      Storage.setSetting('cloud.connected', false);
      Storage.setSetting('cloud.fileId', '');
      Storage.setSetting('cloud.folderId', '');
      Storage.setSetting('cloud.lastVersion', 0);
      Storage.setSetting('cloud.pendingLocal', false);
      set('off');
      return Storage.flush().catch(function () {});
    },

    /* Правка данных: помечаем, что местное ушло вперед, и через 20 секунд
       тишины отправляем. Раздел 9.2, точка 3. */
    touched: function () {
      if (!cfg().connected) return;
      if (!cfg().pendingLocal) Storage.setSetting('cloud.pendingLocal', true);
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        pushTimer = null;
        sync('idle');
      }, C.CLOUD.IDLE_SYNC_MS);
    },

    flushNow: function (reason) {
      if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
      return sync(reason || 'manual');
    }
  };
})();

/* ---------------------------------------------------------------------
   6d. CloudAdapter. Тот же интерфейс, что у LocalAdapter (раздел 4 ТЗ):
   IndexedDB остается основным хранилищем, облако добавляется сверху.
   --------------------------------------------------------------------- */
function makeCloudAdapter(base) {
  return {
    name: 'cloud',
    init: function () { return base.init(); },
    readLocal: function (k) { return base.readLocal(k); },
    writeLocal: function (k, v) { return base.writeLocal(k, v); },
    write: function (batch) {
      return base.write(batch).then(function (r) {
        var onlyCloudMeta = !batch.situations.length && !batch.removed.length && !batch.history.length;
        if (!onlyCloudMeta) Cloud.touched();
        return r;
      });
    },
    replaceAll: function (root) { return base.replaceAll(root); },
    status: function () {
      var s = Cloud.state();
      if (s === 'off') return 'local';
      if (s === 'offline' || s === 'needauth' || s === 'error') return 'cloud-offline';
      return 'cloud-online';
    }
  };
}
