  function step1Body(sit) {
    var s1 = sit.step1;
    var ret = '';
    for (var i = 0; i < C.RETELL_COUNT; i++) {
      ret += '<div class="field">' +
        '<span class="label">Предложение ' + (i + 1) + '</span>' +
        textarea({ id: 'rt' + i, path: 'step1.retell.' + i, value: s1.retell[i], rows: 2, max: C.RETELL_MAX }) +
        '</div>';
    }
    return '<details class="det"><summary>Что такое фабула, сюжет и суть</summary><div class="det-b">' +
      '<p><b>Фабула</b> («что произошло» как набор фактов по времени): кто что сделал и когда, без режиссуры рассказа. Отвечает на вопрос «что было дальше?».</p>' +
      '<p><b>Сюжет</b> («как это рассказывают или организуют»): последовательность и связь описания событий, обычно с причинно-следственными переходами и акцентами. Отвечает на вопрос «как и почему это подано именно так?».</p>' +
      '<p><b>Суть</b> («в чем главный смысл, конфликт или проблема»): смысловое ядро, главный конфликт, интересы сторон, ключевая проблема и критерий, по которому ситуация будет оценена. Часто формируется одной фразой: «это спор о...», «это история про...», «центральный вопрос: ...».</p>' +
      '</div></details>' +
      field('Фабула', '', '<textarea rows="4" data-field="step1.fabula" placeholder="Кто что сделал и когда">' + U.esc(s1.fabula) + '</textarea>') +
      field('Сюжет', '', '<textarea rows="4" data-field="step1.plot" placeholder="Как и почему это подано именно так">' + U.esc(s1.plot) + '</textarea>') +
      field('Суть', '', '<textarea rows="3" data-field="step1.essence" placeholder="Это спор о...">' + U.esc(s1.essence) + '</textarea>') +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Пересказ в трех предложениях</h3>' +
      '<div class="hint">По ' + C.RETELL_MAX + ' символов на предложение.</div>' +
      ret;
  }

  /* ---- шаг 2 ---- */

  /* Подсветка разобранных кусков прямо в тексте ситуации.
     Ищем первое незанятое вхождение цитаты: так видно, чего вы не трогали. */
  function markSource(text, phrases) {
    var t = String(text || '');
    var used = [], missing = {};
    phrases.forEach(function (p, i) {
      var q = String(p.quote || '').trim();
      if (!q) { missing[p.id] = true; return; }
      var from = 0, pos = -1;
      while (true) {
        pos = t.indexOf(q, from);
        if (pos < 0) break;
        var end = pos + q.length;
        var busy = used.some(function (r) { return pos < r.end && end > r.start; });
        if (!busy) break;
        from = pos + 1;
      }
      if (pos < 0) { missing[p.id] = true; return; }
      used.push({ start: pos, end: pos + q.length, n: i + 1 });
    });
    used.sort(function (a, b) { return a.start - b.start; });
    var html = '', at = 0;
    used.forEach(function (r) {
      html += U.esc(t.slice(at, r.start));
      // номер рисуется средствами стиля: иначе он попадал бы в выделение мышью
      html += '<mark class="q" data-n="' + r.n + '">' + U.esc(t.slice(r.start, r.end)) + '</mark>';
      at = r.end;
    });
    html += U.esc(t.slice(at));
    return { html: html || '<span class="muted">Текст ситуации пуст. Вставьте его в разделе «Текст и роли».</span>', missing: missing };
  }

  function layerChips(phraseIndex, layers) {
    return '<div class="chips">' + C.LAYERS.map(function (l) {
      var on = layers.indexOf(l.id) >= 0;
      return '<button class="chip' + (on ? ' on' : '') + '" data-act="layer" data-i="' + phraseIndex +
        '" data-layer="' + l.id + '" title="' + U.esc(l.about) + '">' + U.esc(l.name) + '</button>';
    }).join('') + '</div>';
  }

  function step2Body(sit, tab) {
    var s2 = sit.step2;
    var src = markSource(sit.sourceText, s2.phrases);

    var head =
      '<details class="det" open><summary>Текст ситуации</summary><div class="det-b">' +
      '<div class="src" id="src-text">' + src.html + '</div>' +
      '<div class="hint" style="margin-top:10px">Выделите кусок текста: кнопка «В разбор» появится прямо у выделения. Разобранное подсвечивается и нумеруется.</div>' +
      '<div class="selhint" id="sel-hint"></div>' +
      '<div class="row">' +
      '<button class="btn btn-sm" data-act="to-analysis">' + Icons('plus', 16) + 'В разбор</button>' +
      '<button class="btn btn-sm" data-act="add-phrase">Добавить фразу вручную</button>' +
      '</div></div></details>' +
      '<button class="selbtn" id="sel-btn" data-act="to-analysis">' + Icons('plus', 18) + 'В разбор</button>' +
      '<div class="tabs">' +
      '<button class="tab' + (tab !== 'matrix' ? ' on' : '') + '" data-act="s2tab" data-tab="phrases">Фразы (' + s2.phrases.length + ')</button>' +
      '<button class="tab' + (tab === 'matrix' ? ' on' : '') + '" data-act="s2tab" data-tab="matrix">Матрица слоев</button>' +
      '</div>';

    if (tab === 'matrix') return head + step2Matrix(s2);

    if (!s2.phrases.length) {
      return head + '<div class="empty">Ни одной фразы пока не разобрано.<br>Выделите кусок текста выше и нажмите «В разбор».</div>';
    }

    var body = s2.phrases.map(function (p, i) {
      var base = 'step2.phrases.' + i;
      var readings = p.readings.map(function (r, j) {
        var rb = base + '.readings.' + j;
        return '<div class="reading">' +
          '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
          '<textarea rows="2" data-field="' + rb + '.text" placeholder="Трактовка">' + U.esc(r.text) + '</textarea>' +
          '<button class="btn btn-ghost btn-icon' + (r.starred ? ' starred' : '') + '" data-act="star" data-i="' + i + '" data-j="' + j +
          '" title="Отметить главной" aria-label="Отметить главной">' + Icons(r.starred ? 'star_on' : 'star') + '</button>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-reading" data-i="' + i + '" data-j="' + j +
          '" title="Удалить трактовку" aria-label="Удалить трактовку">' + Icons('trash') + '</button>' +
          '</div>' +
          '<textarea rows="2" data-field="' + rb + '.use" placeholder="Что это дает в переговорах">' + U.esc(r.use) + '</textarea>' +
          '</div>';
      }).join('');

      return '<div class="card phrase">' +
        '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
        '<span class="pnum">' + (i + 1) + '</span>' +
        '<textarea rows="2" data-field="' + base + '.quote" placeholder="Фрагмент текста ситуации">' + U.esc(p.quote) + '</textarea>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-phrase" data-i="' + i + '" title="Удалить фразу" aria-label="Удалить фразу">' + Icons('trash') + '</button>' +
        '</div>' +
        (src.missing[p.id] ? '<div class="asm-warn">' + Icons('alert', 15) + 'Этого куска в тексте ситуации нет: текст правили после разбора</div>' : '') +
        '<div class="field" style="margin-top:12px"><span class="label">Зачем эта фраза в тексте</span>' +
        '<textarea rows="2" data-field="' + base + '.purpose" placeholder="Смысл и причина существования фразы">' + U.esc(p.purpose) + '</textarea></div>' +
        '<div class="label">Трактовки</div>' +
        (readings || '<div class="muted" style="margin-bottom:8px">Ни одной трактовки. Их полезно иметь хотя бы две.</div>') +
        '<div class="row"><button class="btn btn-sm" data-act="add-reading" data-i="' + i + '">' + Icons('plus', 16) + 'Добавить трактовку</button></div>' +
        '<div class="label" style="margin-top:14px">Слои</div>' +
        layerChips(i, p.layers) +
        '</div>';
    }).join('');

    return head + body +
      '<div class="row"><button class="btn" data-act="add-phrase">' + Icons('plus') + 'Добавить фразу</button></div>';
  }

  function step2Matrix(s2) {
    var usedCount = 0;
    var cols = C.LAYERS.map(function (l) {
      var used = s2.phrases.some(function (p) { return p.layers.indexOf(l.id) >= 0; });
      if (used) usedCount++;
      return '<th class="' + (used ? '' : 'idle') + '" title="' + U.esc(l.name) + '">' + U.esc(l.short) + '</th>';
    }).join('');

    var rows = s2.phrases.map(function (p, i) {
      var q = String(p.quote || '').trim();
      var cells = C.LAYERS.map(function (l) {
        var on = p.layers.indexOf(l.id) >= 0;
        return '<td class="' + (on ? 'on' : '') + '">' + (on ? Icons('check', 14) : '') + '</td>';
      }).join('');
      return '<tr><td class="qcell"><span class="pnum">' + (i + 1) + '</span> ' +
        U.esc(q.length > C.QUOTE_PREVIEW ? U.cut(q, C.QUOTE_PREVIEW) + '...' : (q || 'без цитаты')) + '</td>' + cells + '</tr>';
    }).join('');

    var notes = C.LAYERS.map(function (l) {
      return '<div class="field">' +
        '<details class="det"><summary>' + U.esc(l.name) + '</summary><div class="det-b">' + U.esc(l.about) + '</div></details>' +
        '<textarea rows="2" data-field="step2.layerNotes.' + l.id + '" placeholder="Что в этой ситуации относится к слою">' +
        U.esc(s2.layerNotes[l.id]) + '</textarea></div>';
    }).join('');

    return '<div class="muted" style="margin:4px 0 10px">Задействовано слоев: ' + usedCount + ' из ' + C.LAYERS.length +
      '. Пустой столбец означает слой, который вы не тронули ни разу.</div>' +
      (s2.phrases.length
        ? '<div class="mx-wrap"><table class="mx"><thead><tr><th class="qcell">Фраза</th>' + cols + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">Фраз пока нет, матрица пуста.</div>') +
      '<div class="sep"></div><h3 style="margin-bottom:4px">Заметки по слоям</h3>' +
      '<div class="hint">Нажмите на название слоя, чтобы увидеть, что он означает.</div>' + notes;
  }

  function step3Body(sit, role) {
    var d = Schema.step3ForRole(sit, role.id);
    var asms = d.assumptions.map(function (a, i) {
      var susp = !a.necessary && !a.sufficient;
      return '<div class="asm' + (susp ? ' susp' : '') + '" data-asm="' + a.id + '">' +
        '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
        '<textarea rows="2" data-field="step3.byRole.' + role.id + '.assumptions.' + i + '.text" placeholder="Минимальная вводная">' + U.esc(a.text) + '</textarea>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-asm" data-id="' + a.id + '" title="Удалить вводную" aria-label="Удалить вводную">' + Icons('trash') + '</button>' +
        '</div>' +
        '<div class="row" style="margin-top:8px">' +
        '<label class="chk' + (a.necessary ? ' on' : '') + '"><input type="checkbox" data-check="necessary" data-i="' + i + '"' + (a.necessary ? ' checked' : '') + '>необходима</label>' +
        '<label class="chk' + (a.sufficient ? ' on' : '') + '"><input type="checkbox" data-check="sufficient" data-i="' + i + '"' + (a.sufficient ? ' checked' : '') + '>достаточна</label>' +
        '</div>' +
        '<div class="asm-warn"' + (susp ? '' : ' hidden') + '>' + Icons('alert', 15) + 'Ни одной отметки: вводная подозрительна</div>' +
        '</div>';
    }).join('');

    return (role.interest ? '<div class="det-b" style="padding:0 0 12px"><b>Интересы роли:</b> ' + U.esc(role.interest) + '</div>' : '') +
      field('Как эта роль выглядит положительным героем', '',
        '<textarea rows="5" data-field="step3.byRole.' + role.id + '.heroVersion" placeholder="Положительный герой в этой роли">' + U.esc(d.heroVersion) + '</textarea>') +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Вводные</h3>' +
      '<div class="hint">Минимальные, необходимые и достаточные. Вводная без обеих отметок помечается как подозрительная.</div>' +
      (asms || '<div class="muted" style="margin-bottom:12px">Вводных пока нет.</div>') +
      '<div class="row"><button class="btn" data-act="add-asm">' + Icons('plus') + 'Добавить вводную</button></div>';
  }

  function step8Body(sit, role) {
    var d = Schema.step8ForRole(sit, role.id);
    return field('Первая фраза', 'Не длиннее ' + C.PHRASE_MAX + ' символов, это примерно ' + U.seconds(C.PHRASE_MAX) + ' секунд речи.',
      textarea({ id: 'fp', path: 'step8.byRole.' + role.id + '.firstPhrase', value: d.firstPhrase, rows: 5, max: C.PHRASE_MAX, time: true, placeholder: 'С чего начинаю' })) +
      field('Какие задать роли', '',
        '<textarea rows="3" data-field="step8.byRole.' + role.id + '.roleAssignment" placeholder="Кем называю себя и соперника">' + U.esc(d.roleAssignment) + '</textarea>') +
      field('Цель на раунд', '',
        '<textarea rows="3" data-field="step8.byRole.' + role.id + '.roundGoal" placeholder="Чего добиваюсь в этом раунде">' + U.esc(d.roundGoal) + '</textarea>');
  }

  function screenSituation(root, state, view) {
    var sit = Storage.getSituation(view.sitId);
    if (!sit) return screenList(root, state);
    var roles = Roles.sorted(sit.roles);
    var role = null, i;
    for (i = 0; i < roles.length; i++) if (roles[i].id === view.roleId) role = roles[i];
    if (!role) role = roles[0];

    var open = view.open;
    var body = '';
    body += accordion(Icons('doc', 16), 'Текст и роли', open === 'setup', 'setup', open === 'setup' ? setupBody(sit) : '');
    body += accordion('1', 'Понять ситуацию', open === 's1', 's1', open === 's1' ? step1Body(sit) : '');
    body += accordion('2', 'Разобрать текст на фразы и слова', open === 's2', 's2', open === 's2' ? step2Body(sit, view.s2tab) : '');
    body += accordion('3', 'Вытащить роль на положительного героя', open === 's3', 's3',
      open === 's3' ? (roleBar(sit, role.id, 's3') + step3Body(sit, role)) : '');
    body += accordion('8', 'Первая фраза', open === 's8', 's8',
      open === 's8' ? (roleBar(sit, role.id, 's8') + step8Body(sit, role)) : '');

    return '<header class="hdr"><div class="hdr-in">' +
      '<button class="btn btn-ghost btn-icon" data-act="back" title="К списку" aria-label="К списку">' + Icons('back') + '</button>' +
      '<div class="hdr-title"><h1 id="sit-title">' + U.esc(sit.title || C.TITLE_DEFAULT) + '</h1>' +
      (sit.context ? '<div class="hdr-sub">' + U.esc(sit.context) + '</div>' : '') + '</div>' +
      saveIndicator(state) + cloudBtn(Cloud.state()) + themeBtn(root.settings.theme) +
      '</div></header>' +
      '<div class="wrap"><div style="height:14px"></div>' + body +
      '<div class="muted" style="text-align:center;margin-top:8px">Шаги 4, 5, 6, 7 и 9 появятся в следующих версиях.</div>' +
      '</div>';
  }

  /* Окно синхронизации: состояние, кнопки, объяснение. */
  function cloudDialogHtml(root, state) {
    var c = root.settings.cloud;
    var look = CLOUD_LOOK[state] || CLOUD_LOOK.off;
    var h = '<p><b>' + U.esc(look.text) + '.</b></p>';
    if (state === 'error' && Cloud.error()) h += '<p class="pre muted">' + U.esc(Cloud.error()) + '</p>';
    if (c.connected) {
      h += '<p class="muted">Файл: Google Диск, папка «' + U.esc(C.CLOUD.FOLDER) + '», ' + U.esc(C.CLOUD.FILE) + '.<br>' +
        'Версия файла: ' + (c.lastVersion || 0) + '.<br>' +
        'Последний обмен: ' + (c.lastSync ? U.dateShort(c.lastSync) + ', ' + new Date(c.lastSync).toTimeString().slice(0, 5) : 'еще не было') + '.' +
        (c.pendingLocal ? '<br>Есть правки, которые еще не ушли в облако.' : '') + '</p>';
    } else {
      h += '<p class="muted">Приложение создаст на вашем Google Диске папку «' + U.esc(C.CLOUD.FOLDER) +
        '» и будет держать в ней один файл со всеми ситуациями. Доступа к остальному Диску у него нет: ' +
        'область доступа ограничена файлами, которые приложение создало само.</p>' +
        '<p class="muted">Это дает две вещи: одинаковые данные на ноутбуке, iPhone и iPad, и резервную копию, ' +
        'которая переживет очистку данных браузера.</p>';
    }
    if (c.connected) {
      var left = Math.round(GoogleAuth.expiresIn() / 60000);
      h += '<p class="muted">' + (left > 0
        ? ('Вход в Google действует еще примерно ' + left + ' ' + plural(left, 'минуту', 'минуты', 'минут') + '. Перезагрузку страницы он переживает.')
        : 'Вход в Google истек. Одно нажатие, окно откроется и закроется само.') +
        ' Правки не теряются в любом случае: они лежат на устройстве.</p>';
    }
    return h;
  }

  return {
    list: screenList,
    situation: screenSituation,
    saveIndicator: saveIndicator,
    markSource: markSource,
    cloudBtn: cloudBtn,
    cloudLook: CLOUD_LOOK,
    cloudDialogHtml: cloudDialogHtml,
    counter: counter,
    plural: plural
  };
})();
/* ---------------------------------------------------------------------
   12. Приложение: состояние экрана, события, действия
   --------------------------------------------------------------------- */
var App = (function () {
  var root = null;
  var view = { screen: 'list', sitId: null, roleId: null, open: 'setup', s2tab: 'phrases' };
  var mount = null;
  var lastSelection = '';   // кусок текста ситуации, выделенный пользователем

  /* ---------- отрисовка ---------- */

  function render() {
    var state = Storage.saveState();
    mount.innerHTML = (view.screen === 'situation')
      ? View.situation(root, state, view)
      : View.list(root, state);
    growAll();
  }

  function growAll() {
    var list = mount.querySelectorAll('textarea');
    for (var i = 0; i < list.length; i++) grow(list[i]);
  }
  function grow(t) {
    if (!t || t.tagName !== 'TEXTAREA') return;
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  }

  function updateSaveIndicator(state) {
    var n = document.getElementById('save-ind');
    if (!n) return;
    var txt = state === 'saving' ? 'Сохранение' : (state === 'dirty' ? 'Не сохранено' : 'Сохранено');
    n.className = 'save ' + state;
    n.setAttribute('title', txt);
    var t = n.querySelector('.t');
    if (t) t.textContent = txt;
  }

  function updateCloudIndicator(state) {
    var n = document.getElementById('cloud-ind');
    if (!n) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = View.cloudBtn(state);
    n.parentNode.replaceChild(tmp.firstChild, n);
  }

  function updateCounter(input) {
    var id = input.id;
    if (!id) return;
    var c = mount.querySelector('[data-counter-for="' + id + '"]');
    if (!c) return;
    var max = Number(c.getAttribute('data-max')) || 0;
    var len = U.len(input.value);
    var cls = 'counter';
    if (len >= max) cls += ' full';
    else if (max === C.PHRASE_MAX && len > C.PHRASE_WARN) cls += ' warn';
    c.className = cls;
    var html = '<span>' + len + ' из ' + max + '</span>';
    if (c.getAttribute('data-time')) html += '<span>около ' + U.seconds(len) + ' с речи</span>';
    c.innerHTML = html;
  }

  function sit() { return Storage.getSituation(view.sitId); }

  /* Пока роль не выбрана руками, активной считается первая по порядку показа,
     то есть трудная. Как только роль выбрана явно, она держится. */
  function activeRole() {
    var s = sit();
    if (!s) return null;
    var rs = Roles.sorted(s.roles);
    for (var i = 0; i < rs.length; i++) if (rs[i].id === view.roleId) return rs[i];
    return rs[0] || null;
  }

  /* ---------- события ввода ---------- */

  function onInput(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var path = t.getAttribute('data-field');
    if (!path || !view.sitId) return;

    var max = Number(t.getAttribute('data-max')) || 0;
    var v = t.value;
    if (max && U.len(v) > max) {
      var pos = t.selectionStart;
      v = U.cut(v, max);
      t.value = v;
      try { t.setSelectionRange(Math.min(pos, v.length), Math.min(pos, v.length)); } catch (err) {}
    }
    Storage.patch(view.sitId, path, v);
    if (t.tagName === 'TEXTAREA') grow(t);
    if (max) updateCounter(t);
    if (path === 'title') {
      var h = document.getElementById('sit-title');
      if (h) h.textContent = v || C.TITLE_DEFAULT;
    }
    // правка цитаты меняет подсветку в тексте ситуации, но не трогает поле ввода
    if (/^step2\.phrases\.\d+\.quote$/.test(path)) refreshSource();
    if (path === 'sourceText' && document.getElementById('src-text')) refreshSource();
  }

  function refreshSource() {
    var box = document.getElementById('src-text');
    var s = sit();
    if (!box || !s) return;
    box.innerHTML = View.markSource(s.sourceText, s.step2.phrases).html;
  }

  function onChange(e) {
    var t = e.target;
    if (!t || t.type !== 'checkbox') return;
    var kind = t.getAttribute('data-check');
    if (!kind || !view.sitId) return;
    var i = Number(t.getAttribute('data-i'));
    var lab = t.closest('.chk');
    if (lab) lab.classList.toggle('on', t.checked);

    if (kind === 'hard') {
      Storage.patch(view.sitId, 'roles.' + i + '.hard', t.checked);
      return;
    }
    var role = activeRole();
    if (!role) return;
    Storage.patch(view.sitId, 'step3.byRole.' + role.id + '.assumptions.' + i + '.' + kind, t.checked);
    // подозрительность вводной пересчитывается на месте, без перерисовки
    var box = t.closest('.asm');
    if (box) {
      var a = U.getPath(sit(), 'step3.byRole.' + role.id + '.assumptions.' + i);
      var susp = a && !a.necessary && !a.sufficient;
      box.classList.toggle('susp', !!susp);
      var w = box.querySelector('.asm-warn');
      if (w) w.hidden = !susp;
    }
  }

  /* ---------- действия ---------- */

  function onClick(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    e.preventDefault();
    ACT[act] && ACT[act](id, b);
  }

  var ACT = {
    theme: function () {
      var next = Theme.next(root.settings.theme);
      Theme.apply(next);
      Storage.setSetting('theme', next);
      render();
    },

    'new-sit': function () {
      Modal.prompt('Новая ситуация', 'Название', '', 'Создать').then(function (name) {
        if (name === null) return;
        var s = Storage.create(Schema.newSituation(name || C.TITLE_DEFAULT));
        openSituation(s.id);
      });
    },

    'open-sit': function (id) { openSituation(id); },

    'rename-sit': function (id) {
      var s = Storage.getSituation(id);
      if (!s) return;
      Modal.prompt('Переименовать ситуацию', 'Название', s.title).then(function (name) {
        if (name === null) return;
        Storage.patch(id, 'title', name || C.TITLE_DEFAULT);
        render();
      });
    },

    'del-sit': function (id) {
      var s = Storage.getSituation(id);
      if (!s) return;
      Modal.confirm('Удалить ситуацию',
        'Ситуация «' + (s.title || C.TITLE_DEFAULT) + '» будет удалена вместе со всеми заполненными шагами. Восстановить ее можно будет только из выгруженного архива.'
      ).then(function (ok) {
        if (!ok) return;
        Storage.remove(id);
        Toast.show('Ситуация удалена');
        render();
      });
    },

    back: function () {
      Storage.flush().catch(function () {});
      view.screen = 'list';
      view.sitId = null;
      render();
    },

    acc: function (_id, b) {
      var sec = b.getAttribute('data-sec');
      view.open = (view.open === sec) ? null : sec;
      render();
    },

    role: function (id) {
      view.roleId = id;
      render();
    },

    'add-role': function () {
      var s = sit();
      if (!s || s.roles.length >= C.ROLES_MAX) return;
      var next = s.roles.slice();
      next.push(Schema.newRole('Роль ' + (next.length + 1), next.length + 1));
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      render();
    },

    'del-role': function (id) {
      var s = sit();
      if (!s || s.roles.length <= C.ROLES_MIN) return;
      var r = null, i;
      for (i = 0; i < s.roles.length; i++) if (s.roles[i].id === id) r = s.roles[i];
      if (!r) return;
      var d3 = s.step3.byRole[id], d8 = s.step8.byRole[id];
      var hasData = !!(d3 && (String(d3.heroVersion || '').trim() || (d3.assumptions || []).length)) ||
        !!(d8 && (String(d8.firstPhrase || '').trim() || String(d8.roleAssignment || '').trim() || String(d8.roundGoal || '').trim()));
      var text = 'Роль «' + Roles.nameOf(r) + '» будет удалена.' +
        (hasData ? ' Вместе с ней пропадет все, что заполнено по этой роли в шагах 3 и 8.' : '');
      Modal.confirm('Удалить роль', text).then(function (ok) {
        if (!ok) return;
        var next = s.roles.filter(function (x) { return x.id !== id; });
        Storage.patch(s.id, 'roles', Roles.renumber(next));
        var b3 = {}, b8 = {}, k;
        for (k in s.step3.byRole) if (k !== id) b3[k] = s.step3.byRole[k];
        for (k in s.step8.byRole) if (k !== id) b8[k] = s.step8.byRole[k];
        Storage.patch(s.id, 'step3.byRole', b3);
        Storage.patch(s.id, 'step8.byRole', b8);
        if (view.roleId === id) view.roleId = null;
        render();
      });
    },

    'move-role': function (id, b) {
      var s = sit();
      if (!s) return;
      var dir = b.getAttribute('data-dir') === 'up' ? -1 : 1;
      var next = s.roles.slice();
      var i = next.findIndex(function (x) { return x.id === id; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= next.length) return;
      var tmp = next[i]; next[i] = next[j]; next[j] = tmp;
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      render();
    },

    'parse-roles': function () { parseRoles(); },

    /* ---- шаг 2 ---- */

    s2tab: function (_id, b) {
      view.s2tab = b.getAttribute('data-tab') === 'matrix' ? 'matrix' : 'phrases';
      render();
    },

    'to-analysis': function () {
      var s = sit();
      if (!s) return;
      var q = String(lastSelection || '').replace(/\s+/g, ' ').trim();
      if (!q) {
        Toast.show('Сначала выделите кусок текста ситуации');
        return;
      }
      hideSelButton();
      addPhrase(s, q);
      lastSelection = '';
      try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch (e) {}
    },

    'add-phrase': function () {
      var s = sit();
      if (s) addPhrase(s, '');
    },

    'del-phrase': function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i'));
      var p = s.step2.phrases[i];
      if (!p) return;
      var q = String(p.quote || '').trim();
      Modal.confirm('Удалить фразу',
        'Фраза ' + (i + 1) + (q ? ' «' + U.cut(q, 80) + (U.len(q) > 80 ? '...' : '') + '»' : '') +
        ' будет удалена вместе со всеми трактовками и отметками слоев.'
      ).then(function (ok) {
        if (!ok) return;
        var next = s.step2.phrases.filter(function (x, j) { return j !== i; });
        Storage.patch(s.id, 'step2.phrases', next);
        render();
      });
    },

    'add-reading': function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i'));
      var p = s.step2.phrases[i];
      if (!p) return;
      Storage.patch(s.id, 'step2.phrases.' + i + '.readings', p.readings.concat([Schema.newReading()]));
      render();
      var boxes = mount.querySelectorAll('.phrase:nth-of-type(1) textarea');
      var last = mount.querySelectorAll('.reading textarea');
      if (last.length) last[Math.max(0, last.length - 2)].focus();
      if (!last.length && boxes.length) boxes[0].focus();
    },

    'del-reading': function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i')), j = Number(b.getAttribute('data-j'));
      var p = s.step2.phrases[i];
      if (!p) return;
      Storage.patch(s.id, 'step2.phrases.' + i + '.readings', p.readings.filter(function (x, k) { return k !== j; }));
      render();
    },

    star: function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i')), j = Number(b.getAttribute('data-j'));
      var r = U.getPath(s, 'step2.phrases.' + i + '.readings.' + j);
      if (!r) return;
      Storage.patch(s.id, 'step2.phrases.' + i + '.readings.' + j + '.starred', !r.starred);
      render();
    },

    layer: function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i'));
      var id = b.getAttribute('data-layer');
      var p = s.step2.phrases[i];
      if (!p) return;
      var has = p.layers.indexOf(id) >= 0;
      var next = has ? p.layers.filter(function (x) { return x !== id; }) : p.layers.concat([id]);
      // порядок слоев держим как в списке, чтобы матрица не прыгала
      next.sort(function (a, c) {
        return C.LAYERS.findIndex(function (l) { return l.id === a; }) -
          C.LAYERS.findIndex(function (l) { return l.id === c; });
      });
      Storage.patch(s.id, 'step2.phrases.' + i + '.layers', next);
      b.classList.toggle('on', !has);
    },

    'add-asm': function () {
      var s = sit(), role = activeRole();
      if (!s || !role) return;
      var d = Schema.step3ForRole(s, role.id);
      var next = d.assumptions.slice();
      next.push(Schema.newAssumption());
      Storage.patch(s.id, 'step3.byRole.' + role.id + '.assumptions', next);
      render();
      var boxes = mount.querySelectorAll('.asm textarea');
      if (boxes.length) { var last = boxes[boxes.length - 1]; last.focus(); }
    },

    'del-asm': function (id) {
      var s = sit(), role = activeRole();
      if (!s || !role) return;
      var d = Schema.step3ForRole(s, role.id);
      var next = d.assumptions.filter(function (a) { return a.id !== id; });
      Storage.patch(s.id, 'step3.byRole.' + role.id + '.assumptions', next);
      render();
    },

    export: function () { doExport(); },
    import: function () { doImport(); },
    cloud: function () { cloudDialog(); }
  };

  /* ---------- синхронизация ---------- */

  function useCloudAdapter(on) {
    Storage.useAdapter(on ? makeCloudAdapter(LocalAdapter) : LocalAdapter);
  }

  function cloudDialog() {
    var state = Cloud.state();
    var acts = [{ label: 'Закрыть', value: null }];
    if (!Cloud.connected()) {
      acts.push({ label: 'Подключить Google Диск', kind: 'btn-primary', value: 'connect' });
    } else if (state === 'needauth') {
      acts.push({ label: 'Отключить', kind: 'btn-danger', value: 'off' });
      acts.push({ label: 'Войти в Google', kind: 'btn-primary', value: 'signin' });
    } else {
      acts.push({ label: 'Отключить', kind: 'btn-danger', value: 'off' });
      acts.push({ label: 'Синхронизировать сейчас', kind: 'btn-primary', value: 'sync' });
    }
    Modal.open({
      title: 'Синхронизация',
      html: View.cloudDialogHtml(root, state),
      actions: acts
    }).then(function (a) {
      if (a === 'connect') {
        return Cloud.connect().then(function () {
          useCloudAdapter(true);
          Toast.show('Диск подключен');
          render();
        }).catch(function (e) {
          Toast.show(e && e.message ? e.message : 'Не удалось подключить Диск', 'err');
        });
      }
      if (a === 'signin') {
        return Cloud.signInAgain().catch(function (e) {
          Toast.show(e && e.message ? e.message : 'Вход не удался', 'err');
        });
      }
      if (a === 'sync') {
        return Cloud.flushNow('manual').then(function (r) {
          if (r === 'ok') Toast.show('Синхронизировано');
          if (r === 'pulled') { Toast.show('Взята версия из облака'); render(); }
        });
      }
      if (a === 'off') {
        return Modal.confirm('Отключить синхронизацию',
          'Приложение перестанет читать и записывать файл на Диске. Сам файл останется на месте, данные на устройстве тоже. Подключить обратно можно в любой момент.',
          'Отключить'
        ).then(function (ok) {
          if (!ok) return;
          return Cloud.disconnect().then(function () {
            useCloudAdapter(false);
            Toast.show('Синхронизация выключена');
            render();
          });
        });
      }
    });
  }

  /* Раздел 9.4 ТЗ: автоматического слияния нет, спрашиваем. */
  function conflictDialog(info) {
    var when = info.savedAt ? (U.dateShort(info.savedAt) + ', ' + new Date(info.savedAt).toTimeString().slice(0, 5)) : 'время неизвестно';
    return Modal.open({
      title: 'Расхождение с облаком',
      html: '<p>В облаке лежит версия <b>' + info.remoteVersion + '</b>, записанная с устройства «' +
        U.esc(info.device || 'неизвестно') + '» (' + when + ').</p>' +
        '<p>На этом устройстве версия <b>' + info.localVersion + '</b>, и с тех пор здесь появились правки.</p>' +
        '<p>Слить автоматически нельзя: приложение не знает, какая правка важнее. Выберите сами. ' +
        'Если жалко и то, и другое, закройте это окно, выгрузите архив кнопкой на первом экране, и только потом выбирайте.</p>',
      actions: [
        { label: 'Отмена', value: 'cancel' },
        { label: 'Взять облачную', value: 'remote' },
        { label: 'Оставить местную', kind: 'btn-primary', value: 'local' }
      ]
    }).then(function (v) { return v || 'cancel'; });
  }

  /* ---------- выделение текста ситуации ---------- */

  var hideTimer = null;

  function onSelection() {
    var box = document.getElementById('src-text');
    if (!box) return;
    var sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed ||
      !sel.anchorNode || !sel.focusNode ||
      !box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) {
      // не стираем запомненное сразу: нажатие на кнопку само снимает выделение
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(hideSelButton, 250);
      return;
    }
    var t = String(sel.toString() || '').replace(/\s+/g, ' ').trim();
    if (!t) return;
    lastSelection = t;
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    showSelButton(sel);
    showSelHint(t);
  }

  function showSelButton(sel) {
    var b = document.getElementById('sel-btn');
    if (!b) return;
    var r;
    try { r = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { return; }
    if (!r || (!r.width && !r.height)) return;
    b.classList.add('show');
    var w = b.offsetWidth || 140, h = b.offsetHeight || 44;
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), vw - w - 8);
    var top = r.bottom + 10;                       // под выделением
    if (top + h > vh - 8) top = Math.max(8, r.top - h - 10);  // не влезло - над ним
    b.style.left = Math.round(left) + 'px';
    b.style.top = Math.round(top) + 'px';
  }

  function hideSelButton() {
    var b = document.getElementById('sel-btn');
    if (b) b.classList.remove('show');
  }

  function showSelHint(t) {
    var n = document.getElementById('sel-hint');
    if (!n) return;
    n.innerHTML = 'Выделено: <b>' + U.esc(U.cut(t, 60)) + (U.len(t) > 60 ? '...' : '') + '</b>';
  }

  function addPhrase(s, quote) {
    var next = s.step2.phrases.concat([Schema.newPhrase(quote)]);
    Storage.patch(s.id, 'step2.phrases', next);
    view.s2tab = 'phrases';
    render();
    var cards = mount.querySelectorAll('.phrase');
    if (cards.length) {
      var card = cards[cards.length - 1];
      if (card.scrollIntoView) { try { card.scrollIntoView({ block: 'center' }); } catch (e) {} }
      var ta = card.querySelector('textarea');
      if (ta && !quote) ta.focus();
    }
    Toast.show(quote ? 'Фраза добавлена в разбор' : 'Пустая фраза добавлена');
  }

  function openSituation(id) {
    var s = Storage.getSituation(id);
    if (!s) return;
    view.screen = 'situation';
    view.sitId = id;
    view.roleId = null; // роль не выбрана: активной будет трудная
    view.open = String(s.sourceText || '').trim() ? 's1' : 'setup';
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- разбор ролей из текста ---------- */

  function parseRoles() {
    var s = sit();
    if (!s) return;
    var res = Roles.parse(s.sourceText);
    if (!res.found) {
      Modal.open({
        title: 'Роли в тексте не найдены',
        html: '<p>Приложение ищет строку, которая начинается со слова «Роли», и берет следующие за ней строки. ' +
          'В каждой строке название роли отделяется от интересов тире или двоеточием.</p>' +
          '<p class="muted">Если в вашем тексте блока ролей нет, заполните роли вручную ниже.</p>',
        actions: [{ label: 'Понятно', kind: 'btn-primary', value: null }]
      });
      return;
    }
    var found = res.roles;
    var take = found.slice(0, C.ROLES_MAX);
    var rows = take.map(function (r) {
      return '<div class="role-row"><b>' + U.esc(r.name) + '</b>' +
        (r.interest ? '<div class="muted">' + U.esc(r.interest) + '</div>' : '<div class="muted">интересы не распознаны</div>') +
        '</div>';
    }).join('');

    var warn = '';
    if (found.length > C.ROLES_MAX) {
      warn += '<p class="muted">Найдено ролей: ' + found.length + '. Взять можно не больше ' + C.ROLES_MAX +
        ', остальные придется добавить или поправить вручную.</p>';
    }
    if (take.length < C.ROLES_MIN) {
      warn += '<p class="muted">Ролей меньше ' + C.ROLES_MIN + ', поэтому недостающие будут добавлены пустыми.</p>';
    }
    var hasData = s.roles.some(function (r) {
      var d3 = s.step3.byRole[r.id], d8 = s.step8.byRole[r.id];
      return !!(d3 && (String(d3.heroVersion || '').trim() || (d3.assumptions || []).length)) ||
        !!(d8 && String(d8.firstPhrase || '').trim());
    });
    if (hasData) {
      warn += '<p style="color:var(--warn)"><b>Внимание.</b> По текущим ролям уже что-то заполнено в шагах 3 и 8. ' +
        'Замена ролей это сотрет.</p>';
    }

    Modal.open({
      title: 'Найденные роли',
      html: rows + warn + '<p class="muted">Названия и интересы можно поправить после замены.</p>',
      actions: [
        { label: 'Отмена', value: false },
        { label: 'Заменить роли', kind: 'btn-primary', value: true }
      ]
    }).then(function (ok) {
      if (!ok) return;
      var next = take.map(function (r, i) { return Schema.newRole(r.name, i + 1, r.interest); });
      while (next.length < C.ROLES_MIN) next.push(Schema.newRole('Роль ' + (next.length + 1), next.length + 1));
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      Storage.patch(s.id, 'step3.byRole', {});
      Storage.patch(s.id, 'step8.byRole', {});
      view.roleId = null;
      Toast.show('Ролей записано: ' + next.length);
      render();
    });
  }

  /* ---------- архив ---------- */

  function doExport() {
    Storage.flush().catch(function () {}).then(function () {
      try {
        Archive.download(root);
        Toast.show('Архив выгружен');
      } catch (e) {
        Toast.show('Не удалось выгрузить архив: ' + e.message, 'err');
      }
    });
  }

  function doImport() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (!f) return;
      Archive.readFile(f).then(function (raw) {
        var incoming = Schema.migrate(raw); // тут же отсекается схема из будущего
        var n = incoming.situations.length;
        Modal.open({
          title: 'Загрузка архива',
          html: '<p>В файле ситуаций: <b>' + n + '</b>. Сейчас в приложении: <b>' + root.situations.length + '</b>.</p>' +
            '<p><b>Заменить</b> - выбросить текущие данные и оставить только файл.<br>' +
            '<b>Слить</b> - добавить ситуации из файла к текущим. Совпадающие получат новые внутренние номера, ничего не перезапишется.</p>',
          actions: [
            { label: 'Отмена', value: null },
            { label: 'Слить', value: 'merge' },
            { label: 'Заменить', kind: 'btn-danger', value: 'replace' }
          ]
        }).then(function (mode) {
          if (!mode) return;
          if (mode === 'replace') {
            return Modal.confirm('Заменить все данные',
              'Текущие ситуации (' + root.situations.length + ') будут удалены и заменены содержимым файла. Отменить это нельзя.',
              'Заменить'
            ).then(function (ok) {
              if (!ok) return;
              return apply(incoming, 'Архив загружен, данные заменены');
            });
          }
          var merged = Archive.merge(root, incoming);
          return apply(merged, 'Архив загружен, ситуаций добавлено: ' + n);
        });
      }).catch(function (e) {
        Modal.open({
          title: 'Файл не подошел',
          html: '<p class="pre">' + U.esc(e.message || String(e)) + '</p>',
          actions: [{ label: 'Понятно', kind: 'btn-primary', value: null }]
        });
      });
    });
    inp.click();
  }

  function apply(nextRoot, okText) {
    return Storage.replaceAll(nextRoot).then(function () {
      view.screen = 'list';
      view.sitId = null;
      Theme.apply(root.settings.theme);
      Toast.show(okText);
      render();
    }).catch(function (e) {
      Toast.show('Не удалось записать данные: ' + (e.message || e), 'err');
    });
  }

  /* ---------- запуск ---------- */

  function fatal(msg) {
    document.getElementById('root').innerHTML =
      '<div class="wrap"><div class="card" style="margin-top:40px">' +
      '<h2 style="margin-bottom:8px">Приложение не может работать</h2>' +
      '<p class="pre">' + U.esc(msg) + '</p>' +
      '<p class="muted">Данные хранятся в базе IndexedDB этого браузера. Если браузер работает в приватном режиме или запрещает сайту хранилище, приложение открыть не получится.</p>' +
      '</div></div>';
  }

  function start() {
    mount = document.getElementById('root');
    mount.addEventListener('click', onClick);
    // нажатие на всплывающую кнопку не должно снимать выделение до срабатывания
    mount.addEventListener('mousedown', function (e) {
      if (e.target.closest && e.target.closest('#sel-btn')) e.preventDefault();
    });
    mount.addEventListener('input', onInput);
    mount.addEventListener('change', onChange);
    /* Выделение в тексте ситуации. Кусок запоминаем заранее: нажатие на
       кнопку снимает выделение, особенно на телефоне. Кнопка всплывает
       у самого выделения, иначе ее просто не находят. */
    document.addEventListener('selectionchange', onSelection);
    window.addEventListener('resize', function () { hideSelButton(); });
    document.addEventListener('scroll', function () { hideSelButton(); }, true);

    mount.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'open-sit') {
        e.preventDefault();
        openSituation(e.target.getAttribute('data-id'));
      }
    });

    Storage.subscribe(function (ev) {
      if (ev.type === 'save') updateSaveIndicator(ev.state);
      if (ev.type === 'error') Toast.show('Данные не сохранились: ' + (ev.error && ev.error.message ? ev.error.message : 'ошибка базы'), 'err');
      if (ev.type === 'external') render();
    });
    Cloud.subscribe(function (state) { updateCloudIndicator(state); });
    Cloud.onConflict(conflictDialog);

    /* Четыре точки обмена, раздел 9.2 ТЗ. Фонового опроса нет. */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') {
        Storage.flush().catch(function () {});
        Cloud.flushNow('hide');
      } else {
        Cloud.sync('focus');
      }
    });
    window.addEventListener('pagehide', function () { Storage.flush().catch(function () {}); });
    window.addEventListener('beforeunload', function (e) {
      if (Storage.hasPending()) { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('online', function () { Cloud.sync('focus'); });

    Storage.load().then(function (r) {
      root = r;
      Theme.apply(root.settings.theme);
      if (root.settings.cloud.connected) useCloudAdapter(true);
      render();

      // вход прошел без отдельного окна: разбираем возврат и сразу синхронизируем
      if (OAUTH_RETURN) {
        GoogleAuth.accept(OAUTH_RETURN);
        OAUTH_RETURN = null;
        if (GoogleAuth.has() && !root.settings.cloud.connected) {
          Storage.setSetting('cloud.connected', true);
          useCloudAdapter(true);
        }
      }
      // вход мог пережить перезагрузку: поднимаем его и сразу обмениваемся
      if (root.settings.cloud.connected) Cloud.resume();
    }).catch(function (e) {
      fatal(e && e.message ? e.message : String(e));
    });
  }

  return {
    start: start,
    render: render,
    view: function () { return view; },
    data: function () { return root; }
  };
})();

/* Точка входа. Отладочная ручка PP нужна для проверки в консоли,
   на работу приложения не влияет. */
window.PP = {
  C: C, U: U, Schema: Schema, Storage: Storage, Roles: Roles, Archive: Archive,
  Cloud: Cloud, GoogleAuth: GoogleAuth, Drive: Drive, App: App
};

if (!IS_OAUTH_POPUP) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.start);
  } else {
    App.start();
  }
}
</script>
</body>
</html>
