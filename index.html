/* ---------------------------------------------------------------------
   8. Мелочи интерфейса: тосты, модальные окна, тема
   --------------------------------------------------------------------- */
var Toast = {
  show: function (text, kind) {
    var box = document.getElementById('toasts');
    var d = document.createElement('div');
    d.className = 'toast' + (kind === 'err' ? ' err' : '');
    d.setAttribute('role', 'status');
    d.textContent = text;
    box.appendChild(d);
    setTimeout(function () {
      d.style.transition = 'opacity .3s';
      d.style.opacity = '0';
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 320);
    }, kind === 'err' ? 5200 : 2600);
  }
};

var Modal = (function () {
  var node = null, lastFocus = null;

  function close() {
    if (!node) return;
    if (node.parentNode) node.parentNode.removeChild(node);
    node = null;
    document.removeEventListener('keydown', onKey, true);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); if (cur && cur.onCancel) cur.onCancel(); }
  }
  var cur = null;

  /* opts = { title, html, actions:[{label, kind, value}], onCancel }
     Возвращает промис со значением нажатой кнопки или null. */
  function open(opts) {
    close();
    cur = opts;
    lastFocus = document.activeElement;
    return new Promise(function (resolve) {
      node = document.createElement('div');
      node.className = 'modal';
      node.setAttribute('role', 'dialog');
      node.setAttribute('aria-modal', 'true');
      var acts = (opts.actions || []).map(function (a, i) {
        return '<button class="btn ' + (a.kind || '') + '" data-i="' + i + '">' + U.esc(a.label) + '</button>';
      }).join('');
      node.innerHTML =
        '<div class="modal-bg" data-close="1"></div>' +
        '<div class="modal-w">' +
        (opts.title ? '<h2>' + U.esc(opts.title) + '</h2>' : '') +
        '<div class="modal-body">' + (opts.html || '') + '</div>' +
        '<div class="modal-acts">' + acts + '</div>' +
        '</div>';
      document.body.appendChild(node);
      document.addEventListener('keydown', onKey, true);

      node.addEventListener('click', function (e) {
        var t = e.target;
        if (t.closest && t.closest('[data-close]')) { close(); resolve(null); return; }
        var b = t.closest ? t.closest('[data-i]') : null;
        if (b) {
          var a = opts.actions[Number(b.getAttribute('data-i'))];
          var val = a.value;
          if (a.collect) val = a.collect(node);
          close();
          resolve(val === undefined ? null : val);
        }
      });
      var first = node.querySelector('.modal-w input, .modal-w textarea, .modal-w button');
      if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 30);
    });
  }

  return {
    open: open,
    close: close,
    /* Подтверждение деструктивного действия с названием объекта. Раздел 11 ТЗ. */
    confirm: function (title, text, okLabel) {
      return open({
        title: title,
        html: '<p class="pre">' + U.esc(text) + '</p>',
        actions: [
          { label: 'Отмена', value: false },
          { label: okLabel || 'Удалить', kind: 'btn-danger', value: true }
        ]
      }).then(function (v) { return v === true; });
    },
    prompt: function (title, label, value, okLabel) {
      return open({
        title: title,
        html: '<div class="field"><label class="label" for="m-inp">' + U.esc(label) + '</label>' +
          '<input type="text" id="m-inp" value="' + U.esc(value || '') + '"></div>',
        actions: [
          { label: 'Отмена', value: null },
          {
            label: okLabel || 'Сохранить', kind: 'btn-primary',
            collect: function (n) { return n.querySelector('#m-inp').value.trim(); }
          }
        ]
      });
    }
  };
})();

var Theme = {
  order: ['auto', 'light', 'dark'],
  label: { auto: 'Тема: системная', light: 'Тема: светлая', dark: 'Тема: темная' },
  icon: { auto: 'auto', light: 'sun', dark: 'moon' },
  apply: function (v) {
    document.documentElement.setAttribute('data-theme', this.order.indexOf(v) >= 0 ? v : 'auto');
  },
  next: function (v) {
    var i = this.order.indexOf(v);
    return this.order[(i + 1) % this.order.length];
  }
};

/* ---------------------------------------------------------------------
   9. Роли: порядок и разбор из текста ситуации
   --------------------------------------------------------------------- */
var Roles = {
  /* Порядок показа: трудные роли первыми, остальные по полю order.
     Раздел 5.4 ТЗ: если положительного героя не удается найти именно
     в трудной роли, вся подготовка стоит на песке. */
  sorted: function (roles) {
    return (roles || []).slice().sort(function (a, b) {
      if (!!a.hard !== !!b.hard) return a.hard ? -1 : 1;
      return (a.order || 0) - (b.order || 0);
    });
  },

  renumber: function (roles) {
    roles.forEach(function (r, i) { r.order = i + 1; });
    return roles;
  },

  nameOf: function (r) {
    return (r && String(r.name || '').trim()) || 'Роль без названия';
  },

  /* Разбор блока ролей из вставленного текста ситуации.
     Формат исходников: строка со словом "Роли", ниже по строке на роль,
     название и интересы разделены тире или двоеточием.
     Результат всегда показывается на правку и никогда не применяется молча. */
  parse: function (text) {
    var lines = String(text || '').split(/\r?\n/);
    var start = -1;
    for (var i = 0; i < lines.length; i++) {
      // граница слова тут не годится: в JS она считается только по латинице
      if (/^\s*роли(\s|:|$)/i.test(lines[i])) { start = i + 1; break; }
    }
    if (start < 0) return { found: false, roles: [] };

    var out = [];
    for (var j = start; j < lines.length; j++) {
      var t = lines[j].trim();
      if (!t) { if (out.length) break; else continue; }
      // – короткое тире, — длинное тире: в исходниках ситуаций встречаются оба
      t = t.replace(/^[•*]+\s*/, '').replace(/^\d+[.)]\s*/, '').replace(/^[-–—]\s+/, '');
      if (!t) continue;
      var m = t.match(/^(.{1,90}?)\s*[—–:]\s*(.+)$/) || t.match(/^(.{1,90}?)\s+-\s+(.+)$/);
      var name = m ? m[1].trim() : t;
      var interest = m ? m[2].trim() : '';
      name = name.replace(/[.,;:]+$/, '').trim();
      if (!name) continue;
      out.push({ name: name, interest: interest });
      if (out.length >= 40) break;
    }
    return { found: out.length > 0, roles: out };
  }
};

/* ---------------------------------------------------------------------
   10. Архив: сборка файла, слияние при импорте
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   9и. Вторая вкладка. Раздел 11 ТЗ: механика «стоп-тормоз» как
   в «А что потом?». Там она построена на событии storage, здесь
   хранилище другое, поэтому вкладки объявляют о записи через
   BroadcastChannel. Смысл тот же и он не в синхронизации: две вкладки
   пишут в одну базу и молча затирают правки друг друга. Поэтому
   вкладка, узнавшая о чужой записи, замораживает свою и говорит об
   этом вслух, а не пытается слиться.
   --------------------------------------------------------------------- */
var Tabs = {
  ch: null,
  locked: false,
  onLock: null,
  onRemote: null,
  id: U.id('tab_'),

  start: function () {
    try {
      if (typeof BroadcastChannel !== 'function') return false;   // поддержки нет - работаем без нее
      Tabs.ch = new BroadcastChannel(C.TAB_CHANNEL);
      Tabs.ch.onmessage = function (e) {
        var d = e && e.data;
        if (!d || d.from === Tabs.id || d.type !== 'wrote') return;
        Tabs.remote();
      };
      return true;
    } catch (e) { return false; }
  },

  /* Объявить, что эта вкладка записала в базу. */
  announce: function () {
    if (Tabs.locked) return;
    try { if (Tabs.ch) Tabs.ch.postMessage({ type: 'wrote', from: Tabs.id }); } catch (e) {}
  },

  /* Пришла чужая запись. */
  remote: function () {
    if (Tabs.locked) return;
    if (Tabs.onRemote && Tabs.onRemote() === 'reload') return;  // список просто перечитывает
    Tabs.locked = true;
    if (Tabs.onLock) Tabs.onLock();
  },

  /* Разрешена ли запись. Хранилище спрашивает это перед каждой записью. */
  canWrite: function () { return !Tabs.locked; }
};

/* ---------------------------------------------------------------------
   9з. Сохранность. Раздел 3.1 ТЗ.
   Safari на iOS стирает данные сайта после семи дней без посещений.
   Две меры на этом уровне: разовая подсказка про установку на домашний
   экран и напоминание об экспорте. Обе - баннеры, а не окна: окно
   человек закроет не читая, а баннер останется на глазах.
   --------------------------------------------------------------------- */
var Safety = {
  /* Приложение открыто как установленное, а не как вкладка. */
  installed: function (win) {
    var w = win || window;
    try {
      if (w.navigator && w.navigator.standalone) return true;   // iOS
      if (w.matchMedia && w.matchMedia('(display-mode: standalone)').matches) return true;
      if (w.matchMedia && w.matchMedia('(display-mode: fullscreen)').matches) return true;
    } catch (e) {}
    return false;
  },
  /* Мобильный Safari: только там работает «Поделиться - На экран Домой». */
  iosSafari: function (win) {
    var w = win || window;
    var ua = String((w.navigator && w.navigator.userAgent) || '');
    var ios = /iPad|iPhone|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && w.navigator && w.navigator.maxTouchPoints > 1);
    if (!ios) return false;
    return !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  },
  /* Показывать ли подсказку про установку: только в мобильном Safari,
     только если не установлено и подсказку еще не убирали. */
  needInstallHint: function (dismissed, win) {
    if (dismissed) return false;
    if (Safety.installed(win)) return false;
    return Safety.iosSafari(win);
  },

  /* Сколько дней прошло с последней выгрузки архива. */
  daysSince: function (ts, now) {
    if (!ts) return null;
    return Math.floor(((now || U.now()) - ts) / 86400000);
  },
  /* Напоминать ли об экспорте. При включенной синхронизации не напоминаем:
     копия и так лежит на диске, это мера 4 того же раздела. */
  needExportHint: function (lastExport, cloudConnected, hasData, now) {
    if (!hasData || cloudConnected) return false;
    if (!lastExport) return true;
    return Safety.daysSince(lastExport, now) >= C.EXPORT_REMIND_DAYS;
  }
};

/* ---------------------------------------------------------------------
   9ж. Корзина. Раздел 11 ТЗ: 30 дней.
   Удаленная ситуация не стирается сразу, а получает метку времени.
   Списки берут только живые, корзина - только помеченные.
   --------------------------------------------------------------------- */
var Trash = {
  alive: function (list) {
    return (list || []).filter(function (s) { return !s.deletedAt; });
  },
  inTrash: function (list) {
    return (list || []).filter(function (s) { return !!s.deletedAt; })
      .sort(function (a, b) { return b.deletedAt - a.deletedAt; });
  },
  daysLeft: function (s, now) {
    var passed = ((now || U.now()) - s.deletedAt) / 86400000;
    return Math.max(0, Math.ceil(C.TRASH_DAYS - passed));
  },
  /* Что пора стереть окончательно. Считается при каждой загрузке. */
  expired: function (list, now) {
    var edge = (now || U.now()) - C.TRASH_DAYS * 86400000;
    return (list || []).filter(function (s) { return s.deletedAt && s.deletedAt < edge; });
  }
};

var Archive = {
  fileName: function () { return 'poedinok-prep-' + U.dateFile() + '.json'; },

  /* Одна дверь наружу для всех форматов раздела 8 ТЗ. */
  saveFile: function (text, name, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 400);
  },

  download: function (root) {
    Archive.saveFile(JSON.stringify(root, null, 2), Archive.fileName(), 'application/json');
  },

  /* Слияние: настройки остаются местными, совпадающие id получают новые.
     Раздел 8 ТЗ. Чистая функция: хранилище о слиянии не знает. */
  merge: function (current, incoming) {
    var out = U.clone(current);
    var usedS = {};
    out.situations.forEach(function (s) { usedS[s.id] = 1; });
    var usedF = {};
    out.formulaLibrary.forEach(function (f) { usedF[f.id] = 1; });

    incoming.situations.forEach(function (s) {
      var c = U.clone(s);
      if (usedS[c.id]) c.id = U.id('s_');
      usedS[c.id] = 1;
      out.situations.push(c);
    });
    (incoming.formulaLibrary || []).forEach(function (f) {
      var c = U.clone(f);
      if (usedF[c.id]) c.id = U.id('f_');
      usedF[c.id] = 1;
      out.formulaLibrary.push(c);
    });
    return out;
  },

  readFile: function (file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        try { resolve(JSON.parse(String(fr.result))); }
        catch (e) { reject(new Error('Файл не является корректным JSON')); }
      };
      fr.onerror = function () { reject(new Error('Не удалось прочитать файл')); };
      fr.readAsText(file);
    });
  }
};
/* ---------------------------------------------------------------------
   9е. Отчет. Раздел 8 ТЗ.
   Содержание собирается один раз в список блоков, а HTML, RTF и Markdown
   получаются из него разными выводами. Иначе три формата разъезжаются:
   в одном шаг есть, в другом забыли.
   --------------------------------------------------------------------- */
var Report = {
  /* Блоки: h1, h2, h3, p, kv (подпись и значение), ul, table, hr, page */
  build: function (sit, root) {
    var B = [];
    var h1 = function (t) { B.push({ t: 'h1', text: t }); };
    var h2 = function (t) { B.push({ t: 'h2', text: t }); };
    var h3 = function (t) { B.push({ t: 'h3', text: t }); };
    var p = function (t) { if (String(t || '').trim()) B.push({ t: 'p', text: String(t) }); };
    var kv = function (l, v) { B.push({ t: 'kv', label: l, text: String(v == null ? '' : v) }); };
    var ul = function (items) { if (items.length) B.push({ t: 'ul', items: items }); };
    var page = function () { B.push({ t: 'page' }); };
    var roles = Roles.sorted(sit.roles);
    var nameOf = function (id) {
      var out = '';
      sit.roles.forEach(function (r) { if (r.id === id) out = Roles.nameOf(r); });
      return out;
    };
    var dash = function (v) { return String(v || '').trim() || 'не заполнено'; };

    h1(sit.title || C.TITLE_DEFAULT);
    if (sit.context) p(sit.context);
    p('Выгружено ' + U.dateShort(U.now()) + ', приложение «Подготовка к поединку» ' + C.APP_VERSION + '.');

    var pts = Traffic.of(sit);
    ul(pts.map(function (x) {
      var frac = (x.total !== null && x.total > 0) ? (', ролей ' + x.done + ' из ' + x.total) : '';
      var word = x.state === 'green' ? 'закрыт' : (x.state === 'yellow' ? 'начат' : 'не начат');
      return x.n + '. ' + x.title + ' - ' + word + frac;
    }));

    page();
    h2('Роли');
    ul(roles.map(function (r) {
      return Roles.nameOf(r) + (r.hard ? ' (трудная)' : '') + (r.interest ? ': ' + r.interest : '');
    }));
    if (String(sit.sourceText || '').trim()) {
      h3('Текст ситуации');
      p(sit.sourceText);
    }

    page();
    h2('1. Понять ситуацию');
    kv('Фабула', dash(sit.step1.fabula));
    kv('Сюжет', dash(sit.step1.plot));
    kv('Суть', dash(sit.step1.essence));
    h3('Пересказ в трех предложениях');
    ul(sit.step1.retell.map(function (t, i) { return (i + 1) + '. ' + dash(t); }));

    page();
    h2('2. Разобрать текст на фразы и слова');
    var phrases = sit.step2.phrases.filter(function (x) { return String(x.quote || '').trim(); });
    if (!phrases.length) p('Фраз не разобрано.');
    phrases.forEach(function (ph, i) {
      h3('Фраза ' + (i + 1) + ': ' + ph.quote);
      if (ph.purpose) kv('Зачем эта фраза в тексте', ph.purpose);
      C.LAYERS.forEach(function (l) {
        var rd = ph.readings.filter(function (r) { return r.layer === l.id && String(r.text || '').trim(); });
        var wm = ph.wordMeanings.filter(function (m) { return m.layer === l.id && String(m.text || '').trim(); });
        if (!rd.length && !wm.length) return;
        var items = rd.map(function (r) {
          return (r.starred ? '* ' : '') + r.text + (String(r.use || '').trim() ? ' (в переговорах: ' + r.use + ')' : '');
        }).concat(wm.map(function (m) { return m.word + ' - ' + m.text; }));
        kv(l.name, '');
        ul(items);
      });
    });
    var notes = C.LAYERS.filter(function (l) { return String(sit.step2.layerNotes[l.id] || '').trim(); });
    if (notes.length) {
      h3('Заметки по слоям');
      notes.forEach(function (l) { kv(l.name, sit.step2.layerNotes[l.id]); });
    }

    page();
    h2('3. Вытащить роль на положительного героя');
    roles.forEach(function (r) {
      var d = Schema.step3ForRole(sit, r.id);
      h3(Roles.nameOf(r));
      kv('Положительный герой', dash(d.heroVersion));
      ul(d.assumptions.filter(function (a) { return String(a.text || '').trim(); }).map(function (a) {
        var m = [];
        if (a.necessary) m.push('необходима');
        if (a.sufficient) m.push('достаточна');
        return a.text + (m.length ? ' (' + m.join(', ') + ')' : ' (без отметок: подозрительна)');
      }));
    });

    page();
    h2('4. Нежелательные построения и блоки');
    var thrOut = function (list, common) {
      list.filter(function (t) { return String(t.text || '').trim(); }).forEach(function (t) {
        kv((common ? 'Общее: ' : '') + t.text + (t.preemptive ? ' (на упреждение)' : ''),
          'Опасно: ' + dash(t.why) + '. Блок: ' + dash(t.block));
      });
    };
    h3('Общие построения');
    thrOut(sit.step4.common, true);
    roles.forEach(function (r) {
      var d = Schema.step4ForRole(sit, r.id);
      if (!d.threats.filter(function (t) { return String(t.text || '').trim(); }).length) return;
      h3(Roles.nameOf(r));
      thrOut(d.threats, false);
    });

    page();
    h2('5. Позиция мирового судьи и последствия');
    kv('Что сказал бы мировой судья', dash(sit.step5.judgeStatement));
    kv('Критерий', dash(sit.step5.criteria));
    kv('Решение', dash(sit.step5.decision));
    var nodes = sit.step5.consequences.nodes;
    var walk = function (parent, depth) {
      Schema.childrenOf(nodes, parent).forEach(function (nd) {
        var marks = nd.coord.map(function (c) {
          var L = '';
          C.COORDS.forEach(function (z) { if (z.id === c) L = z.letter; });
          return L;
        }).join('');
        var hn = '';
        C.HORIZONS.forEach(function (h) { if (h.id === nd.horizon) hn = h.name; });
        var sg = nd.sign === 'plus' ? '+' : '-';
        B.push({ t: 'li', depth: depth, text: sg + ' ' + dash(nd.text) + ' [' + hn + (marks ? ', ' + marks : '') + ']' });
        walk(nd.id, depth + 1);
      });
    };
    if (nodes.length) { h3('Дерево последствий'); walk(null, 0); }
    var pm = sit.step5.consequences.premortem.filter(function (m) { return String(m.text || '').trim(); });
    if (pm.length) {
      h3('Пре-мортем');
      pm.forEach(function (m) { kv(m.text, 'Заранее: ' + dash(m.counter)); });
    }

    page();
    h2('6. Ролевые соотношения');
    roles.forEach(function (r) {
      kv(Roles.nameOf(r), dash(Schema.step6ForRole(sit, r.id).helpAny));
    });
    var cells = [];
    roles.forEach(function (a) {
      roles.forEach(function (b) {
        if (a.id === b.id) return;
        var c = sit.step6.cells[Schema.cellKey(a.id, b.id)];
        if (!c || c.state === 'empty') return;
        var st = '';
        C.CELL_STATES.forEach(function (x) { if (x.id === c.state) st = x.name; });
        cells.push([Roles.nameOf(a), Roles.nameOf(b), st,
          String(c.helpOverride || '').trim() || String(c.notes || '').trim() || '']);
      });
    });
    if (cells.length) {
      h3('Матрица соотношений');
      B.push({ t: 'table', head: ['Моя роль', 'Соперник', 'Состояние', 'Что особенного'], rows: cells });
    }

    page();
    h2('7. Формулы');
    var fmOut = function (list) {
      C.FORMULA_TYPES.forEach(function (ty) {
        var items = list.filter(function (f) { return f.type === ty.id && String(f.text || '').trim(); });
        if (!items.length) return;
        kv(ty.name, '');
        ul(items.map(function (f) { return f.text; }));
      });
    };
    h3('Общие формулы');
    fmOut(sit.step7.common);
    roles.forEach(function (r) {
      var d = Schema.step7ForRole(sit, r.id);
      if (!d.formulas.filter(function (f) { return String(f.text || '').trim(); }).length) return;
      h3(Roles.nameOf(r));
      fmOut(d.formulas);
    });

    page();
    h2('8. Первая фраза');
    roles.forEach(function (r) {
      var d = Schema.step8ForRole(sit, r.id);
      h3(Roles.nameOf(r));
      kv('Какие задать роли', dash(d.roleAssignment));
      kv('Цель на раунд', dash(d.roundGoal));
      kv('Первая фраза', dash(d.firstPhrase));
      if (String(d.firstPhrase || '').trim()) {
        p(U.len(d.firstPhrase) + ' знаков, около ' + U.seconds(U.len(d.firstPhrase)) + ' секунд речи.');
      }
    });

    page();
    h2('9. Стратегия связанных раундов');
    kv('Общая стратегия', dash(sit.step9.strategy));
    sit.step9.rounds.forEach(function (r, i) {
      h3('Раунд ' + r.n + (r.myRoleId ? ' - роль «' + nameOf(r.myRoleId) + '»' : ''));
      kv('Цель', dash(r.goal));
      if (i < sit.step9.rounds.length - 1) kv('Связка со следующим', dash(r.carryOver));
      kv('Если не выйдет', dash(r.ifFails));
    });

    var qs = (sit.secondQuestions || []).filter(function (q) { return String(q.text || '').trim(); });
    if (qs.length) {
      page();
      h2('Вопросы секунданта');
      qs.forEach(function (q) {
        kv(q.text + (q.confident ? ' (отвечаю уверенно)' : ' (без уверенного ответа)'), dash(q.answer));
      });
    }
    var cm = (sit.comments || []).filter(function (c) { return String(c.text || '').trim(); });
    if (cm.length) {
      page();
      h2('Комментарии');
      cm.forEach(function (c) {
        kv(Comments.locate(c.path).label + (c.resolved ? ' (снято)' : ''), c.text);
      });
    }
    return B;
  },

  /* Самодостаточный HTML: стили внутри, ни одной внешней ссылки.
     Он же идет на печать, поэтому правила печати лежат тут же. */
  toHtml: function (sit, root) {
    var B = Report.build(sit, root);
    var e = U.esc;
    var body = B.map(function (b) {
      if (b.t === 'h1') return '<h1>' + e(b.text) + '</h1>';
      if (b.t === 'h2') return '<h2>' + e(b.text) + '</h2>';
      if (b.t === 'h3') return '<h3>' + e(b.text) + '</h3>';
      if (b.t === 'p') return '<p>' + e(b.text).replace(/\n/g, '<br>') + '</p>';
      if (b.t === 'kv') return '<p class="kv"><b>' + e(b.label) + '</b>' +
        (String(b.text || '').trim() ? ': ' + e(b.text).replace(/\n/g, '<br>') : '') + '</p>';
      if (b.t === 'ul') return '<ul>' + b.items.map(function (x) { return '<li>' + e(x) + '</li>'; }).join('') + '</ul>';
      if (b.t === 'li') return '<div class="tree" style="margin-left:' + (b.depth * 18) + 'px">' + e(b.text) + '</div>';
      if (b.t === 'table') return '<table><thead><tr>' +
        b.head.map(function (x) { return '<th>' + e(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        b.rows.map(function (r) {
          return '<tr>' + r.map(function (x) { return '<td>' + e(x) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      if (b.t === 'page') return '<div class="page"></div>';
      return '';
    }).join('\n');

    return '<!doctype html><html lang="ru"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + e(sit.title || C.TITLE_DEFAULT) + '</title><style>' +
      'body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;' +
      'color:#16191d;background:#fff;max-width:820px;margin:0 auto;padding:28px 20px 60px}' +
      'h1{font-size:26px;margin:0 0 6px}h2{font-size:21px;margin:26px 0 8px;border-bottom:1px solid #d8dde3;padding-bottom:4px}' +
      'h3{font-size:17px;margin:18px 0 6px}p{margin:0 0 8px}.kv{margin:0 0 6px}' +
      'ul{margin:4px 0 10px 22px;padding:0}li{margin:0 0 4px}' +
      '.tree{margin:2px 0;font-size:15px}' +
      'table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:14px}' +
      'th,td{border:1px solid #d8dde3;padding:6px 8px;text-align:left;vertical-align:top}' +
      'th{background:#f2f4f7}.page{height:0}' +
      '@media print{body{max-width:none;padding:0;font-size:12pt}' +
      '.page{page-break-before:always;height:0}' +
      'h2{page-break-after:avoid}h3{page-break-after:avoid}tr{page-break-inside:avoid}' +
      '@page{margin:18mm 14mm;}}' +
      '</style></head><body>' + body +
      '<hr style="margin-top:30px;border:0;border-top:1px solid #d8dde3">' +
      '<p style="color:#6b7480;font-size:13px">' + e(sit.title || C.TITLE_DEFAULT) + ' &middot; ' +
      e(U.dateShort(U.now())) + '</p>' +
      '</body></html>';
  },

  /* Markdown для Obsidian. */
  toMd: function (sit, root) {
    var B = Report.build(sit, root);
    var out = [];
    B.forEach(function (b) {
      if (b.t === 'h1') out.push('# ' + b.text, '');
      else if (b.t === 'h2') out.push('## ' + b.text, '');
      else if (b.t === 'h3') out.push('### ' + b.text, '');
      else if (b.t === 'p') out.push(b.text, '');
      else if (b.t === 'kv') out.push('**' + b.label + '**' + (String(b.text || '').trim() ? ': ' + b.text : ''), '');
      else if (b.t === 'ul') { b.items.forEach(function (x) { out.push('- ' + x); }); out.push(''); }
      else if (b.t === 'li') out.push(new Array(b.depth + 1).join('  ') + '- ' + b.text);
      else if (b.t === 'table') {
        out.push('| ' + b.head.join(' | ') + ' |');
        out.push('|' + b.head.map(function () { return '---'; }).join('|') + '|');
        b.rows.forEach(function (r) { out.push('| ' + r.join(' | ') + ' |'); });
        out.push('');
      } else if (b.t === 'page') out.push('');
    });
    return out.join('\n');
  },

  /* RTF. Кириллица уходит escape-последовательностями \uNNNN?, как в ТЗ:
     так документ открывается одинаково в Word, Pages и Google Docs. */
  rtfText: function (str) {
    var out = '';
    var t = String(str == null ? '' : str);
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i), code = t.charCodeAt(i);
      if (ch === '\\') out += '\\\\';
      else if (ch === '{') out += '\\{';
      else if (ch === '}') out += '\\}';
      else if (ch === '\n') out += '\\par ';
      else if (code < 128) out += ch;
      else out += '\\u' + (code > 32767 ? code - 65536 : code) + '?';
    }
    return out;
  },
  toRtf: function (sit, root) {
    var B = Report.build(sit, root);
    var T = Report.rtfText;
    var out = ['{\\rtf1\\ansi\\ansicpg1251\\deff0{\\fonttbl{\\f0\\fnil\\fcharset204 Calibri;}}\\fs22'];
    B.forEach(function (b) {
      if (b.t === 'h1') out.push('{\\pard\\sa180\\b\\fs40 ' + T(b.text) + '\\par}');
      else if (b.t === 'h2') out.push('{\\pard\\sb280\\sa140\\b\\fs30 ' + T(b.text) + '\\par}');
      else if (b.t === 'h3') out.push('{\\pard\\sb200\\sa100\\b\\fs24 ' + T(b.text) + '\\par}');
      else if (b.t === 'p') out.push('{\\pard\\sa120 ' + T(b.text) + '\\par}');
      else if (b.t === 'kv') out.push('{\\pard\\sa100{\\b ' + T(b.label) + '}' +
        (String(b.text || '').trim() ? ': ' + T(b.text) : '') + '\\par}');
      else if (b.t === 'ul') b.items.forEach(function (x) {
        out.push('{\\pard\\fi-220\\li440\\sa60\\bullet\\tab ' + T(x) + '\\par}');
      });
      else if (b.t === 'li') out.push('{\\pard\\li' + (440 + b.depth * 300) + '\\sa40 ' + T(b.text) + '\\par}');
      else if (b.t === 'table') {
        var widths = [], step = Math.floor(9000 / b.head.length), k;
        for (k = 0; k < b.head.length; k++) widths.push((k + 1) * step);
        var row = function (cells, bold) {
          var r = '{\\trowd\\trgaph80';
          for (k = 0; k < widths.length; k++) r += '\\clbrdrt\\brdrs\\clbrdrl\\brdrs\\clbrdrb\\brdrs\\clbrdrr\\brdrs\\cellx' + widths[k];
          for (k = 0; k < cells.length; k++) r += '\\intbl ' + (bold ? '{\\b ' : '') + T(cells[k]) + (bold ? '}' : '') + '\\cell';
          return r + '\\row}';
        };
        out.push(row(b.head, true));
        b.rows.forEach(function (r) { out.push(row(r, false)); });
      } else if (b.t === 'page') out.push('{\\pard\\page\\par}');
    });
    out.push('}');
    return out.join('\n');
  },

  /* Печать. Отчет уходит в отдельный кадр и печатается оттуда:
     так на бумагу попадает все содержание разом, без свернутых шагов
     и без навигации, с разрывом страницы перед каждым шагом. */
  print: function (sit, root) {
    var html = Report.toHtml(sit, root);
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(frame);
    var done = false;
    var go = function () {
      if (done) return;
      done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (e) { /* печать могли запретить */ }
      setTimeout(function () { if (frame.parentNode) frame.parentNode.removeChild(frame); }, 1000);
    };
    frame.onload = go;
    try {
      var d = frame.contentWindow.document;
      d.open();
      d.write(html);
      d.close();
    } catch (e) {
      if (frame.parentNode) frame.parentNode.removeChild(frame);
      return false;
    }
    setTimeout(go, 300);   // если onload не пришел
    return true;
  },

  fileName: function (sit, ext) {
    var t = String(sit.title || C.TITLE_DEFAULT).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
    return U.cut(t, 60) + ' - ' + U.dateFile() + '.' + ext;
  }
};

/* ---------------------------------------------------------------------
   9д. Репетиция. Раздел 7 ТЗ. Чистая часть: время и содержание карточки.
   Часы считаются по системному времени, а не сложением тиков: вкладка
   в фоне тикает как попало, а раунд должен кончиться вовремя.
   --------------------------------------------------------------------- */
var Rehearsal = {
  /* Оставшееся время. st = { total, startedAt, elapsed, running } */
  left: function (st, now) {
    var spent = st.elapsed + (st.running ? Math.max(0, (now || U.now()) - st.startedAt) : 0);
    return Math.max(0, st.total - Math.floor(spent / 1000));
  },
  clock: function (sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  },
  /* Какой сигнал пора подать при переходе через границу. */
  signalAt: function (prevLeft, left) {
    if (prevLeft > 0 && left === 0) return 'end';
    if (prevLeft > C.WARN_SECONDS && left <= C.WARN_SECONDS) return 'warn';
    return '';
  },

  /* Формулы роли по типам: общий уровень и уровень роли вместе. */
  formulasByType: function (sit, roleId) {
    var out = [];
    C.FORMULA_TYPES.forEach(function (t) {
      var items = [];
      var take = function (list, common) {
        (list || []).forEach(function (f) {
          if (f && f.type === t.id && String(f.text || '').trim()) items.push({ f: f, common: common });
        });
      };
      take((sit.step7 || {}).common, true);
      take(((sit.step7 || {}).byRole || {})[roleId] && sit.step7.byRole[roleId].formulas, false);
      if (items.length) out.push({ type: t, items: items });
    });
    return out;
  },

  /* Случайный вопрос секунданта из этой ситуации. Приложение ничего
     не оценивает: оно только достает вопрос. */
  randomQuestion: function (sit, rnd) {
    var list = (sit.secondQuestions || []).filter(function (q) { return String(q.text || '').trim(); });
    if (!list.length) return null;
    return list[Math.floor((rnd === undefined ? Math.random() : rnd) * list.length) % list.length];
  },

  /* Самопроверка «пересказать из любого места», раздел 5.2 ТЗ:
     случайное предложение текста ситуации, дальше человек говорит вслух. */
  randomSentence: function (sit, rnd) {
    var list = Schema.sentences(sit.sourceText);
    if (!list.length) return null;
    return list[Math.floor((rnd === undefined ? Math.random() : rnd) * list.length) % list.length];
  }
};

/* ---------------------------------------------------------------------
   9г. Звук репетиции. Раздел 7 и пункт 14.2 ТЗ.

   Механика перенесена из `tournament-checkin` v0.9.3, как велит пункт
   14.2, и сводится к одному наблюдению: беззвучный переключатель
   айфона глушит WebAudio, но не глушит медийный канал. Поэтому сигнал
   синтезируется в WAV, кладется в data-адрес и играет через обычный
   HTMLAudio. Разблокировка обязательна: первый запуск делается тихим
   и по касанию, иначе браузер не даст играть потом.

   WebAudio остался запасным путем, вибрация идет вдобавок.

   Оговорка, честно перенесенная вместе с решением: в паспорте
   `tournament-checkin` этот звук помечен как требующий боевой проверки
   на реальном айфоне, и такая проверка там не проводилась. Здесь она
   тоже не проводилась - это первый пункт приемки 0.8.
   --------------------------------------------------------------------- */
var Sound = {
  ctx: null,
  bank: {},
  ready: false,

  /* Синтез WAV: части вида [частота, длительность]; нулевая частота - пауза. */
  wav: function (parts) {
    var sr = 22050, total = 0, i, j;
    for (i = 0; i < parts.length; i++) total += Math.round(parts[i][1] * sr);
    var data = new Int16Array(total), pos = 0;
    for (i = 0; i < parts.length; i++) {
      var freq = parts[i][0];
      var cnt = Math.round(parts[i][1] * sr);
      var fade = Math.min(Math.round(0.008 * sr), Math.floor(cnt / 2));
      for (j = 0; j < cnt; j++) {
        var amp = freq === 0 ? 0 : 0.85;
        if (j < fade) amp = amp * j / fade;
        if (j > cnt - fade) amp = amp * (cnt - j) / fade;
        data[pos + j] = Math.round(Math.sin(2 * Math.PI * freq * j / sr) * amp * 32767);
      }
      pos += cnt;
    }
    var bytes = new Uint8Array(44 + data.length * 2);
    var dv = new DataView(bytes.buffer);
    var wstr = function (off, str) {
      for (var k = 0; k < str.length; k++) bytes[off + k] = str.charCodeAt(k);
    };
    wstr(0, 'RIFF'); dv.setUint32(4, 36 + data.length * 2, true); wstr(8, 'WAVE');
    wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    wstr(36, 'data'); dv.setUint32(40, data.length * 2, true);
    new Uint8Array(bytes.buffer, 44).set(new Uint8Array(data.buffer));
    var bin = '', CH = 8192;
    for (i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length)));
    }
    return 'data:audio/wav;base64,' + btoa(bin);
  },

  /* Две части сигнала: предупреждение за минуту и конец раунда.
     Конец звучит ниже и длиннее: его нельзя перепутать с предупреждением. */
  PARTS: {
    warn: [[880, 0.12], [0, 0.05], [880, 0.12]],
    end: [[520, 0.28], [0, 0.06], [392, 0.45]]
  },

  /* Разблокировка по касанию. Без нее айфон не даст играть звук потом. */
  unlock: function () {
    if (Sound.ready) { Sound.resume(); return; }
    try {
      var k;
      for (k in Sound.PARTS) {
        if (!Object.prototype.hasOwnProperty.call(Sound.PARTS, k)) continue;
        var a = new Audio(Sound.wav(Sound.PARTS[k]));
        a.preload = 'auto';
        Sound.bank[k] = a;
        (function (au) {
          au.muted = true;
          var pr = au.play();
          if (pr && pr.then) {
            pr.then(function () { au.pause(); au.currentTime = 0; au.muted = false; },
              function () { au.muted = false; });
          } else { au.muted = false; }
        })(a);
      }
      Sound.ready = true;
    } catch (e) { Sound.ready = false; }
    Sound.resume();
  },

  resume: function () {
    try {
      if (!Sound.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) Sound.ctx = new AC();
      }
      if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
    } catch (e) { /* без звука репетиция все равно идет */ }
  },

  /* Запасной путь: чистый WebAudio. Беззвучный переключатель его глушит. */
  tone: function (freq, dur, delay) {
    if (!Sound.ctx) return;
    try {
      var osc = Sound.ctx.createOscillator();
      var gain = Sound.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.25;
      osc.connect(gain);
      gain.connect(Sound.ctx.destination);
      var t = Sound.ctx.currentTime + (delay || 0);
      osc.start(t);
      osc.stop(t + dur);
    } catch (e) { /* не критично */ }
  },
  fallback: function (kind) {
    if (kind === 'end') { Sound.tone(520, 0.3); Sound.tone(392, 0.45, 0.34); }
    else { Sound.tone(880, 0.12); Sound.tone(880, 0.12, 0.17); }
  },

  play: function (kind) {
    var a = Sound.ready ? Sound.bank[kind] : null;
    if (a) {
      try {
        a.currentTime = 0;
        var pr = a.play();
        if (pr && pr.catch) pr.catch(function () { Sound.fallback(kind); });
      } catch (e) { Sound.fallback(kind); }
    } else {
      Sound.fallback(kind);
    }
    try {
      if (navigator.vibrate) navigator.vibrate(kind === 'end' ? [120, 80, 120] : 90);
    } catch (e) { /* не критично */ }
  }
};

/* ---------------------------------------------------------------------
   9в. Комментарии к полям. Раздел 5.12 ТЗ.
   Секундант не правит ваши формулировки, он их оспаривает, поэтому
   возражение висит на конкретном поле, а не на ситуации вообще.
   В приложение секундант не заходит: комментарии записывает участник
   с его слов, поле author осталось от прежней редакции ТЗ.
   --------------------------------------------------------------------- */
var Comments = {
  /* Куда ведет путь поля. Порядок важен: первое совпадение выигрывает,
     поэтому длинные приставки идут раньше коротких. */
  MAP: [
    ['step1.retell', 's1', 'Пересказ в трех предложениях'],
    ['step1.fabula', 's1', 'Фабула'],
    ['step1.plot', 's1', 'Сюжет'],
    ['step1.essence', 's1', 'Суть'],
    ['step2.layerNotes', 's2', 'Заметка по слою'],
    ['step2.phrases', 's2', 'Разбор фразы'],
    ['step3.', 's3', 'Положительный герой роли'],
    ['step4.', 's4', 'Нежелательное построение'],
    ['step5.consequences.premortem', 's5', 'Пре-мортем'],
    ['step5.consequences', 's5', 'Дерево последствий'],
    ['step5.judgeStatement', 's5', 'Позиция мирового судьи'],
    ['step5.criteria', 's5', 'Критерий'],
    ['step5.decision', 's5', 'Решение'],
    ['step6.cells', 's6', 'Клетка матрицы соотношений'],
    ['step6.', 's6', 'Общий ответ роли'],
    ['step7.', 's7', 'Формула'],
    ['step8.', 's8', 'Первая фраза и цель'],
    ['step9.', 's9', 'Стратегия раундов'],
    ['secondQuestions', 'sq', 'Вопрос секунданта'],
    ['sourceText', 'setup', 'Текст ситуации'],
    ['context', 'setup', 'Турнир и дата'],
    ['title', 'setup', 'Название ситуации'],
    ['roles', 'setup', 'Роли']
  ],
  locate: function (path) {
    var p = String(path || '');
    for (var i = 0; i < Comments.MAP.length; i++) {
      if (p.indexOf(Comments.MAP[i][0]) === 0) {
        return { sec: Comments.MAP[i][1], label: Comments.MAP[i][2] };
      }
    }
    return { sec: 'setup', label: 'Поле' };
  },

  forPath: function (sit, path) {
    return (sit.comments || []).filter(function (c) { return c.path === path; });
  },
  openForPath: function (sit, path) {
    return Comments.forPath(sit, path).filter(function (c) {
      return !c.resolved && String(c.text || '').trim();
    });
  },
  open: function (sit) {
    return (sit.comments || []).filter(function (c) {
      return !c.resolved && String(c.text || '').trim();
    });
  },
  /* Комментарии, сгруппированные по полю: так их читают при разборе. */
  grouped: function (sit) {
    var order = [], by = {};
    (sit.comments || []).forEach(function (c) {
      if (!by[c.path]) { by[c.path] = []; order.push(c.path); }
      by[c.path].push(c);
    });
    return order.map(function (p) {
      return { path: p, place: Comments.locate(p), items: by[p] };
    });
  }
};

/* ---------------------------------------------------------------------
   9б. Копирование между ролями. Раздел 10 ТЗ.
   Копируется текст, а не связь: скопированное правится свободно и
   с исходной ролью больше ничем не связано.

var Copy = {

/* ---------------------------------------------------------------------
   9a. Светофор готовности. Раздел 6 ТЗ.
   Чистые функции над ситуацией: ни базы, ни разметки. Каждый шаг
   отвечает за себя, пороги берутся из C. У шагов, зависящих от роли,
   к точке добавляется дробь: сколько ролей закрыто из скольких.
   --------------------------------------------------------------------- */
var Express = {
  /* Экспресс-режим, раздел 10 ТЗ: показываются только поля, которые
     считает светофор. Список скрываемого закрытый и лежит здесь, чтобы
     его можно было прочитать целиком, а не собирать по всему файлу.
     Скрываются: фабула и сюжет (шаг 1); "зачем эта фраза" и заметки
     по слоям (шаг 2); "чем опасно" (шаг 4);
     позиция судьи и упреждающее действие (шаг 5); заметка клетки и
     ответ для пары (шаг 6); "какие задать роли" (шаг 8); "что если
     не выйдет" (шаг 9). */
  flag: false,
  on: function () { return !!Express.flag; },
  set: function (v) { Express.flag = !!v; }
};

var Traffic = {
  TITLES: {
    1: 'Понять ситуацию',
    2: 'Разобрать текст на фразы и слова',
    3: 'Вытащить роль на положительного героя',
    4: 'Нежелательные построения и блоки',
    5: 'Позиция мирового судьи и последствия',
    6: 'Ролевые соотношения',
    7: 'Формулы',
    8: 'Первая фраза',
    9: 'Стратегия связанных раундов'
  },
  SECTIONS: { 1: 's1', 2: 's2', 3: 's3', 4: 's4', 5: 's5', 6: 's6', 7: 's7', 8: 's8', 9: 's9' },

  /* Общая мерка для шагов по ролям: закрыто столько-то ролей из стольких-то. */
  byRole: function (sit, isReady) {
    var roles = sit.roles || [];
    var done = roles.filter(function (r) { return isReady(sit, r.id); }).length;
    return {
      done: done, total: roles.length,
      state: !roles.length ? 'red' : (done === roles.length ? 'green' : (done ? 'yellow' : 'red'))
    };
  },

  /* Шаг 1. Зеленый: суть и три предложения. Желтый: что-то заполнено. */
  step1: function (sit) {
    var d = sit.step1 || {};
    var retell = (d.retell || []).filter(function (t) { return String(t || '').trim(); }).length;
    var essence = !!String(d.essence || '').trim();
    if (essence && retell >= C.RETELL_COUNT) return { state: 'green' };
    var any = essence || retell > 0 || String(d.fabula || '').trim() || String(d.plot || '').trim();
    return { state: any ? 'yellow' : 'red' };
  },

  /* Шаг 2. Зеленый: пять фраз, у каждой две трактовки, пять слоев. */
  step2: function (sit) {
    var ph = (sit.step2 && sit.step2.phrases) || [];
    var real = ph.filter(function (p) { return String(p.quote || '').trim(); });
    var withTwo = real.filter(function (p) {
      return (p.readings || []).filter(function (r) { return String(r.text || '').trim(); }).length >= C.READINGS_PER_PHRASE;
    }).length;
    var used = {};
    real.forEach(function (p) { Schema.layersOf(p).forEach(function (l) { used[l] = 1; }); });
    var layers = Object.keys(used).length;
    var green = real.length >= C.PHRASES_GREEN && withTwo === real.length && layers >= C.LAYERS_GREEN;
    return {
      state: green ? 'green' : (real.length ? 'yellow' : 'red'),
      note: real.length ? ('фраз ' + real.length + ', с двумя трактовками ' + withTwo + ', слоев ' + layers) : ''
    };
  },

  /* Шаг 3. Зеленый: у роли есть герой и вводная с обеими отметками. */
  role3: function (sit, roleId) {
    var d = (sit.step3 && sit.step3.byRole && sit.step3.byRole[roleId]) || null;
    if (!d || !String(d.heroVersion || '').trim()) return false;
    return (d.assumptions || []).some(function (a) {
      return String(a.text || '').trim() && a.necessary && a.sufficient;
    });
  },
  step3: function (sit) { return Traffic.byRole(sit, Traffic.role3); },

  /* Шаг 4. Зеленый: две угрозы с блоками, считая общий уровень.
     Желтый по ТЗ: есть угрозы без блоков. */
  step4: function (sit) {
    var r = Traffic.byRole(sit, Schema.step4Ready);
    if (r.state !== 'green') {
      var any = (sit.roles || []).some(function (x) { return Schema.threatsOf(sit, x.id).length; });
      r.state = any ? 'yellow' : 'red';
    }
    return r;
  },

  /* Шаг 5. Зеленый: решение, критерий, пять узлов, непустой пре-мортем.
     Желтый: заполнены только текстовые поля. */
  step5: function (sit) {
    if (Schema.step5Ready(sit)) return { state: 'green' };
    var d = sit.step5 || {};
    var text = String(d.judgeStatement || '').trim() || String(d.criteria || '').trim() || String(d.decision || '').trim();
    var st = Schema.treeStats(sit);
    return {
      state: (text || st.filled) ? 'yellow' : 'red',
      note: st.filled ? ('последствий ' + st.filled + ' из ' + C.TREE_NODES_GREEN) : ''
    };
  },

  /* Шаг 6. Зеленый: у всех ролей общий ответ и все клетки разобраны. */
  role6: function (sit, roleId) {
    return !!String(Schema.step6ForRole(sit, roleId).helpAny || '').trim();
  },
  step6: function (sit) {
    var r = Traffic.byRole(sit, Traffic.role6);
    var p = Schema.step6Progress(sit);
    r.note = 'клеток ' + p.done + ' из ' + p.total;
    if (r.state === 'green' && !(p.total > 0 && p.done === p.total)) r.state = 'yellow';
    return r;
  },

  /* Шаг 7. Зеленый: все четыре типа формул, считая общий уровень. */
  step7: function (sit) {
    var r = Traffic.byRole(sit, Schema.formulasReady);
    if (r.state !== 'green') {
      var any = (sit.roles || []).some(function (x) {
        return Object.keys(Schema.formulaTypesOf(sit, x.id)).length > 0;
      });
      r.state = any ? 'yellow' : 'red';
    }
    return r;
  },

  /* Шаг 8. Зеленый: у роли есть первая фраза и цель на раунд. */
  role8: function (sit, roleId) {
    var d = (sit.step8 && sit.step8.byRole && sit.step8.byRole[roleId]) || null;
    return !!(d && String(d.firstPhrase || '').trim() && String(d.roundGoal || '').trim());
  },
  step8: function (sit) { return Traffic.byRole(sit, Traffic.role8); },

  /* Шаг 9. Зеленый: у всех раундов цель, у всех кроме последнего связка. */
  step9: function (sit) {
    var p = Schema.step9Progress(sit);
    if (!p.total) return { state: 'red' };
    if (Schema.step9Ready(sit)) return { state: 'green', note: 'раундов ' + p.total };
    var any = p.goals > 0 || String((sit.step9 && sit.step9.strategy) || '').trim();
    return {
      state: any ? 'yellow' : 'red',
      note: 'с целью ' + p.goals + ' из ' + p.total + (p.breaks ? ', разрывов ' + p.breaks : '')
    };
  },

  /* Все девять точек разом. Порядок фиксирован: это порядок шагов. */
  of: function (sit) {
    var out = [];
    for (var i = 1; i <= 9; i++) {
      var r = Traffic['step' + i](sit) || { state: 'red' };
      out.push({
        n: i,
        sec: Traffic.SECTIONS[i],
        title: Traffic.TITLES[i],
        state: r.state,
        done: (typeof r.done === 'number') ? r.done : null,
        total: (typeof r.total === 'number') ? r.total : null,
        note: r.note || ''
      });
    }
    return out;
  },

  /* Сводка для экрана «Готов?» и для карточки в списке. */
  summary: function (sit) {
    var pts = Traffic.of(sit);
    return {
      points: pts,
      green: pts.filter(function (p) { return p.state === 'green'; }).length,
      yellow: pts.filter(function (p) { return p.state === 'yellow'; }).length,
      red: pts.filter(function (p) { return p.state === 'red'; }).length,
      openQuestions: Schema.openQuestions(sit)
    };
  }
};

/* ---------------------------------------------------------------------
   10a. Копилка формул. Раздел 5.13 ТЗ. Чистые функции отбора и переноса:
   ни базы, ни разметки. Связей между копилкой и ситуациями нет
   намеренно - есть только копия текста и память о происхождении.
   --------------------------------------------------------------------- */
var Library = {
  typeName: function (id) {
    for (var i = 0; i < C.FORMULA_TYPES.length; i++) if (C.FORMULA_TYPES[i].id === id) return C.FORMULA_TYPES[i].name;
    return 'Свое';
  },

  /* Результативность: доля сработавших применений. Заготовка, которую еще
     не проверяли в поединке, считается нейтральной, иначе один удачный
     случай выносил бы новичка выше проверенных заготовок. */
  score: function (f) {
    var total = (f.worked || 0) + (f.failed || 0);
    return total ? (f.worked || 0) / total : 0;
  },

  matches: function (f, query) {
    var q = String(query || '').trim().toLowerCase();
    if (!q) return true;
    if (String(f.text || '').toLowerCase().indexOf(q) >= 0) return true;
    if (String(f.comment || '').toLowerCase().indexOf(q) >= 0) return true;
    return (f.tags || []).some(function (t) { return String(t).toLowerCase().indexOf(q) >= 0; });
  },

  /* opts = { type, query, sort: recent | used | result } */
  select: function (list, opts) {
    var o = opts || {};
    var out = (list || []).filter(function (f) {
      if (o.type && o.type !== 'all' && f.type !== o.type) return false;
      return Library.matches(f, o.query);
    });
    var mode = o.sort || 'recent';
    out.sort(function (a, b) {
      if (mode === 'used') {
        var ua = (a.usedIn || []).length, ub = (b.usedIn || []).length;
        if (ua !== ub) return ub - ua;
      } else if (mode === 'result') {
        var sa = Library.score(a), sb = Library.score(b);
        if (sa !== sb) return sb - sa;
        var na = (a.worked || 0) + (a.failed || 0), nb = (b.worked || 0) + (b.failed || 0);
        if (na !== nb) return nb - na;
      }
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    return out;
  },

  parseTags: function (text) {
    var seen = {}, out = [];
    String(text || '').split(/[,;]+/).forEach(function (t) {
      t = t.trim().toLowerCase();
      if (!t || seen[t]) return;
      seen[t] = 1;
      out.push(t);
    });
    return out.slice(0, C.LIB_TAGS_MAX);
  },

  /* Из ситуации в копилку: заводится новая заготовка с копией текста. */
  send: function (formula, situationId) {
    var f = Storage.addFormula(Schema.newLibFormula(formula.type, formula.text));
    if (f && situationId) Storage.patchFormula(f.id, 'usedIn', [situationId]);
    return f;
  },

  /* Из копилки в ситуацию: возвращается копия, готовая лечь в шаг 7.
     Заготовка запоминает, где ее применили. */
  take: function (libId, situationId) {
    var f = Storage.getFormula(libId);
    if (!f) return null;
    if (situationId && (f.usedIn || []).indexOf(situationId) < 0) {
      Storage.patchFormula(libId, 'usedIn', (f.usedIn || []).concat([situationId]));
    }
    return Schema.newSitFormula(f.type, f.text, f.id);
  }
};

/* ---------------------------------------------------------------------
   11. Отрисовка. Никакого фреймворка: строки HTML плюс делегирование
   событий. Поле, в котором стоит курсор, при вводе не перерисовывается.
   --------------------------------------------------------------------- */
var View = (function () {

  function saveIndicator(state) {
    var txt = state === 'saving' ? 'Сохранение' : (state === 'dirty' ? 'Не сохранено' : 'Сохранено');
    return '<span class="save ' + state + '" id="save-ind" title="' + txt + '"><span class="d"></span>' +
      '<span class="t">' + txt + '</span></span>';
  }

  /* Значок состояния синхронизации. Раздел 9.2 ТЗ. */
  var CLOUD_LOOK = {
    off: { icon: 'cloud_off', cls: 'muted', text: 'Синхронизация выключена' },
    idle: { icon: 'cloud_ok', cls: 'ok', text: 'Синхронизировано с Диском' },
    busy: { icon: 'cloud_sync', cls: 'busy', text: 'Обмен с Диском' },
    offline: { icon: 'cloud_off', cls: 'muted', text: 'Нет связи, работаем на устройстве' },
    needauth: { icon: 'cloud_alert', cls: 'warn', text: 'Нужен вход в Google' },
    conflict: { icon: 'cloud_alert', cls: 'warn', text: 'Расхождение с облаком' },
    error: { icon: 'cloud_alert', cls: 'warn', text: 'Синхронизация не удалась' }

  function cloudBtn(state) {
    var look = CLOUD_LOOK[state] || CLOUD_LOOK.off;
    return '<button class="btn btn-ghost btn-icon cloud-btn ' + look.cls + '" data-act="cloud" id="cloud-ind" title="' +
      U.esc(look.text) + '" aria-label="' + U.esc(look.text) + '">' + Icons(look.icon) + '</button>';
  }

  function themeBtn(theme) {
    return '<button class="btn btn-ghost btn-icon" data-act="theme" title="' + U.esc(Theme.label[theme]) +
      '" aria-label="' + U.esc(Theme.label[theme]) + '">' + Icons(Theme.icon[theme]) + '</button>';
  }

  /* Девять точек светофора. Раздел 6 ТЗ: у шагов по ролям дробь. */
  function lights(sit) {
    var pts = Traffic.of(sit);
    return '<div class="lights" id="lights">' + pts.map(function (p) {
      var frac = (p.total !== null && p.total > 0) ? (p.done + '/' + p.total) : '';
      return '<button class="lt ' + p.state + '" data-act="light" data-sec="' + p.sec + '" title="' +
        U.esc(p.n + '. ' + p.title + (p.note ? ': ' + p.note : '')) + '">' +
        '<span class="d"></span><b>' + p.n + '</b>' + (frac ? '&nbsp;' + frac : '') + '</button>';
    }).join('') + '</div>';
  }

  function lightsMini(sit) {
    return '<div class="lights-mini" aria-hidden="true">' + Traffic.of(sit).map(function (p) {
      return '<i class="' + p.state + '"></i>';
    }).join('') + '</div>';
  }

  /* Полоска в заголовке шага: закрашены роли, где шаг заполнен. */
  function accBar(sit, sec) {
    var fn = { s3: Traffic.role3, s4: Schema.step4Ready, s6: Traffic.role6, s7: Schema.formulasReady, s8: Traffic.role8 }[sec];
    if (!fn) return '';
    return '<span class="acc-bar" aria-hidden="true">' + Roles.sorted(sit.roles).map(function (r) {
      return '<i class="' + (fn(sit, r.id) ? 'on' : '') + '"></i>';
    }).join('') + '</span>';
  }

  function counter(id, len, max, withTime) {
    var cls = 'counter';
    if (len >= max) cls += ' full';
    else if (max === C.PHRASE_MAX && len > C.PHRASE_WARN) cls += ' warn';
    var t = '<span>' + len + ' из ' + max + '</span>';
    if (withTime) t += '<span>около ' + U.seconds(len) + ' с речи</span>';
    return '<div class="' + cls + '" data-counter-for="' + id + '" data-max="' + max + '"' +
      (withTime ? ' data-time="1"' : '') + '>' + t + '</div>';
  }

  function textarea(o) {
    // o = {id, path, value, rows, max, time, placeholder}
    var v = String(o.value || '');
    return '<textarea id="' + o.id + '" rows="' + (o.rows || 3) + '" data-field="' + o.path + '"' +
      (o.max ? ' data-max="' + o.max + '" maxlength="' + o.max + '"' : '') +
      (o.placeholder ? ' placeholder="' + U.esc(o.placeholder) + '"' : '') +
      '>' + U.esc(v) + '</textarea>' +
      (o.max ? counter(o.id, U.len(v), o.max, !!o.time) : '');
  }

  /* Точка у поля: раздел 5.12 ТЗ. Открытый комментарий виден, не открывая
     ничего. Ситуация приходит через замыкание отрисовки, потому что
     field() зовут из двух десятков мест. */
  var CUR = null;   // ситуация, которую рисуем прямо сейчас
  var SELF = '';    // предложение самопроверки: живет на сеанс, в данные не входит

  function commentDot(path) {
    if (!CUR || !path) return '';
    var open = Comments.openForPath(CUR, path).length;
    var all = Comments.forPath(CUR, path).length;
    return '<button class="cmt-btn' + (open ? ' has' : '') + '" data-act="cmt" data-path="' + U.esc(path) +
      '" title="' + (open ? 'Открытых возражений: ' + open : (all ? 'Возражения сняты' : 'Записать возражение секунданта')) +
      '" aria-label="Комментарии к полю">' +
      '<span class="dot"></span>' + (all ? all : '') + '</button>';
  }

  function field(label, hint, inner, path) {
    return '<div class="field"><span class="label">' + U.esc(label) + commentDot(path) + '</span>' +
      (hint ? '<div class="hint">' + U.esc(hint) + '</div>' : '') + inner + '</div>';
  }

  /* ---------------- экран 1: список ситуаций ---------------- */

  function screenList(root, state) {
    var list = Trash.alive(root.situations).slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    var trashed = Trash.inTrash(root.situations);
    var cards = list.map(function (s) {
      var roles = s.roles.length;
      return '<div class="card sit-card">' +
        '<div class="sit-main" data-act="open-sit" data-id="' + s.id + '" role="button" tabindex="0">' +
        '<div class="sit-title">' + U.esc(s.title || C.TITLE_DEFAULT) + '</div>' +
        (s.context ? '<div class="muted">' + U.esc(s.context) + '</div>' : '') +
        '<div class="muted">' + roles + ' ' + plural(roles, 'роль', 'роли', 'ролей') +
        ' &middot; изменена ' + U.dateShort(s.updatedAt) + '</div>' +
        lightsMini(s) +
        '</div>' +
        '<button class="btn btn-ghost btn-icon" data-act="rename-sit" data-id="' + s.id + '" title="Переименовать" aria-label="Переименовать">' + Icons('pencil') + '</button>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-sit" data-id="' + s.id + '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button>' +
        '</div>';
    }).join('');

    return '<header class="hdr"><div class="hdr-in">' +
      '<div class="hdr-title"><h1>Подготовка к поединку</h1>' +
      '<div class="hdr-sub">Версия ' + C.APP_VERSION + ', синхронизация ' + C.SYNC_VERSION + '</div></div>' +
      saveIndicator(state) + cloudBtn(Cloud.state()) + themeBtn(root.settings.theme) +
      '</div></header>' +
      '<div class="wrap">' +
      banners(root) +
      '<div class="row" style="margin:16px 0">' +
      '<button class="btn btn-primary" data-act="new-sit">' + Icons('plus') + 'Новая ситуация</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" data-act="library">' + Icons('doc') + 'Копилка формул' +
      (root.formulaLibrary.length ? ' <span class="muted">' + root.formulaLibrary.length + '</span>' : '') + '</button>' +
      '</div>' +
      (cards || '<div class="empty">Ситуаций пока нет.<br>Начните с кнопки «Новая ситуация».</div>') +
      '<div class="sep"></div>' +
      '<div class="card">' +
      '<h3 style="margin-bottom:6px">Архив</h3>' +
      '<div class="muted" style="margin-bottom:12px">Выгруженный файл переносит все ситуации на другое устройство и служит резервной копией. Синхронизации пока нет, поэтому копия - единственная страховка.</div>' +
      '<div class="row">' +
      '<button class="btn" data-act="export">' + Icons('down_tray') + 'Выгрузить архив</button>' +
      '<button class="btn" data-act="import">' + Icons('up_tray') + 'Загрузить архив</button>' +
      (trashed.length
        ? '<span class="spacer"></span><button class="btn" data-act="trash">' + Icons('trash') +
          'Корзина <span class="muted">' + trashed.length + '</span></button>'
        : '') +
      '</div></div>' +
      '<div class="muted" style="text-align:center;margin-top:20px">Данные хранятся только в этом браузере.</div>' +
      '</div>';
  }

  /* Баннеры сохранности. Раздел 3.1 ТЗ: баннер в шапке, не модальное окно. */
  var SAFE = { installHint: false, lastExport: 0, hintOff: false };

  function banners(root) {
    var out = '';
    /* Условие считается на месте, а не заранее: ситуации появляются и
       исчезают, а баннер должен отвечать текущему состоянию. */
    var hasData = Trash.alive(root.situations).length > 0;
    var need = Safety.needExportHint(SAFE.lastExport, root.settings.cloud.connected, hasData, U.now());
    var days = (need && SAFE.lastExport) ? Safety.daysSince(SAFE.lastExport, U.now()) : null;
    if (Tabs.locked) {
      out += '<div class="banner"><span class="bt">' +
        '<b>Данные изменены в другой вкладке приложения.</b> Правки здесь больше не сохраняются, ' +
        'чтобы две вкладки не затерли работу друг друга. Выгрузите архив, если тут есть несохраненное, ' +
        'и обновите страницу.' +
        '</span><button class="btn btn-sm" data-act="export">Выгрузить архив</button>' +
        '<button class="btn btn-sm btn-primary" data-act="reload">Обновить</button></div>';
    }
    if (SAFE.installHint) {
      out += '<div class="banner calm"><span class="bt">' +
        '<b>Поставьте приложение на домашний экран.</b> Нажмите «Поделиться» внизу Safari и выберите «На экран Домой». ' +
        'Safari стирает данные сайтов, которыми не пользовались неделю; установленное приложение под эту чистку не попадает.' +
        '</span><button class="btn btn-sm" data-act="hint-off">Понятно</button></div>';
    }
    if (need) {
      out += '<div class="banner"><span class="bt">' +
        (days === null
          ? '<b>Архив ни разу не выгружался.</b> '
          : '<b>Архив выгружался ' + days + ' ' + plural(days, 'день', 'дня', 'дней') + ' назад.</b> ') +
        'Данные лежат только в этом браузере. Выгрузите архив или включите синхронизацию с Диском.' +
        '</span><button class="btn btn-sm" data-act="export">Выгрузить</button>' +
        '<button class="btn btn-sm" data-act="cloud">Синхронизация</button></div>';
    }
    return out;
  }

  function plural(n, one, few, many) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }

  /* ---------------- экран 2: ситуация ---------------- */

  function roleBar(sit, activeId, step) {
    var tabs = Roles.sorted(sit.roles).map(function (r) {
      var filled;
      if (step === 's3') filled = !!(sit.step3.byRole[r.id] && String(sit.step3.byRole[r.id].heroVersion || '').trim());
      else if (step === 's4') filled = Schema.step4Ready(sit, r.id);
      else if (step === 's6') filled = !!String(Schema.step6ForRole(sit, r.id).helpAny || '').trim();
      else if (step === 's7') filled = Schema.formulasReady(sit, r.id);
      else filled = !!(sit.step8.byRole[r.id] && String(sit.step8.byRole[r.id].firstPhrase || '').trim());
      return '<button class="role-tab' + (r.id === activeId ? ' on' : '') + '" data-act="role" data-id="' + r.id + '">' +
        '<span class="dot' + (filled ? ' filled' : '') + '"></span>' +
        '<span class="nm">' + U.esc(Roles.nameOf(r)) + '</span>' +
        (r.hard ? '<span class="tag-hard">трудная</span>' : '') +
        '</button>';
    }).join('');
    return '<div class="roles-bar" role="tablist" aria-label="Активная роль">' + tabs + '</div>';
  }

  /* Переключатель вида в шагах по ролям, раздел 10 ТЗ. */
  function roleSwitch(sec) {
    return '<div class="row" style="margin:0 0 10px">' +
      '<button class="btn btn-sm" data-act="all-roles" data-sec="' + sec + '">Все роли сразу</button>' +
      '</div>';
  }

  /* Все роли подряд карточками. Удобно, когда добиваешь однотипные поля:
     пять первых фраз пишутся втрое быстрее, чем через переключение роли. */
  function allRolesBox(sit, sec, one) {
    var cards = Roles.sorted(sit.roles).map(function (r) {
      return '<div class="card" style="margin-bottom:12px" data-role-card="' + r.id + '">' +
        '<div class="row" style="margin-bottom:8px"><h3 style="margin:0">' + U.esc(Roles.nameOf(r)) + '</h3>' +
        (r.hard ? '<span class="tag-hard">трудная</span>' : '') + '</div>' +
        one(sit, r) + '</div>';
    }).join('');
    return '<div class="row" style="margin:0 0 10px">' +
      '<button class="btn btn-sm" data-act="all-roles" data-sec="' + sec + '">По одной роли</button>' +
      '<span class="muted">все роли подряд</span></div>' + cards;
  }

  /* Кнопка «взять из роли ...»: копия с последующей правкой, раздел 10 ТЗ.
     Копируется только непустое и только в пустое поле не подставляется само. */
  function copyFrom(sit, roleId, kind) {
    var others = Roles.sorted(sit.roles).filter(function (r) {
      return r.id !== roleId && String(Copy.valueOf(sit, r.id, kind) || '').trim();
    });
    if (!others.length) return '';
    return '<div class="row" style="margin:-8px 0 12px">' + others.map(function (r) {
      return '<button class="btn btn-sm" data-act="copy-role" data-from="' + r.id + '" data-to="' + roleId +
        '" data-kind="' + kind + '">взять из роли «' + U.esc(Roles.nameOf(r)) + '»</button>';
    }).join('') + '</div>';
  }

  function accordion(num, title, open, sec, body, bar) {
    return '<section class="acc' + (open ? ' open' : '') + '" data-sec-box="' + sec + '">' +
      '<button class="acc-h" data-act="acc" data-sec="' + sec + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="acc-num">' + num + '</span>' +
      '<span class="acc-t">' + U.esc(title) + '</span>' +
      (bar || '') +
      '<span class="chev">' + Icons('chev', 18) + '</span>' +
      '</button>' +
      (open ? '<div class="acc-b">' + body + '</div>' : '') +
      '</section>';
  }

  function setupBody(sit) {
    var rolesHtml = sit.roles.map(function (r, i) {
      var canDel = sit.roles.length > C.ROLES_MIN;
      return '<div class="role-row">' +
        '<div class="role-head">' +
        '<div class="ord">' +
        '<button class="btn btn-sm btn-icon" data-act="move-role" data-id="' + r.id + '" data-dir="up" title="Выше" aria-label="Выше"' + (i === 0 ? ' disabled' : '') + '>' + Icons('up', 14) + '</button>' +
        '<button class="btn btn-sm btn-icon" data-act="move-role" data-id="' + r.id + '" data-dir="down" title="Ниже" aria-label="Ниже"' + (i === sit.roles.length - 1 ? ' disabled' : '') + '>' + Icons('down', 14) + '</button>' +
        '</div>' +
        '<input type="text" data-field="roles.' + i + '.name" value="' + U.esc(r.name) + '" placeholder="Название роли" aria-label="Название роли">' +
        '<input type="text" class="short" data-field="roles.' + i + '.short" data-max="' + C.SHORT_MAX + '" maxlength="' + C.SHORT_MAX + '" value="' + U.esc(r.short) + '" placeholder="метка" aria-label="Короткая метка">' +
        '<button class="btn btn-ghost btn-icon" data-act="del-role" data-id="' + r.id + '" title="Удалить роль" aria-label="Удалить роль"' + (canDel ? '' : ' disabled') + '>' + Icons('trash') + '</button>' +
        '</div>' +
        '<div style="margin-top:8px">' +
        '<textarea rows="2" data-field="roles.' + i + '.interest" placeholder="Интересы роли">' + U.esc(r.interest) + '</textarea>' +
        '</div>' +
        '<div style="margin-top:8px">' +
        '<label class="chk' + (r.hard ? ' on' : '') + '"><input type="checkbox" data-check="hard" data-i="' + i + '"' + (r.hard ? ' checked' : '') + '>' +
        'трудная роль</label>' +
        '</div>' +
        '</div>';
    }).join('');

    return field('Название ситуации', '', '<input type="text" data-field="title" value="' + U.esc(sit.title) + '" placeholder="' + C.TITLE_DEFAULT + '">') +
      field('Турнир и дата', 'Например: турнир «Наполеон», 26.07.2026', '<input type="text" data-field="context" value="' + U.esc(sit.context) + '" placeholder="Не заполнено">') +
      field('Текст ситуации', 'Вставьте текст целиком, вместе с блоком ролей',
        '<textarea rows="8" data-field="sourceText" placeholder="Вставьте сюда текст ситуации">' + U.esc(sit.sourceText) + '</textarea>') +
      '<div class="row" style="margin:-6px 0 18px">' +
      '<button class="btn btn-sm" data-act="parse-roles">' + Icons('wand', 16) + 'Разобрать роли из текста</button>' +
      '</div>' +
      '<div class="sep"></div>' +
      '<div class="row" style="margin-bottom:10px"><h3>Роли</h3><span class="spacer"></span>' +
      '<span class="muted">' + sit.roles.length + ' из ' + C.ROLES_MAX + '</span></div>' +
      '<div class="hint">Готовиться нужно ко всем ролям: соперник вправе назначить любую. Отметка «трудная» ставит роль первой в шагах 3 и 8.</div>' +
      rolesHtml +
      '<div class="row"><button class="btn" data-act="add-role"' + (sit.roles.length >= C.ROLES_MAX ? ' disabled' : '') + '>' +
      Icons('plus') + 'Добавить роль</button></div>';
  }

  function step1Body(sit, express) {
    var s1 = sit.step1;
    var ret = '';
    for (var i = 0; i < C.RETELL_COUNT; i++) {
      ret += '<div class="field">' +
        '<span class="label">Предложение ' + (i + 1) + '</span>' +
        textarea({ id: 'rt' + i, path: 'step1.retell.' + i, value: s1.retell[i], rows: 2, max: C.RETELL_MAX }) +
        '</div>';
    }
    return '<details class="det"><summary>Что такое фабула, сюжет и суть</summary><div class="det-b">' +
      '<p><b>Фабула</b> («что произошло» как набор фактов по времени): кто что сделал и когда, без режиссуры рассказа. Отвечает на вопрос «что было дальше?».</p>' +
      '<p><b>Сюжет</b> («как это рассказывают или организуют»): последовательность и связь описания событий, обычно с причинно-следственными переходами и акцентами. Отвечает на вопрос «как и почему это подано именно так?».</p>' +
      '<p><b>Суть</b> («в чем главный смысл, конфликт или проблема»): смысловое ядро, главный конфликт, интересы сторон, ключевая проблема и критерий, по которому ситуация будет оценена. Часто формируется одной фразой: «это спор о...», «это история про...», «центральный вопрос: ...».</p>' +
      '</div></details>' +
      (express ? '' :
        field('Фабула', '', '<textarea rows="4" data-field="step1.fabula" placeholder="Кто что сделал и когда">' + U.esc(s1.fabula) + '</textarea>') +
        field('Сюжет', '', '<textarea rows="4" data-field="step1.plot" placeholder="Как и почему это подано именно так">' + U.esc(s1.plot) + '</textarea>')) +
      field('Суть', '', '<textarea rows="3" data-field="step1.essence" placeholder="Это спор о...">' + U.esc(s1.essence) + '</textarea>', 'step1.essence') +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Пересказ в трех предложениях</h3>' +
      '<div class="hint">По ' + C.RETELL_MAX + ' символов на предложение.</div>' +
      ret +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Пересказать из любого места</h3>' +
      '<div class="hint">Шаблон требует уметь пересказать ситуацию не только целиком. Кнопка достает случайное предложение текста, дальше вы продолжаете вслух. Приложение ничего не оценивает и не записывает.</div>' +
      (SELF ? '<div class="self-box"><b>Продолжите отсюда:</b><div class="q" style="margin-top:6px">' +
        U.esc(SELF) + '</div></div>' : '') +
      '<div class="row"><button class="btn" data-act="self-check">' + Icons('wand', 18) +
      (SELF ? 'Другое место' : 'Проверить себя') + '</button>' +
      (SELF ? '<button class="btn btn-ghost" data-act="self-hide">Убрать</button>' : '') +
      '</div>';
  }

  /* ---- шаг 2 ---- */

  /* Подсветка разобранных кусков прямо в тексте ситуации.
     Ищем первое незанятое вхождение цитаты: так видно, чего вы не трогали. */
  function markSource(text, phrases) {
    var t = String(text || '');
    var used = [], missing = {};
    phrases.forEach(function (p, i) {
      var q = String(p.quote || '').trim();
      if (!q) { missing[p.id] = true; return; }
      var from = 0, pos = -1;
      while (true) {
        pos = t.indexOf(q, from);
        if (pos < 0) break;
        var end = pos + q.length;
        var busy = used.some(function (r) { return pos < r.end && end > r.start; });
        if (!busy) break;
        from = pos + 1;
      }
      if (pos < 0) { missing[p.id] = true; return; }
      used.push({ start: pos, end: pos + q.length, n: i + 1 });
    });
    used.sort(function (a, b) { return a.start - b.start; });
    var html = '', at = 0;
    used.forEach(function (r) {
      html += U.esc(t.slice(at, r.start));
      // номер рисуется средствами стиля: иначе он попадал бы в выделение мышью
      html += '<mark class="q" data-n="' + r.n + '">' + U.esc(t.slice(r.start, r.end)) + '</mark>';
      at = r.end;
    });
    html += U.esc(t.slice(at));
    return { html: html || '<span class="muted">Текст ситуации пуст. Вставьте его в разделе «Текст и роли».</span>', missing: missing };
  }

  /* Слои фразы не нажимаются: они показывают, в каких оптиках у нее
     уже есть толкование. Выбор слоя живет у трактовки. */
  function layerTags(layers) {
    if (!layers.length) {
      return '<div class="muted">Ни одной. Слой появится, когда у трактовки будет выбран слой.</div>';
    }
    return '<div class="chips">' + layers.map(function (id) {
      var l = C.LAYERS.filter(function (x) { return x.id === id; })[0];
      return '<span class="chip on" title="' + U.esc(l.about) + '">' + U.esc(l.name) + '</span>';
    }).join('') + '</div>';
  }

  function layerSelect(path, value) {
    var opts = '<option value="">слой не выбран</option>' + C.LAYERS.map(function (l) {
      return '<option value="' + l.id + '"' + (value === l.id ? ' selected' : '') + '>' + U.esc(l.name) + '</option>';
    }).join('');
    return '<select class="lsel" data-sel="' + path + '">' + opts + '</select>';
  }

  function step2Body(sit, tab, layerId, phraseIdx) {
    var s2 = sit.step2;
    var src = markSource(sit.sourceText, s2.phrases);

    var head =
      '<details class="det"' + (tab !== 'pass' && tab !== 'one' ? ' open' : '') + '><summary>Текст ситуации</summary><div class="det-b">' +
      '<div class="src" id="src-text">' + src.html + '</div>' +
      '<div class="hint" style="margin-top:10px">Выделите кусок текста: кнопка «В разбор» появится прямо у выделения. Разобранное подсвечивается и нумеруется.</div>' +
      '<div class="selhint" id="sel-hint"></div>' +
      '<div class="row">' +
      '<button class="btn btn-sm" data-act="to-analysis">' + Icons('plus', 16) + 'В разбор</button>' +
      '<button class="btn btn-sm" data-act="add-phrase">Добавить фразу вручную</button>' +
      '<button class="btn btn-sm" data-act="slice-text">Нарезать текст на фразы</button>' +
      '</div></div></details>' +
      '<button class="selbtn" id="sel-btn" data-act="to-analysis">' + Icons('plus', 18) + 'В разбор</button>' +
      '<div class="tabs">' +
      '<button class="tab' + (tab === 'pass' ? ' on' : '') + '" data-act="s2tab" data-tab="pass">Прогон по слоям</button>' +
      '<button class="tab' + (tab === 'one' ? ' on' : '') + '" data-act="s2tab" data-tab="one">Разбор фразы</button>' +
      '<button class="tab' + (tab === 'phrases' ? ' on' : '') + '" data-act="s2tab" data-tab="phrases">Фразы (' + s2.phrases.length + ')</button>' +
      '<button class="tab' + (tab === 'matrix' ? ' on' : '') + '" data-act="s2tab" data-tab="matrix">Матрица</button>' +
      '</div>';

    if (tab === 'pass') return head + step2Pass(s2, layerId);
    if (tab === 'one') return head + step2One(s2, phraseIdx);
    if (tab === 'matrix') return head + step2Matrix(s2);

    if (!s2.phrases.length) {
      return head + '<div class="empty">Ни одной фразы пока не разобрано.<br>Нажмите «Нарезать текст на фразы» или выделите кусок текста выше.</div>';
    }

    var body = s2.phrases.map(function (p, i) {
      var base = 'step2.phrases.' + i;
      var readings = p.readings.map(function (r, j) {
        var rb = base + '.readings.' + j;
        return '<div class="reading">' +
          '<div class="row" style="margin-bottom:6px">' + layerSelect(rb + '.layer', r.layer) + '</div>' +
          '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
          '<textarea rows="2" data-field="' + rb + '.text" placeholder="Как фраза читается в этом слое">' + U.esc(r.text) + '</textarea>' +
          '<button class="btn btn-ghost btn-icon' + (r.starred ? ' starred' : '') + '" data-act="star" data-i="' + i + '" data-j="' + j +
          '" title="Отметить главной" aria-label="Отметить главной">' + Icons(r.starred ? 'star_on' : 'star') + '</button>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-reading" data-i="' + i + '" data-j="' + j +
          '" title="Удалить трактовку" aria-label="Удалить трактовку">' + Icons('trash') + '</button>' +
          '</div>' +
          '<textarea rows="2" data-field="' + rb + '.use" placeholder="Что это дает в переговорах">' + U.esc(r.use) + '</textarea>' +
          '</div>';
      }).join('');

      return '<div class="card phrase">' +
        '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
        '<span class="pnum">' + (i + 1) + '</span>' +
        '<textarea rows="2" data-field="' + base + '.quote" placeholder="Фрагмент текста ситуации">' + U.esc(p.quote) + '</textarea>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-phrase" data-i="' + i + '" title="Удалить фразу" aria-label="Удалить фразу">' + Icons('trash') + '</button>' +
        '</div>' +
        (src.missing[p.id] ? '<div class="asm-warn">' + Icons('alert', 15) + 'Этого куска в тексте ситуации нет: текст правили после разбора</div>' : '') +
        (Express.on() ? '' :
          '<div class="field" style="margin-top:12px"><span class="label">Зачем эта фраза в тексте</span>' +
          '<textarea rows="2" data-field="' + base + '.purpose" placeholder="Смысл и причина существования фразы">' + U.esc(p.purpose) + '</textarea></div>') +
        '<div class="label">Трактовки</div>' +
        '<div class="hint">Одна и та же фраза в разных слоях читается по-разному. У каждой трактовки свой слой.</div>' +
        (readings || '<div class="muted" style="margin-bottom:8px">Ни одной трактовки. Их полезно иметь хотя бы две.</div>') +
        '<div class="row"><button class="btn btn-sm" data-act="add-reading" data-i="' + i + '">' + Icons('plus', 16) + 'Добавить трактовку</button></div>' +
        '<div class="label" style="margin-top:14px">Задействованные слои</div>' +
        layerTags(p.layers) +
        '</div>';
    }).join('');

    return head + body +
      '<div class="row"><button class="btn" data-act="add-phrase">' + Icons('plus') + 'Добавить фразу</button></div>';
  }

  /* ---- прогон по слоям: главный режим шага 2 ----
     Методика: весь текст прогоняется фраза за фразой сначала в одном слое,
     потом в следующем, и в каждой фразе разбираются значения слов в этом слое. */
  function step2Pass(s2, layerId) {
    if (!s2.phrases.length) {
      return '<div class="empty">Сначала нарежьте текст на фразы кнопкой выше:<br>прогон идет по всем фразам подряд.</div>';
    }
    var layer = C.LAYERS.filter(function (l) { return l.id === layerId; })[0] || C.LAYERS[0];

    // лента слоев с прогрессом прохода
    var tabsHtml = '<div class="roles-bar">' + C.LAYERS.map(function (l) {
      var done = s2.phrases.filter(function (p) { return Schema.passedInLayer(p, l.id); }).length;
      var full = done === s2.phrases.length;
      return '<button class="role-tab' + (l.id === layer.id ? ' on' : '') + '" data-act="s2layer" data-id="' + l.id + '">' +
        '<span class="dot' + (full ? ' filled' : '') + '"></span>' +
        '<span class="nm">' + U.esc(l.name) + '</span>' +
        '<span class="muted" style="font-size:11px">' + done + '/' + s2.phrases.length + '</span>' +
        '</button>';
    }).join('') + '</div>';

    var cards = s2.phrases.map(function (p, i) {
      var base = 'step2.phrases.' + i;
      // трактовка фразы в текущем слое
      var rIdx = -1;
      p.readings.forEach(function (r, k) { if (rIdx < 0 && r.layer === layer.id) rIdx = k; });
      var rd = rIdx >= 0 ? p.readings[rIdx] : null;
      var silent = (p.silent || []).indexOf(layer.id) >= 0;
      var passed = Schema.passedInLayer(p, layer.id);

      // слова фразы, подсвечены те, у которых есть значение в этом слое
      var chips = Schema.wordsOf(p.quote).map(function (w) {
        var has = p.wordMeanings.some(function (m) {
