/* ---------------------------------------------------------------------
   12. Приложение: состояние экрана, события, действия
   --------------------------------------------------------------------- */
var App = (function () {
  var root = null;
  var view = {
    screen: 'list', sitId: null, roleId: null, open: 'setup',
    s2tab: 'pass', s2layer: 'tech', s2phrase: 0,
    s6mine: null, s6theirs: null, s5view: 'list', round: 0, allRoles: false,
    selfCheck: '',
    rehRole: null, rehRound: 0, rehPanel: '', rehQuestion: null,
    reh: { total: 0, startedAt: 0, elapsed: 0, running: false },
    history: [], snaps: [],
    libType: 'all', libQuery: '', libSort: 'recent'
  };
  var mount = null;
  var lastSelection = '';   // кусок текста ситуации, выделенный пользователем

  /* ---------- отрисовка ---------- */

  function render() {
    var state = Storage.saveState();
    mount.innerHTML = (view.screen === 'rehearsal') ? View.rehearsal(root, state, view)
      : (view.screen === 'situation') ? View.situation(root, state, view)
        : (view.screen === 'ready') ? View.ready(root, state, view)
          : (view.screen === 'library') ? View.library(root, state, view)
            : (view.screen === 'trash') ? View.trash(root, state)
              : (view.screen === 'history') ? View.history(root, state, view)
                : (view.screen === 'after') ? View.after(root, state, view)
                  : View.list(root, state);
    growAll();
  }

  function growAll() {
    var list = mount.querySelectorAll('textarea');
    for (var i = 0; i < list.length; i++) grow(list[i]);
  }
  function grow(t) {
    if (!t || t.tagName !== 'TEXTAREA') return;
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  }

  function updateSaveIndicator(state) {
    var n = document.getElementById('save-ind');
    if (!n) return;
    var txt = state === 'saving' ? 'Сохранение' : (state === 'dirty' ? 'Не сохранено' : 'Сохранено');
    n.className = 'save ' + state;
    n.setAttribute('title', txt);
    var t = n.querySelector('.t');
    if (t) t.textContent = txt;
  }

  function updateCloudIndicator(state) {
    var n = document.getElementById('cloud-ind');
    if (!n) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = View.cloudBtn(state);
    n.parentNode.replaceChild(tmp.firstChild, n);
  }

  function updateCounter(input) {
    var id = input.id;
    if (!id) return;
    var c = mount.querySelector('[data-counter-for="' + id + '"]');
    if (!c) return;
    var max = Number(c.getAttribute('data-max')) || 0;
    var len = U.len(input.value);
    var cls = 'counter';
    if (len >= max) cls += ' full';
    else if (max === C.PHRASE_MAX && len > C.PHRASE_WARN) cls += ' warn';
    c.className = cls;
    var html = '<span>' + len + ' из ' + max + '</span>';
    if (c.getAttribute('data-time')) html += '<span>около ' + U.seconds(len) + ' с речи</span>';
    c.innerHTML = html;
  }

  function sit() { return Storage.getSituation(view.sitId); }

  /* Часы репетиции. Время считается по системным часам, а не сложением
     тиков: вкладка в фоне тикает как попало, а раунд должен кончиться
     вовремя. Тик только перерисовывает цифры и решает, пора ли сигналить. */
  var rehTimer = null;
  var rehLast = -1;
  var wakeLock = null;

  function rehTick() {
    if (view.screen !== 'rehearsal') { rehStop(); return; }
    var left = Rehearsal.left(view.reh, U.now());
    var box = document.getElementById('reh-clock');
    if (box) {
      box.textContent = Rehearsal.clock(left);
      box.className = 'clock' + (left === 0 ? ' over' : (left <= C.WARN_SECONDS ? ' warn' : ''));
    }
    if (rehLast >= 0) {
      var sig = Rehearsal.signalAt(rehLast, left);
      if (sig) Sound.play(sig);
    }
    rehLast = left;
    if (left === 0 && view.reh.running) {
      view.reh.running = false;
      view.reh.elapsed = view.reh.total * 1000;
      rehStop();
      render();
    }
  }

  function rehStart() {
    rehStop();
    rehLast = Rehearsal.left(view.reh, U.now());
    rehTimer = setInterval(rehTick, C.TICK_MS);
  }
  function rehStop() {
    if (rehTimer) { clearInterval(rehTimer); rehTimer = null; }
  }

  /* Экран не должен гаснуть посреди раунда. При отказе молча продолжаем. */
  function keepAwake(on) {
    try {
      if (on) {
        if (navigator.wakeLock && navigator.wakeLock.request && !wakeLock) {
          navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {});
        }
      } else if (wakeLock) {
        try { wakeLock.release(); } catch (e) {}
        wakeLock = null;
      }
    } catch (e) { /* поддержки нет - работаем без нее */ }
  }

  /* Копилка: список перерисовывается отдельно от экрана, иначе
     поле поиска теряло бы курсор на каждой букве. */
  function renderLibList() {
    var box = document.getElementById('lib-list');
    if (!box) { render(); return; }
    box.innerHTML = View.libList(root, view);
    var chips = mount.querySelectorAll('[data-act="lib-type"]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('on', chips[i].getAttribute('data-id') === (view.libType || 'all'));
    }
    growAll();
  }

  /* Узлы дерева последствий лежат плоским списком, а адресуются по id:
     номер в списке меняется при удалении веток. */
  function nodeIndex(s, id) {
    Schema.ensureStep5(s);
    var nodes = s.step5.consequences.nodes;
    for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return i;
    return -1;
  }

  /* Шаг 4: те же два уровня, что в шаге 7. */
  function thPath(level) {
    return level === 'common' ? 'step4.common' : 'step4.byRole.' + level + '.threats';
  }
  function thList(s, level) {
    Schema.ensureStep4(s);
    return level === 'common' ? s.step4.common : Schema.step4ForRole(s, level).threats;
  }

  /* Шаг 7: два уровня в одной разметке, общий и по роли. */
  function fmPath(level) {
    return level === 'common' ? 'step7.common' : 'step7.byRole.' + level + '.formulas';
  }
  function fmList(s, level) {
    Schema.ensureStep7(s);
    return level === 'common' ? s.step7.common : Schema.step7ForRole(s, level).formulas;
  }

  /* Пока роль не выбрана руками, активной считается первая по порядку показа,
     то есть трудная. Как только роль выбрана явно, она держится. */
  function activeRole() {
    var s = sit();
    if (!s) return null;
    var rs = Roles.sorted(s.roles);
    for (var i = 0; i < rs.length; i++) if (rs[i].id === view.roleId) return rs[i];
    return rs[0] || null;
  }

  /* ---------- события ввода ---------- */

  function onInput(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;

    /* Копилка формул: свои поля, ситуации здесь нет */
    var libId = t.getAttribute('data-lib');
    if (libId) {
      var lf = t.getAttribute('data-libfield');
      if (lf === 'tags') Storage.patchFormula(libId, 'tags', Library.parseTags(t.value));
      else if (lf) Storage.patchFormula(libId, lf, t.value);
      if (t.tagName === 'TEXTAREA') grow(t);
      return;
    }
    if (t.getAttribute('data-libq') !== null) {
      view.libQuery = t.value;
      renderLibList();
      return;
    }

    /* Первый ввод трактовки в прогоне: записи для этого слоя еще нет,
       создаем ее и дальше поле работает как обычное. */
    if (t.getAttribute('data-pass') !== null && view.sitId) {
      var pi = Number(t.getAttribute('data-pass'));
      var kind = t.getAttribute('data-pass-kind') || 'text';
      var ps = sit();
      var pp = ps && ps.step2.phrases[pi];
      if (!pp) return;
      var ri = -1;
      pp.readings.forEach(function (r, k) { if (ri < 0 && r.layer === view.s2layer) ri = k; });
      if (ri < 0) {
        Storage.patch(ps.id, 'step2.phrases.' + pi + '.readings', pp.readings.concat([Schema.newReading(view.s2layer)]));
        ri = pp.readings.length - 1;
      }
      var fpath = 'step2.phrases.' + pi + '.readings.' + ri + '.' + kind;
      t.removeAttribute('data-pass');
      t.removeAttribute('data-pass-kind');
      t.setAttribute('data-field', fpath);
      // дальше проваливаемся в обычную обработку
    }

    var path = t.getAttribute('data-field');
    if (!path || !view.sitId) return;

    var max = Number(t.getAttribute('data-max')) || 0;
    var v = t.value;
    if (max && U.len(v) > max) {
      var pos = t.selectionStart;
      v = U.cut(v, max);
      t.value = v;
      try { t.setSelectionRange(Math.min(pos, v.length), Math.min(pos, v.length)); } catch (err) {}
    }
    Storage.patch(view.sitId, path, v);
    refreshLights();
    if (t.tagName === 'TEXTAREA') grow(t);
    if (max) updateCounter(t);
    if (path === 'title') {
      var h = document.getElementById('sit-title');
      if (h) h.textContent = v || C.TITLE_DEFAULT;
    }
    // производные отметки слоев пересчитываются при любой правке содержимого фразы
    var pm = path.match(/^step2\.phrases\.(\d+)\./);
    if (pm) {
      var ph = U.getPath(sit(), 'step2.phrases.' + pm[1]);
      if (ph) Storage.patch(view.sitId, 'step2.phrases.' + pm[1] + '.layers', Schema.layersOf(ph));
    }
    // счетчики шагов 4, 6 и 7 пересчитываются прямо во время набора
    if (path.indexOf('step7.') === 0) refreshStep7Head();
    if (path.indexOf('step4.') === 0) refreshStep4Head();
    if (path.indexOf('step5.consequences.nodes') === 0) refreshStep5Head();
    /* Лента раундов показывает цели и разрывы: она обновляется во время
       набора, иначе разрыв висел бы до следующего нажатия. */
    if (path.indexOf('step9.rounds.') === 0) refreshRibbon();
    if (path.indexOf('secondQuestions.') === 0) refreshQuestionsHead();
    if (path.indexOf('comments.') === 0) refreshCommentsHead();
    // корень схемы это само решение: правка поля видна в дереве сразу
    if (path === 'step5.decision') refreshDecision();
    // правка цитаты меняет подсветку в тексте ситуации, но не трогает поле ввода
    if (/^step2\.phrases\.\d+\.quote$/.test(path)) refreshSource();
    if (path === 'sourceText' && document.getElementById('src-text')) refreshSource();
  }

  /* Светофор считается по всей ситуации, поэтому обновляется при любой
     правке. Перерисовывается только строка точек: поле с курсором цело. */
  /* Баннеры сохранности пересчитываются при загрузке и после выгрузки. */
  function refreshSafety() {
    return Promise.all([
      Storage.readLocal('lastExport'),
      Storage.readLocal('installHintOff')
    ]).then(function (v) {
      View.safe.lastExport = Number(v[0]) || 0;
      View.safe.hintOff = !!v[1];
      View.safe.installHint = Safety.needInstallHint(View.safe.hintOff, window);
      return true;
    }).catch(function () { return false; });
  }

  function refreshLights() {
    var box = document.getElementById('lights');
    var s = sit();
    if (!box || !s) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = View.lights(s);
    box.parentNode.replaceChild(tmp.firstChild, box);
  }

  function refreshRibbon() {
    var s = sit();
    var box = mount.querySelector('.ribbon');
    var head = document.getElementById('s9-head');
    if (!s || !box) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = View.roundRibbon(s, view.round);
    box.parentNode.replaceChild(tmp.firstChild, box);
    if (head) head.innerHTML = View.step9Head(s);
  }

  function refreshQuestionsHead() {
    var s = sit();
    var box = mount.querySelector('[data-q-done]');
    if (!s || !box) return;
    box.textContent = 'вопросов ' + s.secondQuestions.length +
      ', без уверенного ответа ' + Schema.openQuestions(s).length;
    /* Полоса слева у карточки тоже считается на лету: вопрос без текста
       ничем не выделен, с текстом и без уверенного ответа - открыт. */
    s.secondQuestions.forEach(function (q) {
      var card = mount.querySelector('[data-q="' + q.id + '"]');
      if (!card) return;
      var has = !!String(q.text || '').trim();
      card.classList.toggle('open', has && !q.confident);
      card.classList.toggle('ok', has && !!q.confident);
    });
  }

  function refreshCommentsHead() {
    var s = sit();
    var box = mount.querySelector('[data-c-open]');
    if (!s || !box) return;
    box.textContent = 'возражений ' + s.comments.length + ', открытых ' + Comments.open(s).length;
  }

  function refreshStep5Head() {
    var box = document.getElementById('s5-head');
    var s = sit();
    if (!box || !s) return;
    box.innerHTML = View.step5Head(s);
  }

  function refreshDecision() {
    var box = mount.querySelector('.csq-root');
    var s = sit();
    if (!box || !s) return;
    var d = String(s.step5.decision || '').trim();
    box.innerHTML = '<b>Решение:</b> ' + (d ? U.esc(d) : '<span class="muted">не записано, поле выше</span>');
  }

  function refreshStep4Head() {
    var box = document.getElementById('s4-head');
    var s = sit(), role = activeRole();
    if (!box || !s || !role) return;
    box.innerHTML = View.step4Head(s, role.id);
    /* Отметки "блок есть" и "блока нет" тоже считаются на лету */
    Schema.ensureStep4(s);
    var all = (s.step4.common || []).concat(Schema.step4ForRole(s, role.id).threats);
    all.forEach(function (t) {
      var slot = mount.querySelector('[data-thr-st="' + t.id + '"]');
      if (slot) slot.innerHTML = View.threatStatus(s, role.id, t);
    });
  }

  function refreshStep6Head() {
    var box = document.getElementById('s6-head');
    var s = sit();
    if (!box || !s) return;
    box.innerHTML = View.step6Head(s);
  }

  function refreshStep7Head() {
    var box = document.getElementById('s7-head');
    var s = sit(), role = activeRole();
    if (!box || !s || !role) return;
    box.innerHTML = View.step7Head(s, role.id);
    /* Кнопка отправки в копилку появляется, как только у формулы есть текст */
    Schema.ensureStep7(s);
    var all = (s.step7.common || []).concat(Schema.step7ForRole(s, role.id).formulas);
    all.forEach(function (f) {
      var b = mount.querySelector('[data-fm-send="' + f.id + '"]');
      if (b) b.hidden = !String(f.text || '').trim();
    });
  }

  function refreshSource() {
    var box = document.getElementById('src-text');
    var s = sit();
    if (!box || !s) return;
    box.innerHTML = View.markSource(s.sourceText, s.step2.phrases).html;
  }

  function onChange(e) {
    var t = e.target;
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-sel')) { onLayerPick(t); return; }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-libtype')) {
      Storage.patchFormula(t.getAttribute('data-libtype'), 'type', t.value);
      renderLibList();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-lsort')) {
      view.libSort = t.value;
      renderLibList();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-rehrole')) {
      view.rehRole = t.value;
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-rehround')) {
      view.rehRound = Number(t.value) || 0;
      var sR = sit();
      var rr = sR && sR.step9.rounds[view.rehRound];
      if (rr && rr.myRoleId) view.rehRole = rr.myRoleId;   // раунд знает свою роль
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-rehmin')) {
      var mins = Number(t.value) || C.ROUND_MINUTES_DEFAULT;
      Storage.setSetting('roundMinutes', mins);
      view.reh = { total: mins * 60, startedAt: 0, elapsed: 0, running: false };
      rehStop();
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-rcount')) {
      var sr = sit();
      if (!sr) return;
      var want = Number(t.value) || C.ROUNDS_MIN;
      var cur = sr.step9.rounds.length;
      if (want === cur) return;
      if (want > cur) {
        var next = sr.step9.rounds.slice();
        while (next.length < want) next.push(Schema.newRound(next.length + 1));
        Storage.patch(sr.id, 'step9.rounds', next);
        Storage.setSetting('roundsCount', want);
        view.round = Math.min(view.round, want - 1);
        render();
        return;
      }
      /* Убавление раундов выбрасывает содержание последних, поэтому
         спрашиваем, но только если там что-то есть. */
      var lost = sr.step9.rounds.slice(want).filter(function (r) {
        return String(r.goal || '').trim() || String(r.carryOver || '').trim() || String(r.ifFails || '').trim();
      }).length;
      var cutTo = function () {
        Storage.patch(sr.id, 'step9.rounds', sr.step9.rounds.slice(0, want));
        Storage.setSetting('roundsCount', want);
        view.round = Math.min(view.round, want - 1);
        render();
      };
      if (!lost) { cutTo(); return; }
      Modal.confirm('Убрать раунды',
        'Раундов станет ' + want + '. Заполненных раундов при этом пропадет: ' + lost + '.'
      ).then(function (ok) { if (ok) cutTo(); else render(); });
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-rrole')) {
      if (!view.sitId) return;
      Storage.patch(view.sitId, 'step9.rounds.' + Number(t.getAttribute('data-rrole')) + '.myRoleId', t.value);
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-chor')) {
      var sh = sit();
      if (!sh) return;
      var ih = nodeIndex(sh, t.getAttribute('data-chor'));
      if (ih < 0) return;
      Storage.patch(sh.id, 'step5.consequences.nodes.' + ih + '.horizon', t.value);
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-fthreat')) {
      if (!view.sitId) return;
      Storage.patch(view.sitId, t.getAttribute('data-fthreat'), t.value || null);
      render();
      return;
    }
    if (t && t.tagName === 'SELECT' && t.getAttribute('data-ftype')) {
      if (!view.sitId) return;
      Storage.patch(view.sitId, t.getAttribute('data-ftype'), t.value);
      render();
      return;
    }
    if (!t || t.type !== 'checkbox') return;
    var kind = t.getAttribute('data-check');
    if (!kind || !view.sitId) return;
    var i = Number(t.getAttribute('data-i'));
    var lab = t.closest('.chk');
    if (lab) lab.classList.toggle('on', t.checked);

    if (kind === 'hard') {
      Storage.patch(view.sitId, 'roles.' + i + '.hard', t.checked);
      return;
    }
    if (kind === 'resolved') {
      var sc = sit();
      if (!sc) return;
      Storage.patch(sc.id, 'comments.' + Number(t.getAttribute('data-i')) + '.resolved', t.checked);
      render();
      return;
    }
    if (kind === 'confident') {
      var sq = sit();
      if (!sq) return;
      Storage.patch(sq.id, 'secondQuestions.' + Number(t.getAttribute('data-i')) + '.confident', t.checked);
      render();
      return;
    }
    if (kind === 'preempt') {
      var sPre = sit();
      if (!sPre) return;
      var lvl = t.getAttribute('data-level');
      var ip = Number(t.getAttribute('data-i'));
      Storage.patch(sPre.id, thPath(lvl) + '.' + ip + '.preemptive', t.checked);
      refreshStep4Head();
      return;
    }
    if (kind === 'silent') {
      var sp = sit();
      var phr = sp && sp.step2.phrases[i];
      if (!phr) return;
      var list = (phr.silent || []).filter(function (x) { return x !== view.s2layer; });
      if (t.checked) list.push(view.s2layer);
      Storage.patch(sp.id, 'step2.phrases.' + i + '.silent', list);
      render();
      return;
    }
    /* То же самое в своде по фразе, где слой берется у самой отметки */
    if (kind === 'silent1') {
      var so = sit();
      var pho = so && so.step2.phrases[i];
      if (!pho) return;
      var lay1 = t.getAttribute('data-layer');
      var lst = (pho.silent || []).filter(function (x) { return x !== lay1; });
      if (t.checked) lst.push(lay1);
      Storage.patch(so.id, 'step2.phrases.' + i + '.silent', lst);
      render();
      return;
    }
    var role = activeRole();
    if (!role) return;
    Storage.patch(view.sitId, 'step3.byRole.' + role.id + '.assumptions.' + i + '.' + kind, t.checked);
    // подозрительность вводной пересчитывается на месте, без перерисовки
    var box = t.closest('.asm');
    if (box) {
      var a = U.getPath(sit(), 'step3.byRole.' + role.id + '.assumptions.' + i);
      var susp = a && !a.necessary && !a.sufficient;
      box.classList.toggle('susp', !!susp);
      var w = box.querySelector('.asm-warn');
      if (w) w.hidden = !susp;
    }
  }

  /* Выбор слоя у трактовки. Отметки слоев на фразе после этого
     пересчитываются: руками их больше никто не ставит. */
  function onLayerPick(sel) {
    var s = sit();
    if (!s) return;
    var path = sel.getAttribute('data-sel');
    Storage.patch(view.sitId, path, sel.value);
    var m = path.match(/^step2\.phrases\.(\d+)\./);
    if (!m) return;
    var i = Number(m[1]);
    var p = s.step2.phrases[i];
    if (!p) return;
    Storage.patch(view.sitId, 'step2.phrases.' + i + '.layers', Schema.layersOf(p));
    render();
  }

  /* ---------- действия ---------- */

  function onClick(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    e.preventDefault();
    ACT[act] && ACT[act](id, b);
  }

  var ACT = {
    theme: function () {
      var next = Theme.next(root.settings.theme);
      Theme.apply(next);
      Storage.setSetting('theme', next);
      render();
    },

    'new-sit': function () {
      Modal.prompt('Новая ситуация', 'Название', '', 'Создать').then(function (name) {
        if (name === null) return;
        var s = Storage.create(Schema.newSituation(name || C.TITLE_DEFAULT));
        openSituation(s.id);
      });
    },

    'open-sit': function (id) { openSituation(id); },

    'rename-sit': function (id) {
      var s = Storage.getSituation(id);
      if (!s) return;
      Modal.prompt('Переименовать ситуацию', 'Название', s.title).then(function (name) {
        if (name === null) return;
        Storage.patch(id, 'title', name || C.TITLE_DEFAULT);
        render();
      });
    },

    'del-sit': function (id) {
      var s = Storage.getSituation(id);
      if (!s) return;
      Modal.confirm('Удалить ситуацию',
        'Ситуация «' + (s.title || C.TITLE_DEFAULT) + '» уйдет в корзину и будет храниться там ' +
        C.TRASH_DAYS + ' дней. Оттуда ее можно вернуть.'
      ).then(function (ok) {
        if (!ok) return;
        Storage.remove(id);
        Toast.show('Ситуация в корзине');
        render();
      });
    },

    back: function () {
      Storage.flush().catch(function () {});
      view.screen = 'list';
      view.sitId = null;
      render();
    },

    acc: function (_id, b) {
      var sec = b.getAttribute('data-sec');
      view.open = (view.open === sec) ? null : sec;
      render();
    },

    role: function (id) {
      view.roleId = id;
      render();
    },

    'add-role': function () {
      var s = sit();
      if (!s || s.roles.length >= C.ROLES_MAX) return;
      var next = s.roles.slice();
      next.push(Schema.newRole('Роль ' + (next.length + 1), next.length + 1));
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      render();
    },

    'del-role': function (id) {
      var s = sit();
      if (!s || s.roles.length <= C.ROLES_MIN) return;
      var r = null, i;
      for (i = 0; i < s.roles.length; i++) if (s.roles[i].id === id) r = s.roles[i];
      if (!r) return;
      var d3 = s.step3.byRole[id], d8 = s.step8.byRole[id];
      var d4 = Schema.step4ForRole(s, id), d6 = Schema.step6ForRole(s, id), d7 = Schema.step7ForRole(s, id);
      var hasData = !!(d3 && (String(d3.heroVersion || '').trim() || (d3.assumptions || []).length)) ||
        !!(d8 && (String(d8.firstPhrase || '').trim() || String(d8.roleAssignment || '').trim() || String(d8.roundGoal || '').trim())) ||
        d4.threats.length > 0 || d7.formulas.length > 0 || !!String(d6.helpAny || '').trim();
      var text = 'Роль «' + Roles.nameOf(r) + '» будет удалена.' +
        (hasData ? ' Вместе с ней пропадет все, что заполнено по этой роли в шагах 3, 4, 6, 7 и 8, включая ее клетки матрицы соотношений.' : '');
      Modal.confirm('Удалить роль', text).then(function (ok) {
        if (!ok) return;
        var next = s.roles.filter(function (x) { return x.id !== id; });
        Storage.patch(s.id, 'roles', Roles.renumber(next));
        var k;
        var strip = function (obj) {
          var out = {};
          for (var key in obj) if (key !== id) out[key] = obj[key];
          return out;
        };
        Storage.patch(s.id, 'step3.byRole', strip(s.step3.byRole));
        Storage.patch(s.id, 'step8.byRole', strip(s.step8.byRole));
        Storage.patch(s.id, 'step4.byRole', strip(s.step4.byRole));
        Storage.patch(s.id, 'step6.byRole', strip(s.step6.byRole));
        Storage.patch(s.id, 'step7.byRole', strip(s.step7.byRole));
        var cells = {};
        for (k in s.step6.cells) {
          var pair = String(k).split('|');
          if (pair[0] !== id && pair[1] !== id) cells[k] = s.step6.cells[k];
        }
        Storage.patch(s.id, 'step6.cells', cells);
        if (view.s6mine === id || view.s6theirs === id) { view.s6mine = null; view.s6theirs = null; }
        if (view.roleId === id) view.roleId = null;
        render();
      });
    },

    'move-role': function (id, b) {
      var s = sit();
      if (!s) return;
      var dir = b.getAttribute('data-dir') === 'up' ? -1 : 1;
      var next = s.roles.slice();
      var i = next.findIndex(function (x) { return x.id === id; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= next.length) return;
      var tmp = next[i]; next[i] = next[j]; next[j] = tmp;
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      render();
    },

    'parse-roles': function () { parseRoles(); },

    /* ---- шаг 2 ---- */

    s2tab: function (_id, b) {
      var tb = b.getAttribute('data-tab');
      view.s2tab = (tb === 'matrix' || tb === 'phrases' || tb === 'pass' || tb === 'one') ? tb : 'pass';
      render();
    },

    s2layer: function (id) {
      view.s2layer = id;
      view.s2tab = 'pass';
      render();
      window.scrollTo(0, 0);
    },

    /* Свод по одной фразе: все семь слоев сразу */
    s2one: function (_id, b) {
      var s = sit();
      var n = s ? s.step2.phrases.length : 0;
      var i = Number(b.getAttribute('data-i'));
      if (!n || isNaN(i)) return;
      view.s2phrase = Math.min(Math.max(i, 0), n - 1);
      view.s2tab = 'one';
      render();
    },

    /* Трактовка в заданном слое прямо из свода, без переключения прогона */
    'add-reading-l': function (_id, b) {
      var s = sit();
      if (!s) return;
      var i = Number(b.getAttribute('data-i'));
      var lay = b.getAttribute('data-layer');
      var p = s.step2.phrases[i];
      if (!p) return;
      Storage.patch(s.id, 'step2.phrases.' + i + '.readings', p.readings.concat([Schema.newReading(lay)]));
      render();
    },

    /* Из свода в прогон: тот же слой, та же фраза */
    'go-layer': function (_id, b) {
      var i = Number(b.getAttribute('data-i'));
      view.s2layer = b.getAttribute('data-layer');
      view.s2phrase = isNaN(i) ? 0 : i;
      view.s2tab = 'pass';
      render();
      var card = mount.querySelectorAll('.phrase')[view.s2phrase];
      if (card && card.scrollIntoView) { try { card.scrollIntoView(); } catch (e) {} }
    },

    /* Нарезка текста на фразы по предложениям, с подтверждением */
    'slice-text': function () {
      var s = sit();
      if (!s) return;
      var sents = Schema.sentences(s.sourceText);
      if (!sents.length) {
        Toast.show('Текст ситуации пуст, резать нечего');
        return;
      }
      var existing = {};
      s.step2.phrases.forEach(function (p) { existing[String(p.quote || '').trim()] = 1; });
      var fresh = sents.filter(function (x) { return !existing[x]; });
      if (!fresh.length) {
        Toast.show('Все предложения уже в разборе');
        return;
      }
      var rows = fresh.map(function (x, k) {
        return '<label class="chk" style="display:flex;margin-bottom:6px;text-align:left">' +

      Schema.ensureStep5(s);
      var nodes = s.step5.consequences.nodes;
      var parent = id || null;
      if (parent) {
        var pn = nodes.filter(function (x) { return x.id === parent; })[0];
        if (!pn || !Schema.canBranch(nodes, pn)) return;
      } else if (Schema.childrenOf(nodes, null).length >= C.TREE_KIDS_MAX) {
        return;
      }
      /* Умолчание минус: разбор последствий делается ради того,
         чего вы не хотите, а приятное вспоминается само. */
      var nd = Schema.newConsequence(parent, 'minus');
      Storage.patch(s.id, 'step5.consequences.nodes', nodes.concat([nd]));
      view.s5view = 'list';
      render();
      var box = mount.querySelector('[data-csq="' + nd.id + '"] textarea');
      if (box) box.focus();
    },

      var s = sit();
      if (!s) return;
      Schema.ensureStep5(s);
      var nodes = s.step5.consequences.nodes;
      var nd = nodes.filter(function (x) { return x.id === id; })[0];
      if (!nd) return;
      var ids = Schema.subtreeIds(nodes, id);
      var drop = function () {
        Storage.patch(s.id, 'step5.consequences.nodes',
          nodes.filter(function (x) { return ids.indexOf(x.id) < 0; }));
        render();
      };
      var text = String(nd.text || '').trim();
      if (!text && ids.length === 1) { drop(); return; }
      Modal.confirm('Удалить последствие',
        'Последствие' + (text ? ' «' + U.cut(text, 80) + (U.len(text) > 80 ? '...' : '') + '»' : '') +
        ' будет удалено' + (ids.length > 1 ? ' вместе со всем, что из него следует (' + (ids.length - 1) + ')' : '') + '.'
      ).then(function (ok) { if (ok) drop(); });
    },

      if (!view.rehRole) {
        var r0 = activeRole();
        view.rehRole = r0 ? r0.id : null;
      }
      /* Звук разблокируется здесь: это касание, а без касания айфон
         играть потом не даст. Пункт 14.2 ТЗ. */
      Sound.unlock();
      rehStop();
      render();
      window.scrollTo(0, 0);
    },

    'reh-exit': function () {
      rehStop();
      keepAwake(false);
      view.reh.running = false;
      view.screen = 'situation';
      render();
    },

    'reh-run': function () {
      Sound.unlock();
      if (view.reh.running) {
        view.reh.elapsed += Math.max(0, U.now() - view.reh.startedAt);
        view.reh.running = false;
        rehStop();
        keepAwake(false);
      } else {
        if (Rehearsal.left(view.reh, U.now()) === 0) view.reh.elapsed = 0;
        view.reh.startedAt = U.now();
        view.reh.running = true;
        rehStart();
        keepAwake(true);
      }
      render();
    },

    'reh-reset': function () {
      view.reh.running = false;
      view.reh.elapsed = 0;
      view.reh.startedAt = 0;
      rehStop();
      keepAwake(false);
      rehLast = -1;
      render();
    },

    'reh-panel': function (_id, b) {
      var p = b.getAttribute('data-p') || '';
      view.rehPanel = (view.rehPanel === p) ? '' : p;
      if (view.rehPanel === 'question') {
        var s = sit();
        view.rehQuestion = s ? Rehearsal.randomQuestion(s) : null;
      }
      render();
    },

    'reh-question': function () {
      var s = sit();
      if (!s) return;
      var next = Rehearsal.randomQuestion(s);
      var list = (s.secondQuestions || []).filter(function (q) { return String(q.text || '').trim(); });
      /* Второй раз подряд один и тот же вопрос это не проверка себя */
      if (list.length > 1 && view.rehQuestion && next && next.id === view.rehQuestion.id) {
        next = Rehearsal.randomQuestion(s);
        if (next.id === view.rehQuestion.id) {
          var others = list.filter(function (q) { return q.id !== view.rehQuestion.id; });
          next = others[Math.floor(Math.random() * others.length)];
        }
      }
      view.rehQuestion = next;
      render();
    },

    /* ---- самопроверка пересказа, раздел 5.2 ТЗ ---- */

    'self-check': function () {
      var s = sit();
      if (!s) return;
      var sent = Rehearsal.randomSentence(s);
      if (!sent) {
        Toast.show('Текст ситуации пуст: пересказывать нечего');
        return;
      }
      /* Второе нажатие должно дать другое место, иначе проверки нет */
      if (view.selfCheck && sent === view.selfCheck) {
        var all = Schema.sentences(s.sourceText).filter(function (x) { return x !== view.selfCheck; });
        if (all.length) sent = all[Math.floor(Math.random() * all.length)];
      }
      view.selfCheck = sent;
      render();
    },

    'self-hide': function () {
      view.selfCheck = '';
      render();
    },

    /* ---- светофор, «Готов?», режимы ---- */

    light: function (_id, b) {
      var sec = b.getAttribute('data-sec');
      if (view.screen !== 'situation') { view.screen = 'situation'; }
      view.open = sec;
      render();
      var box = mount.querySelector('[data-sec-box="' + sec + '"]');
      if (box && box.scrollIntoView) { try { box.scrollIntoView(); } catch (e) {} }
    },

    ready: function () {
      Storage.flush().catch(function () {});
      view.screen = 'ready';
      render();
      window.scrollTo(0, 0);
    },

    'back-sit': function () {
      view.screen = 'situation';
      render();
      window.scrollTo(0, 0);
    },

    'go-step': function (_id, b) {
      view.screen = 'situation';
      view.open = b.getAttribute('data-sec');
      render();
      var box = mount.querySelector('[data-sec-box="' + view.open + '"]');
      if (box && box.scrollIntoView) { try { box.scrollIntoView(); } catch (e) {} }
    },

    express: function () {
      var next = !root.settings.expressMode;
      Storage.setSetting('expressMode', next);
      Express.set(next);
      Toast.show(next
        ? 'Экспресс-режим: видны только поля, которые считает светофор'
        : 'Экспресс-режим выключен, поля вернулись');
      render();
    },

    'all-roles': function (_id, b) {
      view.allRoles = !view.allRoles;
      view.open = b.getAttribute('data-sec');
      render();
    },

    'copy-role': function (_id, b) {
      var s = sit();
      if (!s) return;
      var from = b.getAttribute('data-from'), to = b.getAttribute('data-to'), kind = b.getAttribute('data-kind');
      var value = Copy.valueOf(s, from, kind);
      if (!String(value || '').trim()) return;
      var target = Copy.pathOf(to, kind);
      var cur = String(U.getPath(s, target) || '').trim();
      var put = function () {
        Storage.patch(s.id, target, value);
        Toast.show('Скопировано, правьте свободно');
        render();
      };
      if (!cur) { put(); return; }
      /* Копия затирает написанное, поэтому спрашиваем: скопированное
         правится свободно, но потерять свое из-за одного нажатия нельзя. */
      var fromName = '';
      s.roles.forEach(function (r) { if (r.id === from) fromName = Roles.nameOf(r); });
      Modal.confirm('Взять из другой роли',
        'Поле «' + Copy.nameOf(kind) + '» уже заполнено. Текст из роли «' + fromName + '» его заменит.',
        'Заменить').then(function (ok) { if (ok) put(); });
    },

    /* ---- разбор после поединка, раздел 5.8 ТЗ ---- */

    after: function () {
      var s = sit();
      if (!s) return;
      Storage.flush().catch(function () {});
      view.screen = 'after';
      render();
      window.scrollTo(0, 0);
    },

    outcome: function (id, b) {
      var s = sit();
      if (!s) return;
      var want = b.getAttribute('data-v');
      var found = null;
      var scan = function (list, path) {
        (list || []).forEach(function (f, i) {
          if (f.id === id) found = { f: f, path: path + '.' + i };
        });
      };
      Schema.ensureStep7(s);
      scan(s.step7.common, 'step7.common');
      s.roles.forEach(function (r) {
        scan(Schema.step7ForRole(s, r.id).formulas, 'step7.byRole.' + r.id + '.formulas');
      });
      if (!found) return;
      var prev = found.f.outcome || '';
      var next = (prev === want) ? '' : want;   // повторное нажатие снимает отметку
      Storage.patch(s.id, found.path + '.outcome', next);

      /* Счет уходит заготовке в копилку. Снятие отметки счет возвращает:
         иначе одно случайное нажатие навсегда портило бы статистику. */
      if (found.f.originId) {
        var lib = Storage.getFormula(found.f.originId);
        if (lib) {
          var d = { worked: 0, failed: 0 };
          if (prev) d[prev] -= 1;
          if (next) d[next] += 1;
          if (d.worked) Storage.patchFormula(lib.id, 'worked', Math.max(0, (lib.worked || 0) + d.worked));
          if (d.failed) Storage.patchFormula(lib.id, 'failed', Math.max(0, (lib.failed || 0) + d.failed));
        }
      }
      render();
    },

    reload: function () {
      try { window.location.reload(); } catch (e) {}
    },

    'hint-off': function () {
      View.safe.installHint = false;
      Storage.writeLocal('installHintOff', 1).catch(function () {});
      render();
    },

    /* ---- корзина, раздел 11 ТЗ ---- */

    trash: function () {
      view.screen = 'trash';
      render();
      window.scrollTo(0, 0);
    },

    restore: function (id) {
      Storage.restore(id);
      Toast.show('Ситуация возвращена');
      /* Опустевшая корзина - не экран, на котором стоит держать: уводим к списку */
      if (!Trash.inTrash(root.situations).length) view.screen = 'list';
      render();
    },

    purge: function (id) {
      var s = Storage.getSituation(id);
      if (!s) return;
      Modal.confirm('Стереть насовсем',
        'Ситуация «' + (s.title || C.TITLE_DEFAULT) + '» будет стерта окончательно. Вернуть ее можно будет только из выгруженного архива.',
        'Стереть').then(function (ok) {
          if (!ok) return;
          Storage.purge(id);
          Toast.show('Стерто');
          render();
        });
    },

    'trash-empty': function () {
      var list = Trash.inTrash(root.situations);
      if (!list.length) return;
      Modal.confirm('Очистить корзину',
        'Из корзины будет стерто ситуаций: ' + list.length + '. Окончательно.',
        'Очистить').then(function (ok) {
          if (!ok) return;
          list.forEach(function (s) { Storage.purge(s.id); });
          Toast.show('Корзина очищена');
          render();
        });
    },

    /* ---- история, раздел 11 ТЗ ---- */

    history: function () {
      var s = sit();
      if (!s) return;
      Storage.flush().catch(function () {}).then(function () {
        return Promise.all([Storage.historyOf(s.id), Storage.snapshotsOf(s.id)]);
      }).then(function (both) {
        view.history = both[0] || [];
        view.snaps = both[1] || [];
        view.screen = 'history';
        render();
        window.scrollTo(0, 0);
      }).catch(function (e) {
        Toast.show('Не удалось прочитать историю: ' + (e.message || e), 'err');
      });
    },

    'snap-restore': function (_id, b) {
      var s = sit();
      if (!s) return;
      var list = (view.snaps || []).slice().sort(function (a, c) { return c.ts - a.ts; });
      var sn = list[Number(b.getAttribute('data-i'))];
      if (!sn) return;
      Modal.confirm('Вернуть состояние целиком',
        'Ситуация вернется к состоянию на ' + U.dateShort(sn.ts) + '. Все, что заполнено после этого, пропадет. ' +
        'Нынешнее состояние тут же станет новым снимком, так что возврат обратим.',
        'Вернуть').then(function (ok) {
          if (!ok) return;
          Storage.restoreSnapshot(s.id, sn.data).then(function (done) {
            if (!done) { Toast.show('Не удалось вернуть состояние', 'err'); return; }
            Toast.show('Состояние возвращено');
            view.screen = 'situation';
            view.roleId = null;
            render();
          });
        });
    },

    undo: function (_id, b) {
      var s = sit();
      if (!s) return;
      var list = (view.history || []).slice().sort(function (a, c) { return c.ts - a.ts; });
      var h = list[Number(b.getAttribute('data-i'))];
      if (!h) return;
      /* Откат сам становится правкой: его тоже можно откатить. */
      Storage.patch(s.id, h.path, h.oldValue);
      Toast.show('Прежнее значение возвращено');
      view.screen = 'situation';
      view.open = Comments.locate(h.path).sec;
      render();
    },

    /* ---- выгрузки, раздел 8 ТЗ ---- */

    'export-sit': function () { exportDialog(); },

    export: function () { doExport(); },
    import: function () { doImport(); },
    cloud: function () { cloudDialog(); }
  };

  /* Выбор формата выгрузки. Раздел 8 ТЗ. */
  function exportDialog() {
    var s = sit();
    if (!s) return;
    Modal.open({
      title: 'Выгрузить подготовку',
      html: '<p class="muted">HTML открывается везде и перетаскивается в Word. RTF правится в Word, Pages и Google Docs. Markdown нужен Obsidian. JSON одной ситуации отдают секунданту.</p>' +
        ['html', 'rtf', 'md', 'json'].map(function (k, i) {
          var name = { html: 'HTML - основной формат', rtf: 'RTF - редактируемый документ', md: 'Markdown', json: 'JSON одной ситуации' }[k];
          return '<label class="chk" style="display:flex;margin-bottom:6px;text-align:left">' +
            '<input type="radio" name="expf" data-exp="' + k + '"' + (i === 0 ? ' checked' : '') + '>' + name + '</label>';
        }).join(''),
      actions: [
        { label: 'Отмена', value: null },
        { label: 'Печать', value: 'print' },
        {
          label: 'Выгрузить', kind: 'btn-primary',
          collect: function (node) {
            var r = node.querySelector('[data-exp]:checked');
            return r ? r.getAttribute('data-exp') : null;
          }
        }
      ]
    }).then(function (kind) {
      if (!kind) return;
      try {
        if (kind === 'print') {
          Report.print(s, root);
          return;
        }
        if (kind === 'html') Archive.saveFile(Report.toHtml(s, root), Report.fileName(s, 'html'), 'text/html;charset=utf-8');
        else if (kind === 'rtf') Archive.saveFile(Report.toRtf(s, root), Report.fileName(s, 'rtf'), 'application/rtf');
        else if (kind === 'md') Archive.saveFile(Report.toMd(s, root), Report.fileName(s, 'md'), 'text/markdown;charset=utf-8');
        else Archive.saveFile(JSON.stringify(s, null, 2), Report.fileName(s, 'json'), 'application/json');
        Toast.show('Выгружено');
      } catch (e) {
        Toast.show('Не удалось выгрузить: ' + (e.message || e), 'err');
      }
    });
  }

  /* Выбор заготовки из копилки. В ситуацию уходит копия текста. */
  function pickFormula(level) {
    var s = sit();
    if (!s) return;
    var lib = Storage.formulas();
    if (!lib.length) {
      Modal.open({
        title: 'Копилка пуста',
        html: '<p class="muted">Копилка наполняется вашими формулами: напишите формулу здесь и нажмите «В копилку». ' +
          'Приложение поставляется с пустой копилкой намеренно - чужие заготовки не работают.</p>',
        actions: [{ label: 'Понятно', kind: 'btn-primary', value: null }]
      });
      return;
    }
    var list = Library.select(lib, { sort: 'used' });
    var rows = list.map(function (f, k) {
      return '<label class="chk" style="display:flex;align-items:flex-start;margin:0 0 8px;text-align:left;border-radius:var(--r)">' +
        '<input type="radio" name="pickf" data-pick="' + k + '"' + (k === 0 ? ' checked' : '') + '>' +
        '<span style="font-size:13px"><b>' + U.esc(Library.typeName(f.type)) + '.</b> ' +
        U.esc(U.cut(String(f.text || ''), 200)) +
        (f.comment ? '<br><span class="muted">' + U.esc(f.comment) + '</span>' : '') +
        ((f.tags || []).length ? '<br><span class="muted">теги: ' + U.esc(f.tags.join(', ')) + '</span>' : '') +
        '</span></label>';
    }).join('');
    Modal.open({
      title: 'Взять из копилки',
      html: '<p class="muted">В ситуацию попадет копия текста. Правьте ее свободно: ни заготовка, ни прошлые подготовки от этого не изменятся.</p>' + rows,
      actions: [
        { label: 'Отмена', value: null },
        {
          label: 'Взять', kind: 'btn-primary',
          collect: function (node) {
            var r = node.querySelector('[data-pick]:checked');
            return r ? Number(r.getAttribute('data-pick')) : null;
          }
        }
      ]
    }).then(function (k) {
      if (k === null || k === undefined || isNaN(k) || !list[k]) return;
      var copy = Library.take(list[k].id, s.id);
      if (!copy) return;
      Storage.patch(s.id, fmPath(level), fmList(s, level).concat([copy]));
      Toast.show('Формула взята из копилки');
      render();
    });
  }

  /* ---------- синхронизация ---------- */

  function useCloudAdapter(on) {
    Storage.useAdapter(on ? makeCloudAdapter(LocalAdapter) : LocalAdapter);
  }

  function cloudDialog() {
    var state = Cloud.state();
    var acts = [{ label: 'Закрыть', value: null }];
    if (!Cloud.connected()) {
      acts.push({ label: 'Подключить Google Диск', kind: 'btn-primary', value: 'connect' });
    } else if (state === 'needauth') {
      acts.push({ label: 'Отключить', kind: 'btn-danger', value: 'off' });
      acts.push({ label: 'Войти в Google', kind: 'btn-primary', value: 'signin' });
    } else {
      acts.push({ label: 'Отключить', kind: 'btn-danger', value: 'off' });
      acts.push({ label: 'Синхронизировать сейчас', kind: 'btn-primary', value: 'sync' });
    }
    Modal.open({
      title: 'Синхронизация',
      html: View.cloudDialogHtml(root, state),
      actions: acts
    }).then(function (a) {
      if (a === 'connect') {
        return Cloud.connect().then(function () {
          useCloudAdapter(true);
          Toast.show('Диск подключен');
          render();
        }).catch(function (e) {
          Toast.show(e && e.message ? e.message : 'Не удалось подключить Диск', 'err');
        });
      }
      if (a === 'signin') {
        return Cloud.signInAgain().catch(function (e) {
          Toast.show(e && e.message ? e.message : 'Вход не удался', 'err');
        });
      }
      if (a === 'sync') {
        return Cloud.flushNow('manual').then(function (r) {
          if (r === 'ok') Toast.show('Синхронизировано');
          if (r === 'pulled') { Toast.show('Взята версия из облака'); render(); }
        });
      }
      if (a === 'off') {
        return Modal.confirm('Отключить синхронизацию',
          'Приложение перестанет читать и записывать файл на Диске. Сам файл останется на месте, данные на устройстве тоже. Подключить обратно можно в любой момент.',
          'Отключить'
        ).then(function (ok) {
          if (!ok) return;
          return Cloud.disconnect().then(function () {
            useCloudAdapter(false);
            Toast.show('Синхронизация выключена');
            render();
          });
        });
      }
    });
  }

  /* Раздел 9.4 ТЗ: автоматического слияния нет, спрашиваем. */

    return Modal.open({

      ]
    }).then(function (v) { return v || 'cancel'; });

  /* ---------- выделение текста ситуации ---------- */

  var hideTimer = null;

  function onSelection() {
    var box = document.getElementById('src-text');
    if (!box) return;
    var sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed ||
      !sel.anchorNode || !sel.focusNode ||
      !box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) {
      // не стираем запомненное сразу: нажатие на кнопку само снимает выделение
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(hideSelButton, 250);
      return;
    }
    var t = String(sel.toString() || '').replace(/\s+/g, ' ').trim();
    if (!t) return;
    lastSelection = t;
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    showSelButton(sel);
    showSelHint(t);
  }

  function showSelButton(sel) {
    var b = document.getElementById('sel-btn');
    if (!b) return;
    var r;
    try { r = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { return; }
    if (!r || (!r.width && !r.height)) return;
    b.classList.add('show');
    var w = b.offsetWidth || 140, h = b.offsetHeight || 44;
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), vw - w - 8);
    var top = r.bottom + 10;                       // под выделением
    if (top + h > vh - 8) top = Math.max(8, r.top - h - 10);  // не влезло - над ним
    b.style.left = Math.round(left) + 'px';
    b.style.top = Math.round(top) + 'px';
  }

  function hideSelButton() {
    var b = document.getElementById('sel-btn');
    if (b) b.classList.remove('show');
  }

  function showSelHint(t) {
    var n = document.getElementById('sel-hint');
    if (!n) return;
    n.innerHTML = 'Выделено: <b>' + U.esc(U.cut(t, 60)) + (U.len(t) > 60 ? '...' : '') + '</b>';
  }

  function addPhrase(s, quote) {
    var next = s.step2.phrases.concat([Schema.newPhrase(quote)]);
    Storage.patch(s.id, 'step2.phrases', next);
    view.s2tab = 'phrases';
    render();
    var cards = mount.querySelectorAll('.phrase');
    if (cards.length) {
      var card = cards[cards.length - 1];
      if (card.scrollIntoView) { try { card.scrollIntoView({ block: 'center' }); } catch (e) {} }
      var ta = card.querySelector('textarea');
      if (ta && !quote) ta.focus();
    }
    Toast.show(quote ? 'Фраза добавлена в разбор' : 'Пустая фраза добавлена');
  }

  function openSituation(id) {
    var s = Storage.getSituation(id);
    if (!s) return;
    view.screen = 'situation';
    view.sitId = id;
    view.roleId = null; // роль не выбрана: активной будет трудная
    view.s2phrase = 0;  // свод по фразе начинается с первой, а не с чужого номера
    view.s6mine = null; // клетка матрицы соотношений не выбрана
    view.s6theirs = null;
    view.round = 0;     // лента раундов начинается с первого
    view.open = String(s.sourceText || '').trim() ? 's1' : 'setup';
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- разбор ролей из текста ---------- */

  function parseRoles() {
    var s = sit();
    if (!s) return;
    var res = Roles.parse(s.sourceText);
    if (!res.found) {
      Modal.open({
        title: 'Роли в тексте не найдены',
        html: '<p>Приложение ищет строку, которая начинается со слова «Роли», и берет следующие за ней строки. ' +
          'В каждой строке название роли отделяется от интересов тире или двоеточием.</p>' +
          '<p class="muted">Если в вашем тексте блока ролей нет, заполните роли вручную ниже.</p>',
        actions: [{ label: 'Понятно', kind: 'btn-primary', value: null }]
      });
      return;
    }
    var found = res.roles;
    var take = found.slice(0, C.ROLES_MAX);
    var rows = take.map(function (r) {
      return '<div class="role-row"><b>' + U.esc(r.name) + '</b>' +
        (r.interest ? '<div class="muted">' + U.esc(r.interest) + '</div>' : '<div class="muted">интересы не распознаны</div>') +
        '</div>';
    }).join('');

    var warn = '';
    if (found.length > C.ROLES_MAX) {
      warn += '<p class="muted">Найдено ролей: ' + found.length + '. Взять можно не больше ' + C.ROLES_MAX +
        ', остальные придется добавить или поправить вручную.</p>';
    }
    if (take.length < C.ROLES_MIN) {
      warn += '<p class="muted">Ролей меньше ' + C.ROLES_MIN + ', поэтому недостающие будут добавлены пустыми.</p>';
    }
    var hasData = s.roles.some(function (r) {
      var d3 = s.step3.byRole[r.id], d8 = s.step8.byRole[r.id];
      return !!(d3 && (String(d3.heroVersion || '').trim() || (d3.assumptions || []).length)) ||
        !!(d8 && String(d8.firstPhrase || '').trim());
    });
    if (hasData) {
      warn += '<p style="color:var(--warn)"><b>Внимание.</b> По текущим ролям уже что-то заполнено в шагах 3 и 8. ' +
        'Замена ролей это сотрет.</p>';
    }

    Modal.open({
      title: 'Найденные роли',
      html: rows + warn + '<p class="muted">Названия и интересы можно поправить после замены.</p>',
      actions: [
        { label: 'Отмена', value: false },
        { label: 'Заменить роли', kind: 'btn-primary', value: true }
      ]
    }).then(function (ok) {
      if (!ok) return;
      var next = take.map(function (r, i) { return Schema.newRole(r.name, i + 1, r.interest); });
      while (next.length < C.ROLES_MIN) next.push(Schema.newRole('Роль ' + (next.length + 1), next.length + 1));
      Storage.patch(s.id, 'roles', Roles.renumber(next));
      Storage.patch(s.id, 'step3.byRole', {});
      Storage.patch(s.id, 'step8.byRole', {});
      view.roleId = null;
      Toast.show('Ролей записано: ' + next.length);
      render();
    });
  }

  /* ---------- архив ---------- */

  function doExport() {
    Storage.flush().catch(function () {}).then(function () {
      try {
        Archive.download(root);
        /* Отметка о выгрузке местная: архив выгружают на устройстве,
           и напоминание тоже нужно этому устройству. */
        Storage.writeLocal('lastExport', U.now()).catch(function () {});
        refreshSafety();
        Toast.show('Архив выгружен');
      } catch (e) {
        Toast.show('Не удалось выгрузить архив: ' + e.message, 'err');
      }
    });
  }

  function doImport() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (!f) return;
      Archive.readFile(f).then(function (raw) {
        var incoming = Schema.migrate(raw); // тут же отсекается схема из будущего
        var n = incoming.situations.length;
        Modal.open({
          title: 'Загрузка архива',
          html: '<p>В файле ситуаций: <b>' + n + '</b>. Сейчас в приложении: <b>' + root.situations.length + '</b>.</p>' +
            '<p><b>Заменить</b> - выбросить текущие данные и оставить только файл.<br>' +
            '<b>Слить</b> - добавить ситуации из файла к текущим. Совпадающие получат новые внутренние номера, ничего не перезапишется.</p>',
          actions: [
            { label: 'Отмена', value: null },
            { label: 'Слить', value: 'merge' },
            { label: 'Заменить', kind: 'btn-danger', value: 'replace' }
          ]
        }).then(function (mode) {
          if (!mode) return;
          if (mode === 'replace') {
            return Modal.confirm('Заменить все данные',
              'Текущие ситуации (' + root.situations.length + ') будут удалены и заменены содержимым файла. Отменить это нельзя.',
              'Заменить'
            ).then(function (ok) {
              if (!ok) return;
              return apply(incoming, 'Архив загружен, данные заменены');
            });
          }
          var merged = Archive.merge(root, incoming);
          return apply(merged, 'Архив загружен, ситуаций добавлено: ' + n);
        });
      }).catch(function (e) {
        Modal.open({
          title: 'Файл не подошел',
          html: '<p class="pre">' + U.esc(e.message || String(e)) + '</p>',
          actions: [{ label: 'Понятно', kind: 'btn-primary', value: null }]
        });
      });
    });
    inp.click();
  }

  function apply(nextRoot, okText) {
    return Storage.replaceAll(nextRoot).then(function () {
      view.screen = 'list';
      view.sitId = null;
      Theme.apply(root.settings.theme);
      Toast.show(okText);
      render();
    }).catch(function (e) {
      Toast.show('Не удалось записать данные: ' + (e.message || e), 'err');
    });
  }

  /* ---------- запуск ---------- */

  function fatal(msg) {
    document.getElementById('root').innerHTML =
      '<div class="wrap"><div class="card" style="margin-top:40px">' +
      '<h2 style="margin-bottom:8px">Приложение не может работать</h2>' +
      '<p class="pre">' + U.esc(msg) + '</p>' +
      '<p class="muted">Данные хранятся в базе IndexedDB этого браузера. Если браузер работает в приватном режиме или запрещает сайту хранилище, приложение открыть не получится.</p>' +
      '</div></div>';
  }

  function start() {
    mount = document.getElementById('root');
    mount.addEventListener('click', onClick);
    // нажатие на всплывающую кнопку не должно снимать выделение до срабатывания
    mount.addEventListener('mousedown', function (e) {
      if (e.target.closest && e.target.closest('#sel-btn')) e.preventDefault();
    });
    mount.addEventListener('input', onInput);
    mount.addEventListener('change', onChange);
    /* Выделение в тексте ситуации. Кусок запоминаем заранее: нажатие на
       кнопку снимает выделение, особенно на телефоне. Кнопка всплывает
       у самого выделения, иначе ее просто не находят. */
    document.addEventListener('selectionchange', onSelection);
    window.addEventListener('resize', function () { hideSelButton(); });
    document.addEventListener('scroll', function () { hideSelButton(); }, true);

    mount.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'open-sit') {
        e.preventDefault();
        openSituation(e.target.getAttribute('data-id'));
      }
    });

    /* Стоп-кран второй вкладки, раздел 11 ТЗ */
    Tabs.start();
    Tabs.onRemote = function () {
      /* На списке ситуаций затирать нечего: перечитываем и показываем свежее */
      if (view.screen === 'list' && !Storage.hasPending()) {
        Storage.reload().then(function () { render(); }).catch(function () {});
        return 'reload';
      }
      return 'lock';
    };
    Tabs.onLock = function () {
      Toast.show('Данные изменены в другой вкладке: правки здесь не сохраняются', 'err');
      render();
    };

    Storage.subscribe(function (ev) {
      if (ev.type === 'save') updateSaveIndicator(ev.state);
      if (ev.type === 'error') Toast.show('Данные не сохранились: ' + (ev.error && ev.error.message ? ev.error.message : 'ошибка базы'), 'err');
      if (ev.type === 'external') render();
    });
    Cloud.subscribe(function (state) { updateCloudIndicator(state); });
    Cloud.onConflict(conflictDialog);

    /* Четыре точки обмена, раздел 9.2 ТЗ. Фонового опроса нет. */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') {
        Storage.flush().catch(function () {});
        Cloud.flushNow('hide');
      } else {
        Cloud.sync('focus');
      }
    });
    window.addEventListener('pagehide', function () { Storage.flush().catch(function () {}); });
    /* Часы репетиции не должны тикать в свернутой вкладке: время все
       равно считается по системным часам и сойдется при возврате. */
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') rehStop();
      else if (view.screen === 'rehearsal' && view.reh.running) rehStart();
    });
    window.addEventListener('beforeunload', function (e) {
      if (Storage.hasPending()) { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('online', function () { Cloud.sync('focus'); });

    Storage.load().then(function (r) {
      root = r;
      Theme.apply(root.settings.theme);
      Express.set(root.settings.expressMode);
      /* Корзина чистится по сроку при каждом открытии: раздел 11 ТЗ. */
      Trash.expired(root.situations, U.now()).forEach(function (s) { Storage.purge(s.id); });
      /* Баннеры сохранности, раздел 3.1 ТЗ */
      refreshSafety().then(function () { if (view.screen === 'list') render(); });
      if (root.settings.cloud.connected) useCloudAdapter(true);
      render();

      // вход прошел без отдельного окна: разбираем возврат и сразу синхронизируем
      if (OAUTH_RETURN) {
        GoogleAuth.accept(OAUTH_RETURN);
        OAUTH_RETURN = null;
        if (GoogleAuth.has() && !root.settings.cloud.connected) {
          Storage.setSetting('cloud.connected', true);
          useCloudAdapter(true);
        }
      }
      // вход мог пережить перезагрузку: поднимаем его и сразу обмениваемся
      if (root.settings.cloud.connected) Cloud.resume();
    }).catch(function (e) {
      fatal(e && e.message ? e.message : String(e));
    });
  }

  return {
    start: start,
    render: render,
    view: function () { return view; },
    data: function () { return root; }
  };
})();

/* Точка входа. Отладочная ручка PP нужна для проверки в консоли,
   на работу приложения не влияет. */
window.PP = {
  C: C, U: U, Schema: Schema, Storage: Storage, Roles: Roles, Archive: Archive,
  Cloud: Cloud, GoogleAuth: GoogleAuth, Drive: Drive, App: App, Library: Library,
  Traffic: Traffic, Copy: Copy, Express: Express, Comments: Comments,
  Rehearsal: Rehearsal, Sound: Sound, Report: Report, Trash: Trash, Safety: Safety, Tabs: Tabs
};

if (!IS_OAUTH_POPUP) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.start);
  } else {
    App.start();
  }
}
</script>
</body>
</html>
