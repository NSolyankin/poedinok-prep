<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<title>Подготовка к поединку</title>
<style>
:root{
  --bg:#f4f4f1; --surface:#ffffff; --surface2:#ecece7;
  --text:#191b1a; --muted:#5f6462; --line:#dcdcd5;
  --accent:#26584a; --accent-soft:#dfeae5; --on-accent:#ffffff;
  --warn:#8a5a05; --warn-soft:#fbf0d8;
  --danger:#9e2f2f; --danger-soft:#f8e3e3;
  --focus:#26584a;
  --tap:44px; --r:10px; --gap:14px;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#15181a; --surface:#1d2124; --surface2:#252a2e;
  --text:#e9eae8; --muted:#9aa2a0; --line:#333a3e;
  --accent:#79c0aa; --accent-soft:#20302c; --on-accent:#0e1513;
  --warn:#e0ae52; --warn-soft:#31291a;
  --danger:#e59090; --danger-soft:#33201f;
  --focus:#79c0aa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#15181a; --surface:#1d2124; --surface2:#252a2e;
    --text:#e9eae8; --muted:#9aa2a0; --line:#333a3e;
    --accent:#79c0aa; --accent-soft:#20302c; --on-accent:#0e1513;
    --warn:#e0ae52; --warn-soft:#31291a;
    --danger:#e59090; --danger-soft:#33201f;
    --focus:#79c0aa;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--ff);
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0; font-weight:600; line-height:1.25}
h1{font-size:19px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0 0 10px}
svg{display:block; flex:none}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ---------- каркас ---------- */
.wrap{max-width:780px; margin:0 auto; padding:0 12px 96px}
.hdr{
  position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hdr-in{max-width:780px; margin:0 auto; padding:6px 12px; display:flex; align-items:center; gap:8px; min-height:52px}
.hdr-title{flex:1 1 auto; min-width:0}
.hdr-title h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hdr-sub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); min-width:var(--tap); padding:8px 14px;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--text);
  font:inherit; font-size:15px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45; cursor:default; transform:none}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-primary:hover{background:var(--accent); filter:brightness(1.07)}
.btn-danger{color:var(--danger); border-color:var(--line)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-ghost{background:transparent; border-color:transparent}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{min-height:36px; padding:4px 10px; font-size:14px}
.btn-icon{padding:8px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.row-end{justify-content:flex-end}
.spacer{flex:1 1 auto}

/* ---------- карточки и поля ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; margin:0 0 var(--gap);
}
.card-tap{cursor:pointer}
.card-tap:hover{border-color:var(--accent)}
.muted{color:var(--muted); font-size:13px}
.field{margin:0 0 16px}
.field:last-child{margin-bottom:0}
.label{display:block; font-size:14px; font-weight:600; margin:0 0 6px}
.hint{font-size:13px; color:var(--muted); margin:-2px 0 6px}
input[type=text], textarea, select{
  width:100%; font:inherit; font-size:16px; color:var(--text);
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; min-height:var(--tap);
}
textarea{resize:vertical; overflow:hidden; line-height:1.5}
input[type=text]:focus, textarea:focus{border-color:var(--accent); outline:2px solid var(--focus); outline-offset:-1px}
.counter{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); margin-top:4px; min-height:18px}
.counter.warn{color:var(--warn); font-weight:600}
.counter.full{color:var(--danger); font-weight:600}
.chk{
  display:inline-flex; align-items:center; gap:7px; min-height:var(--tap);
  padding:0 10px 0 8px; border:1px solid var(--line); border-radius:999px;
  cursor:pointer; font-size:14px; background:var(--surface);
}
.chk input{width:20px; height:20px; margin:0; accent-color:var(--accent)}
.chk.on{background:var(--accent-soft); border-color:var(--accent)}

/* ---------- список ситуаций ---------- */
.sit-card{display:flex; align-items:flex-start; gap:10px}
.sit-main{flex:1 1 auto; min-width:0}
.sit-title{font-weight:600; font-size:16px; word-break:break-word}
.empty{text-align:center; color:var(--muted); padding:40px 12px}

/* ---------- аккордеон шагов ---------- */
.acc{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); margin:0 0 var(--gap); overflow:hidden}
.acc-h{
  display:flex; align-items:center; gap:10px; width:100%;
  min-height:var(--tap); padding:12px 14px; background:transparent;
  border:0; border-radius:0; font:inherit; color:var(--text); text-align:left; cursor:pointer;
}
.acc-h:hover{background:var(--surface2)}
.acc-num{
  flex:none; width:26px; height:26px; border-radius:7px; background:var(--surface2);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--muted);
}
.acc.open .acc-num{background:var(--accent); color:var(--on-accent)}
.acc-t{flex:1 1 auto; font-weight:600; font-size:15px}
.acc-b{padding:0 14px 16px; border-top:1px solid var(--line); padding-top:14px}
.acc .chev{transition:transform .15s ease}
.acc.open .chev{transform:rotate(90deg)}

/* ---------- переключатель роли ---------- */
.roles-bar{
  display:flex; gap:6px; overflow-x:auto; padding:8px 0 10px; margin:0 0 4px;
  -webkit-overflow-scrolling:touch; scrollbar-width:thin;
}
.role-tab{
  flex:none; min-height:var(--tap); padding:6px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  font:inherit; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap; max-width:60vw;
}
.role-tab .nm{overflow:hidden; text-overflow:ellipsis}
.role-tab.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.role-tab .dot{width:7px; height:7px; border-radius:50%; background:var(--line); flex:none}
.role-tab .dot.filled{background:var(--accent)}
.role-tab.on .dot{background:rgba(255,255,255,.4)}
.role-tab.on .dot.filled{background:var(--on-accent)}
.tag-hard{
  font-size:11px; padding:1px 6px; border-radius:999px;
  background:var(--warn-soft); color:var(--warn); font-weight:600; border:1px solid transparent;
}
.role-tab.on .tag-hard{background:rgba(255,255,255,.22); color:var(--on-accent)}

/* ---------- роли ---------- */
.role-row{border:1px solid var(--line); border-radius:var(--r); padding:12px; margin:0 0 10px; background:var(--surface)}
.role-head{display:flex; gap:8px; align-items:center}
.role-head .short{width:64px; flex:none; text-align:center}
.ord{display:flex; flex-direction:column; gap:2px}
.ord .btn{min-height:22px; height:22px; padding:0 6px}

/* ---------- вводные шага 3 ---------- */
.asm{border:1px solid var(--line); border-radius:var(--r); padding:10px; margin:0 0 10px; background:var(--surface)}
.asm.susp{border-color:var(--warn); background:var(--warn-soft)}
.asm-warn{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--warn); font-weight:600; margin-top:8px}

/* ---------- индикатор сохранения ---------- */
.save{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap}
.save .d{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.save.dirty .d{background:var(--warn)}
.save.saving .d{background:var(--accent); animation:pulse 1s infinite}
.save.saved .d{background:var(--accent)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- шаг 2: разбор текста ---------- */
.src{
  white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.6;
  max-height:46vh; overflow:auto; padding:10px; border-radius:8px;
  background:var(--surface); border:1px solid var(--line);
  -webkit-user-select:text; user-select:text;
}
.src mark.q{background:var(--accent-soft); color:inherit; border-radius:3px; padding:1px 0; box-shadow:0 1px 0 var(--accent)}
.src mark.q::after{
  content:attr(data-n); font-size:10px; color:var(--accent); font-weight:700;
  vertical-align:super; padding:0 2px; -webkit-user-select:none; user-select:none;
}
.selbtn{
  position:fixed; z-index:80; display:none; align-items:center; gap:8px;
  min-height:44px; padding:8px 16px; border-radius:999px; cursor:pointer;
  background:var(--accent); color:var(--on-accent); border:0; font:inherit; font-size:15px; font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.28);
  -webkit-user-select:none; user-select:none;
}
.selbtn.show{display:inline-flex}
.selhint{font-size:13px; color:var(--muted); margin:8px 0 0; min-height:19px}
.selhint b{color:var(--text); font-weight:600}
.tabs{display:flex; gap:6px; margin:14px 0 12px; flex-wrap:wrap}
.tab{
  min-height:var(--tap); padding:6px 14px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:14px;
}
.tab.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  min-height:36px; padding:4px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--muted); font:inherit; font-size:13px;
}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
.phrase .pnum{
  flex:none; width:24px; height:24px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
  display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; margin-top:9px;
}
.reading{border-left:2px solid var(--line); padding:0 0 0 10px; margin:0 0 10px}
.btn.starred{color:var(--warn)}
.mx-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r)}
table.mx{border-collapse:collapse; width:100%; font-size:13px}
table.mx th, table.mx td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 6px; text-align:center}
table.mx th{background:var(--surface2); font-weight:600; white-space:nowrap}
table.mx th.idle{color:var(--muted); background:transparent}
table.mx .qcell{text-align:left; min-width:190px; max-width:320px}
table.mx td.on{color:var(--accent); background:var(--accent-soft)}
table.mx td.on svg{margin:0 auto}
table.mx .pnum{
  display:inline-flex; width:20px; height:20px; border-radius:5px; background:var(--accent-soft); color:var(--accent);
  align-items:center; justify-content:center; font-size:11px; font-weight:700; vertical-align:middle;
}

/* ---------- значок синхронизации ---------- */
.cloud-btn.muted{color:var(--muted)}
.cloud-btn.ok{color:var(--accent)}
.cloud-btn.warn{color:var(--warn)}
.cloud-btn.busy{color:var(--accent); animation:pulse 1.1s infinite}

/* ---------- модалка ---------- */
.modal{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px}
.modal-bg{position:absolute; inset:0; background:rgba(0,0,0,.45)}
.modal-w{
  position:relative; background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
  max-width:560px; width:100%; max-height:86vh; overflow:auto; padding:18px;
}
.modal-w h2{margin:0 0 10px}
.modal-acts{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:16px}

/* ---------- тосты ---------- */
.toasts{position:fixed; left:0; right:0; bottom:16px; z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
.toast{
  background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px;
  font-size:14px; box-shadow:var(--shadow); max-width:90vw;
}
.toast.err{background:var(--danger); color:#fff}

/* ---------- прочее ---------- */
.det{border:1px solid var(--line); border-radius:var(--r); padding:0; margin:0 0 16px; background:var(--surface2)}
.det>summary{min-height:var(--tap); display:flex; align-items:center; padding:10px 12px; cursor:pointer; font-size:14px; font-weight:600; list-style:none}
.det>summary::-webkit-details-marker{display:none}
.det>summary::before{content:"+"; margin-right:8px; color:var(--muted); font-weight:700}
.det[open]>summary::before{content:"\2212"}
.det-b{padding:0 12px 12px; font-size:14px; color:var(--muted)}
.sep{height:1px; background:var(--line); margin:18px 0}
.pre{white-space:pre-wrap; word-break:break-word; font-size:14px}
.nowrap{white-space:nowrap}
@media (min-width:640px){
  .role-head .short{width:80px}
}
@media (max-width:400px){
  .btn{padding:8px 10px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script>
/* =====================================================================
   Подготовка к поединку.
   Трек А, версия клиента 0.1. Трек Б, синхронизация 0.1.
   Один файл, ни одной внешней зависимости и ни одного стороннего скрипта.
   Сеть трогается только ради вашего файла на Google Диске: вход и Drive API.
   Хранение: только IndexedDB, никаких ключ-значение хранилищ браузера.
   ===================================================================== */
'use strict';

/* ---------------------------------------------------------------------
   0. ВОЗВРАТ ИЗ ОКНА ВХОДА GOOGLE.
   Должен отработать раньше всего остального: окно входа возвращается
   на этот же адрес и должно немедленно отдать токен и закрыться.
   --------------------------------------------------------------------- */
var OAUTH_RETURN = null;
var IS_OAUTH_POPUP = false;
(function () {
  var h = String(window.location.hash || '');
  if (h.indexOf('access_token=') < 0 && h.indexOf('error=') < 0) return;
  var p = {}, parts = h.replace(/^#/, '').split('&'), i, kv;
  for (i = 0; i < parts.length; i++) {
    kv = parts[i].split('=');
    if (kv[0]) p[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  }
  try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
  if (window.opener && window.opener !== window) {
    IS_OAUTH_POPUP = true;
    try { window.opener.postMessage({ ppOAuth: p }, window.location.origin); } catch (e) {}
    try { window.close(); } catch (e) {}
    return;
  }
  OAUTH_RETURN = p; // вход прошел без отдельного окна, разберет App при запуске
})();

/* ---------------------------------------------------------------------
   1. КОНСТАНТЫ. Все пороги ТЗ собраны здесь и больше нигде не повторяются.
   --------------------------------------------------------------------- */
var C = {
  APP_VERSION: '0.2',
  SYNC_VERSION: '0.1',
  SCHEMA: 2,                 // версия схемы данных, раздел 5 ТЗ
  DB_NAME: 'poedinok-prep',  // раздел 3 ТЗ
  DB_VERSION: 1,

  ROLES_MIN: 3,              // раздел 5.1 ТЗ
  ROLES_MAX: 6,

  RETELL_COUNT: 3,           // раздел 5.2 ТЗ
  RETELL_MAX: 300,

  PHRASE_WARN: 300,          // раздел 5.9 ТЗ
  PHRASE_MAX: 400,
  SPEECH_CPS: 15,            // знаков в секунду, темп спокойной русской речи

  AUTOSAVE_MS: 400,          // раздел 11 ТЗ
  HISTORY_PER_SITUATION: 200,// раздел 11 ТЗ

  SHORT_MAX: 3,              // длина короткой метки роли
  TITLE_DEFAULT: 'Без названия',

  /* Семь слоев ситуации, раздел 5.3 ТЗ и шаблон. Порядок фиксирован. */
  LAYERS: [
    { id: 'tech', short: 'Тех', name: 'технический', about: 'Материальные, предметные условия.' },
    { id: 'techno', short: 'Тхн', name: 'технологический', about: 'Методы, процессы и средства реализации.' },
    { id: 'psy', short: 'Пси', name: 'психологический', about: 'Внутренняя жизнь человека, психика.' },
    { id: 'eco', short: 'Экн', name: 'экономический', about: 'Производственно-хозяйственные, денежные отношения.' },
    { id: 'aesth', short: 'Эст', name: 'эстетический', about: 'Чувственное восприятие прекрасного.' },
    { id: 'ethic', short: 'Эти', name: 'этический', about: 'Нормы морали и нравственности.' },
    { id: 'law', short: 'Прв', name: 'правовой', about: 'Правовое регулирование отношений участников.' }
  ],
  QUOTE_PREVIEW: 60,         // сколько знаков цитаты показывать в матрице

  /* Синхронизация, раздел 9 ТЗ. Единственные адреса, к которым
     приложение вообще обращается. */
  CLOUD: {
    CLIENT_ID: '350074658152-jep00j22rmer4pq61p055d80o5omp7m4.apps.googleusercontent.com',
    SCOPE: 'https://www.googleapis.com/auth/drive.file',
    AUTH_URL: 'https://accounts.google.com/o/oauth2/v2/auth',
    API: 'https://www.googleapis.com/drive/v3',
    UPLOAD: 'https://www.googleapis.com/upload/drive/v3',
    FOLDER: 'Подготовка к поединку',
    FILE: 'poedinok-prep.json',
    IDLE_SYNC_MS: 20000      // раздел 9.2: через 20 секунд после последней правки
  }
};

/* ---------------------------------------------------------------------
   2. МЕЛКИЕ УТИЛИТЫ
   --------------------------------------------------------------------- */
var U = {
  id: function (prefix) {
    return prefix + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);
  },
  now: function () { return Date.now(); },

  esc: function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  // длина в символах с учетом суррогатных пар
  len: function (s) { return Array.from(String(s || '')).length; },
  cut: function (s, max) {
    var a = Array.from(String(s || ''));
    return a.length <= max ? String(s || '') : a.slice(0, max).join('');
  },

  clone: function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); },
  same: function (a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); },

  // чтение и запись поля по пути вида step8.byRole.r2.firstPhrase
  getPath: function (obj, path) {
    if (!path) return obj;
    var p = String(path).split('.'), cur = obj;
    for (var i = 0; i < p.length; i++) {
      if (cur == null || typeof cur !== 'object') return undefined;
      cur = cur[p[i]];
    }
    return cur;
  },
  setPath: function (obj, path, value) {
    var p = String(path).split('.'), cur = obj;
    for (var i = 0; i < p.length - 1; i++) {
      var k = p[i];
      if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {};
      cur = cur[k];
    }
    cur[p[p.length - 1]] = value;
    return obj;
  },

  dateShort: function (ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
  },
  dateFile: function (ts) {
    var d = new Date(ts || Date.now());
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  },
  seconds: function (chars) { return Math.round(chars / C.SPEECH_CPS); },

  debounce: function (fn, ms) {
    var t = null;
    var f = function () {
      var args = arguments;
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(null, args); }, ms);
    };
    f.cancel = function () { if (t) { clearTimeout(t); t = null; } };
    f.pending = function () { return t !== null; };
    return f;
  }
};

/* ---------------------------------------------------------------------
   3. СХЕМА ДАННЫХ. Фабрики и миграция. Раздел 5 ТЗ.
   Имена полей менять нельзя: на них завязаны экспорт, импорт и будущие версии.
   --------------------------------------------------------------------- */
var Schema = {
  newSettings: function () {
    return {
      roundsCount: 2,
      roundMinutes: 5,
      theme: 'auto',
      expressMode: false,
      /* Блок синхронизации свой у каждого устройства и в облако не уходит:
         номер файла общий, а состояние подключения местное. */
      cloud: {
        provider: 'google',
        connected: false,
        lastSync: 0,
        folderId: '',
        fileId: '',
        lastVersion: 0,
        pendingLocal: false
      }
    };
  },

  newRoot: function () {
    return { schema: C.SCHEMA, settings: Schema.newSettings(), situations: [], formulaLibrary: [] };
  },

  newRole: function (name, order, interest) {
    var n = String(name || '');
    return {
      id: U.id('r_'),
      name: n,
      short: Schema.shortOf(n),
      order: order || 1,
      hard: false,
      interest: interest || ''   // отступление от раздела 5.1 ТЗ, см. CHANGELOG
    };
  },

  shortOf: function (name) {
    var s = String(name || '').trim();
    if (!s) return '';
    return U.cut(s, 1).toUpperCase();
  },

  newSituation: function (title) {
    var ts = U.now();
    var roles = [];
    for (var i = 1; i <= C.ROLES_MIN; i++) roles.push(Schema.newRole('Роль ' + i, i));
    return {
      id: U.id('s_'),
      title: title || C.TITLE_DEFAULT,
      sourceText: '',
      context: '',
      createdAt: ts,
      updatedAt: ts,
      roles: roles,
      step1: { fabula: '', plot: '', essence: '', retell: ['', '', ''] },
      step2: { phrases: [], layerNotes: Schema.emptyLayerNotes() },
      step3: { byRole: {} },
      step4: {},
      step5: {},
      step6: {},
      step7: {},
      step8: { byRole: {} },
      step9: {},
      secondQuestions: [],
      comments: [],
      afterNotes: ''
    };
  },

  newAssumption: function () {
    return { id: U.id('a_'), text: '', necessary: false, sufficient: false };
  },

  emptyLayerNotes: function () {
    var o = {};
    C.LAYERS.forEach(function (l) { o[l.id] = ''; });
    return o;
  },
  newPhrase: function (quote) {
    return { id: U.id('p_'), quote: String(quote || ''), purpose: '', readings: [], layers: [] };
  },
  newReading: function () {
    return { id: U.id('rd_'), text: '', use: '', starred: false };
  },

  step3ForRole: function (sit, roleId) {
    if (!sit.step3) sit.step3 = { byRole: {} };
    if (!sit.step3.byRole) sit.step3.byRole = {};
    if (!sit.step3.byRole[roleId]) sit.step3.byRole[roleId] = { heroVersion: '', assumptions: [] };
    return sit.step3.byRole[roleId];
  },
  step8ForRole: function (sit, roleId) {
    if (!sit.step8) sit.step8 = { byRole: {} };
    if (!sit.step8.byRole) sit.step8.byRole = {};
    if (!sit.step8.byRole[roleId]) sit.step8.byRole[roleId] = { firstPhrase: '', roleAssignment: '', roundGoal: '' };
    return sit.step8.byRole[roleId];
  },

  /* Приведение ситуации к полной схеме. Вызывается для всего, что пришло
     снаружи: из базы, из импортированного архива. Ничего не удаляет:
     разделы будущих версий переживают чтение старым клиентом. */
  normalizeSituation: function (s) {
    if (!s || typeof s !== 'object') return null;
    var base = Schema.newSituation();
    var out = {};
    var k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    for (k in s) if (Object.prototype.hasOwnProperty.call(s, k)) out[k] = s[k];

    out.id = String(out.id || U.id('s_'));
    out.title = String(out.title == null ? C.TITLE_DEFAULT : out.title);
    out.sourceText = String(out.sourceText || '');
    out.context = String(out.context || '');
    out.createdAt = Number(out.createdAt) || U.now();
    out.updatedAt = Number(out.updatedAt) || out.createdAt;
    out.afterNotes = String(out.afterNotes || '');
    if (!Array.isArray(out.secondQuestions)) out.secondQuestions = [];
    if (!Array.isArray(out.comments)) out.comments = [];

    if (!Array.isArray(out.roles)) out.roles = [];
    out.roles = out.roles.filter(function (r) { return r && typeof r === 'object'; }).map(function (r, i) {
      return {
        id: String(r.id || U.id('r_')),
        name: String(r.name || ''),
        short: String(r.short || Schema.shortOf(r.name)),
        order: Number(r.order) || (i + 1),
        hard: !!r.hard,
        interest: String(r.interest || '')
      };
    });
    while (out.roles.length < C.ROLES_MIN) {
      out.roles.push(Schema.newRole('Роль ' + (out.roles.length + 1), out.roles.length + 1));
    }
    if (out.roles.length > C.ROLES_MAX) out.roles = out.roles.slice(0, C.ROLES_MAX);

    // шаг 1
    var s1 = (out.step1 && typeof out.step1 === 'object') ? out.step1 : {};
    out.step1 = {
      fabula: String(s1.fabula || ''),
      plot: String(s1.plot || ''),
      essence: String(s1.essence || ''),
      retell: Array.isArray(s1.retell) ? s1.retell.slice(0, C.RETELL_COUNT).map(function (t) { return String(t || ''); }) : []
    };
    while (out.step1.retell.length < C.RETELL_COUNT) out.step1.retell.push('');

    // шаг 2
    var s2 = (out.step2 && typeof out.step2 === 'object') ? out.step2 : {};
    var notes = Schema.emptyLayerNotes();
    if (s2.layerNotes && typeof s2.layerNotes === 'object') {
      C.LAYERS.forEach(function (l) { notes[l.id] = String(s2.layerNotes[l.id] || ''); });
    }
    var layerIds = C.LAYERS.map(function (l) { return l.id; });
    out.step2 = {
      phrases: (Array.isArray(s2.phrases) ? s2.phrases : []).filter(function (p) { return p && typeof p === 'object'; })
        .map(function (p) {
          return {
            id: String(p.id || U.id('p_')),
            quote: String(p.quote || ''),
            purpose: String(p.purpose || ''),
            readings: (Array.isArray(p.readings) ? p.readings : []).map(function (r) {
              return {
                id: String((r && r.id) || U.id('rd_')),
                text: String((r && r.text) || ''),
                use: String((r && r.use) || ''),
                starred: !!(r && r.starred)
              };
            }),
            layers: (Array.isArray(p.layers) ? p.layers : []).filter(function (x) { return layerIds.indexOf(x) >= 0; })
          };
        }),
      layerNotes: notes
    };

    // разделы будущих версий держим объектами, чтобы схема была стабильной
    ['step4', 'step5', 'step6', 'step7', 'step9'].forEach(function (key) {
      if (!out[key] || typeof out[key] !== 'object') out[key] = {};
    });

    // шаг 3
    if (!out.step3 || typeof out.step3 !== 'object') out.step3 = {};
    if (!out.step3.byRole || typeof out.step3.byRole !== 'object') out.step3.byRole = {};
    // шаг 8
    if (!out.step8 || typeof out.step8 !== 'object') out.step8 = {};
    if (!out.step8.byRole || typeof out.step8.byRole !== 'object') out.step8.byRole = {};

    out.roles.forEach(function (r) {
      var a = out.step3.byRole[r.id];
      out.step3.byRole[r.id] = {
        heroVersion: String((a && a.heroVersion) || ''),
        assumptions: (a && Array.isArray(a.assumptions) ? a.assumptions : []).map(function (x) {
          return {
            id: String((x && x.id) || U.id('a_')),
            text: String((x && x.text) || ''),
            necessary: !!(x && x.necessary),
            sufficient: !!(x && x.sufficient)
          };
        })
      };
      var b = out.step8.byRole[r.id];
      out.step8.byRole[r.id] = {
        firstPhrase: U.cut(String((b && b.firstPhrase) || ''), C.PHRASE_MAX),
        roleAssignment: String((b && b.roleAssignment) || ''),
        roundGoal: String((b && b.roundGoal) || '')
      };
    });
    return out;
  },

  /* Миграция корня. Раздел 11 ТЗ: понижение версии - отказ.
     Написана заранее, хотя мигрировать пока не с чего. */
  migrate: function (raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      var e0 = new Error('Файл не похож на архив приложения');
      e0.code = 'bad-file';
      throw e0;
    }
    var v = Number(raw.schema) || 1;
    if (v > C.SCHEMA) {
      var e1 = new Error('Данные сохранены более новой версией приложения (схема ' + v +
        ', эта версия понимает ' + C.SCHEMA + '). Открывать их нельзя: часть полей будет потеряна.');
      e1.code = 'schema-too-new';
      throw e1;
    }
    var root = U.clone(raw);
    if (v < 2) {
      // 1 -> 2: в первой схеме не было отдельного слоя настроек облака
      root.settings = root.settings || {};
      root.schema = 2;
    }
    root.schema = C.SCHEMA;

    var def = Schema.newSettings();
    var st = (root.settings && typeof root.settings === 'object') ? root.settings : {};
    root.settings = {
      roundsCount: Number(st.roundsCount) || def.roundsCount,
      roundMinutes: Number(st.roundMinutes) || def.roundMinutes,
      theme: (['auto', 'light', 'dark'].indexOf(st.theme) >= 0) ? st.theme : def.theme,
      expressMode: !!st.expressMode,
      cloud: {
        provider: String((st.cloud && st.cloud.provider) || def.cloud.provider),
        connected: !!(st.cloud && st.cloud.connected),
        lastSync: Number(st.cloud && st.cloud.lastSync) || 0,
        folderId: String((st.cloud && st.cloud.folderId) || ''),
        fileId: String((st.cloud && st.cloud.fileId) || ''),
        lastVersion: Number(st.cloud && st.cloud.lastVersion) || 0,
        pendingLocal: !!(st.cloud && st.cloud.pendingLocal)
      }
    };

    if (!Array.isArray(root.situations)) root.situations = [];
    root.situations = root.situations.map(Schema.normalizeSituation).filter(Boolean);
    if (!Array.isArray(root.formulaLibrary)) root.formulaLibrary = [];
    return root;
  }
};
/* ---------------------------------------------------------------------
   4. IDB. Единственное место в файле, где приложение обращается к базе
   браузера напрямую. Если такое обращение нашлось где-то еще - слой протек.
   --------------------------------------------------------------------- */
var IDB = (function () {
  var db = null;

  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      var req;
      try {
        req = indexedDB.open(C.DB_NAME, C.DB_VERSION);
      } catch (e) {
        return reject(e);
      }
      req.onupgradeneeded = function (ev) {
        var d = ev.target.result;
        if (!d.objectStoreNames.contains('situations')) d.createObjectStore('situations', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('formulas')) d.createObjectStore('formulas', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('history')) {
          var h = d.createObjectStore('history', { keyPath: 'seq', autoIncrement: true });
          h.createIndex('bySituation', 'situationId', { unique: false });
        }
      };
      req.onsuccess = function () {
        db = req.result;
        db.onversionchange = function () { try { db.close(); } catch (e) {} db = null; };
        resolve(db);
      };
      req.onerror = function () { reject(req.error || new Error('Не удалось открыть базу данных')); };
      req.onblocked = function () { reject(new Error('База занята другой вкладкой приложения')); };
    });
  }

  function run(stores, mode, body) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(stores, mode);
        var out;
        tx.oncomplete = function () { resolve(out); };
        tx.onerror = function () { reject(tx.error || new Error('Ошибка записи в базу')); };
        tx.onabort = function () { reject(tx.error || new Error('Запись отменена')); };
        try {
          out = body(tx);
        } catch (e) {
          try { tx.abort(); } catch (e2) {}
          reject(e);
        }
      });
    });
  }

  return {
    open: open,

    // прочитать все хранилища разом
    readAll: function () {
      var res = { situations: [], meta: [], formulas: [] };
      return run(['situations', 'meta', 'formulas'], 'readonly', function (tx) {
        var a = tx.objectStore('situations').getAll();
        a.onsuccess = function () { res.situations = a.result || []; };
        var b = tx.objectStore('meta').getAll();
        b.onsuccess = function () { res.meta = b.result || []; };
        var f = tx.objectStore('formulas').getAll();
        f.onsuccess = function () { res.formulas = f.result || []; };
      }).then(function () { return res; });
    },

    /* Одна транзакция на всю пачку правок: либо записалось все, либо ничего.
       batch = { situations:[], removed:[id], meta:[{key,value}], history:[], trim:[sid] } */
    write: function (batch) {
      return run(['situations', 'meta', 'history'], 'readwrite', function (tx) {
        var sSit = tx.objectStore('situations');
        var sMeta = tx.objectStore('meta');
        var sHist = tx.objectStore('history');

        (batch.situations || []).forEach(function (s) { sSit.put(s); });
        (batch.removed || []).forEach(function (id) { sSit.delete(id); });
        (batch.meta || []).forEach(function (m) { sMeta.put(m); });
        (batch.history || []).forEach(function (h) { sHist.add(h); });

        // журнал: не больше C.HISTORY_PER_SITUATION записей на ситуацию
        (batch.trim || []).forEach(function (sid) {
          var idx = sHist.index('bySituation');
          var keys = [];
          var cur = idx.openCursor(IDBKeyRange.only(sid));
          cur.onsuccess = function (ev) {
            var c = ev.target.result;
            if (c) { keys.push(c.primaryKey); c.continue(); return; }
            var extra = keys.length - C.HISTORY_PER_SITUATION;
            for (var i = 0; i < extra; i++) sHist.delete(keys[i]);
          };
        });

        // журнал удаленной ситуации не нужен
        (batch.removed || []).forEach(function (sid) {
          var idx2 = sHist.index('bySituation');
          var cur2 = idx2.openCursor(IDBKeyRange.only(sid));
          cur2.onsuccess = function (ev) {
            var c = ev.target.result;
            if (c) { sHist.delete(c.primaryKey); c.continue(); }
          };
        });
      });
    },

    // полная замена содержимого: импорт архива
    replaceAll: function (situations, meta, formulas) {
      return run(['situations', 'meta', 'formulas', 'history'], 'readwrite', function (tx) {
        tx.objectStore('situations').clear();
        tx.objectStore('meta').clear();
        tx.objectStore('formulas').clear();
        tx.objectStore('history').clear();
        situations.forEach(function (s) { tx.objectStore('situations').put(s); });
        meta.forEach(function (m) { tx.objectStore('meta').put(m); });
        (formulas || []).forEach(function (f) { tx.objectStore('formulas').put(f); });
      });
    },

    // служебные записи устройства: в облако не уходят, в модель данных не входят
    getMeta: function (key) {
      var out = null;
      return run(['meta'], 'readonly', function (tx) {
        var r = tx.objectStore('meta').get(key);
        r.onsuccess = function () { out = r.result ? r.result.value : null; };
      }).then(function () { return out; });
    },
    putMeta: function (key, value) {
      return run(['meta'], 'readwrite', function (tx) {
        if (value === null || value === undefined) tx.objectStore('meta').delete(key);
        else tx.objectStore('meta').put({ key: key, value: value });
      });
    },

    historyOf: function (situationId) {
      var out = [];
      return run(['history'], 'readonly', function (tx) {
        var idx = tx.objectStore('history').index('bySituation');
        var cur = idx.openCursor(IDBKeyRange.only(situationId));
        cur.onsuccess = function (ev) {
          var c = ev.target.result;
          if (c) { out.push(c.value); c.continue(); }
        };
      }).then(function () { return out; });
    }
  };
})();

/* ---------------------------------------------------------------------
   5. LocalAdapter. Реализация хранения поверх IDB.
   Позже рядом встанет CloudAdapter с тем же набором методов,
   и приложение об этом не узнает.
   --------------------------------------------------------------------- */
var LocalAdapter = {
  name: 'local',

  init: function () {
    return IDB.readAll().then(function (raw) {
      var metaMap = {};
      raw.meta.forEach(function (m) { metaMap[m.key] = m.value; });
      var root = Schema.migrate({
        schema: metaMap.schema || C.SCHEMA,
        settings: metaMap.settings || Schema.newSettings(),
        situations: raw.situations || [],
        formulaLibrary: raw.formulas || []
      });
      // первый запуск или база без служебных записей: доводим ее до порядка сразу,
      // чтобы версия схемы лежала в базе, а не подразумевалась
      if (metaMap.schema !== root.schema || !metaMap.settings) {
        return IDB.write({
          meta: [{ key: 'schema', value: root.schema }, { key: 'settings', value: root.settings }]
        }).then(function () { return root; });
      }
      return root;
    });
  },

  write: function (batch) { return IDB.write(batch); },

  readLocal: function (key) { return IDB.getMeta('local.' + key); },
  writeLocal: function (key, value) { return IDB.putMeta('local.' + key, value); },

  replaceAll: function (root) {
    var meta = [
      { key: 'schema', value: root.schema },
      { key: 'settings', value: root.settings }
    ];
    return IDB.replaceAll(root.situations, meta, root.formulaLibrary);
  },

  status: function () { return 'local'; }
};

/* ---------------------------------------------------------------------
   6. Storage. Единственная дверь к данным для всего интерфейса.
   Раздел 4 ТЗ: load, getSituation, patch, remove, subscribe, status.
   Добавлено в 0.1: create, setSetting, replaceAll (см. CHANGELOG).
   --------------------------------------------------------------------- */
var Storage = (function () {
  var adapter = LocalAdapter;
  var root = null;              // кеш состояния, живет все время работы
  var loading = null;
  var subs = [];
  var saveState = 'saved';      // saved | dirty | saving

  var dirtySits = Object.create(null);   // id -> true
  var removedSits = Object.create(null); // id -> true
  var dirtySettings = false;
  var histPending = Object.create(null); // "sid|path" -> запись журнала
  var writing = false;
  var rewriteAfter = false;

  function emit(ev) { subs.forEach(function (fn) { try { fn(ev); } catch (e) {} }); }

  function setState(s) {
    if (saveState === s) return;
    saveState = s;
    emit({ type: 'save', state: s });
  }

  function markDirty() {
    setState('dirty');
    schedule();
  }

  var schedule = U.debounce(function () { flush().catch(function () {}); }, C.AUTOSAVE_MS);

  function collect() {
    var batch = { situations: [], removed: [], meta: [], history: [], trim: [] };
    var id;
    for (id in removedSits) batch.removed.push(id);
    for (id in dirtySits) {
      if (removedSits[id]) continue;
      var s = find(id);
      if (s) batch.situations.push(U.clone(s));
    }
    if (dirtySettings) {
      batch.meta.push({ key: 'settings', value: U.clone(root.settings) });
      batch.meta.push({ key: 'schema', value: root.schema });
    }
    var seen = Object.create(null);
    for (var k in histPending) {
      var h = histPending[k];
      if (removedSits[h.situationId]) continue;
      batch.history.push(h);
      if (!seen[h.situationId]) { seen[h.situationId] = true; batch.trim.push(h.situationId); }
    }
    return batch;
  }

  function flush() {
    schedule.cancel();
    if (writing) { rewriteAfter = true; return Promise.resolve(); }
    var batch = collect();
    var empty = !batch.situations.length && !batch.removed.length && !batch.meta.length && !batch.history.length;
    if (empty) { setState('saved'); return Promise.resolve(); }

    dirtySits = Object.create(null);
    removedSits = Object.create(null);
    dirtySettings = false;
    histPending = Object.create(null);

    writing = true;
    setState('saving');
    return adapter.write(batch).then(function () {
      writing = false;
      if (rewriteAfter) { rewriteAfter = false; return flush(); }
      setState(hasPending() ? 'dirty' : 'saved');
    }).catch(function (err) {
      writing = false;
      // правки не выброшены: возвращаем их в очередь и говорим об этом вслух
      batch.situations.forEach(function (s) { dirtySits[s.id] = true; });
      batch.removed.forEach(function (id) { removedSits[id] = true; });
      if (batch.meta.length) dirtySettings = true;
      batch.history.forEach(function (h) { histPending[h.situationId + '|' + h.path] = h; });
      setState('dirty');
      emit({ type: 'error', error: err });
      throw err;
    });
  }

  function hasPending() {
    for (var a in dirtySits) return true;
    for (var b in removedSits) return true;
    for (var c in histPending) return true;
    return dirtySettings;
  }

  function find(id) {
    if (!root) return null;
    for (var i = 0; i < root.situations.length; i++) if (root.situations[i].id === id) return root.situations[i];
    return null;
  }

  return {
    /* ---- раздел 4 ТЗ ---- */

    load: function () {
      if (root) return Promise.resolve(root);
      if (!loading) {
        loading = adapter.init().then(function (r) {
          root = r;
          loading = null;
          return root;
        }, function (e) { loading = null; throw e; });
      }
      return loading;
    },

    getSituation: function (id) { return find(id); },

    /* Точечное изменение поля с меткой времени.
       Путь адресует поле внутри ситуации: step8.byRole.r2.firstPhrase */
    patch: function (situationId, path, value) {
      var s = find(situationId);
      if (!s) return false;
      var old = U.getPath(s, path);
      if (U.same(old, value)) return false;

      U.setPath(s, path, value);
      s.updatedAt = U.now();
      dirtySits[s.id] = true;

      // журнал: правки одного поля подряд склеиваются в одну запись
      var key = s.id + '|' + path;
      var prev = histPending[key];
      histPending[key] = {
        situationId: s.id,
        path: path,
        oldValue: prev ? prev.oldValue : U.clone(old === undefined ? null : old),
        newValue: U.clone(value),
        ts: U.now()
      };
      markDirty();
      return true;
    },

    remove: function (id) {
      if (!root) return false;
      var i = root.situations.findIndex(function (s) { return s.id === id; });
      if (i < 0) return false;
      root.situations.splice(i, 1);
      removedSits[id] = true;
      delete dirtySits[id];
      markDirty();
      return true;
    },

    subscribe: function (fn) {
      subs.push(fn);
      return function () {
        var i = subs.indexOf(fn);
        if (i >= 0) subs.splice(i, 1);
      };
    },

    status: function () { return adapter.status(); },

    /* ---- добавлено в 0.1 ---- */

    create: function (situation) {
      if (!root) return null;
      var s = Schema.normalizeSituation(situation || Schema.newSituation());
      root.situations.push(s);
      dirtySits[s.id] = true;
      markDirty();
      return s;
    },

    setSetting: function (path, value) {
      if (!root) return false;
      var old = U.getPath(root.settings, path);
      if (U.same(old, value)) return false;
      U.setPath(root.settings, path, value);
      dirtySettings = true;
      markDirty();
      return true;
    },

    // импорт архива и, в будущем, ответ "взять облачную" из раздела 9.4 ТЗ
    replaceAll: function (nextRoot) {
      var next = Schema.migrate(nextRoot);
      schedule.cancel();
      dirtySits = Object.create(null);
      removedSits = Object.create(null);
      histPending = Object.create(null);
      dirtySettings = false;
      // корень меняется по месту: ссылки, которые держит интерфейс, остаются живыми
      root.schema = next.schema;
      root.settings = next.settings;
      root.situations.length = 0;
      next.situations.forEach(function (s) { root.situations.push(s); });
      root.formulaLibrary.length = 0;
      next.formulaLibrary.forEach(function (f) { root.formulaLibrary.push(f); });

      setState('saving');
      return adapter.replaceAll(root).then(function () {
        setState('saved');
        emit({ type: 'external' });
        return root;
      }).catch(function (err) {
        setState('dirty');
        emit({ type: 'error', error: err });
        throw err;
      });
    },

    /* ---- служебное ---- */
    current: function () { return root; },   // кеш без промиса, для тех, кто уже дождался load

    /* Записи, привязанные к устройству: в модель данных не входят,
       в архив не попадают, в облако не уходят. */
    readLocal: function (key) { return adapter.readLocal ? adapter.readLocal(key) : Promise.resolve(null); },
    writeLocal: function (key, value) { return adapter.writeLocal ? adapter.writeLocal(key, value) : Promise.resolve(); },

    flush: flush,
    saveState: function () { return saveState; },
    hasPending: hasPending,
    historyOf: function (id) { return IDB.historyOf(id); },
    useAdapter: function (a) { adapter = a; }
  };
})();
/* ---------------------------------------------------------------------
   6a. GoogleAuth. Вход без сторонних библиотек.
   Окно входа открывается на адрес Google, возвращается на наш же адрес
   с токеном в хвосте ссылки. Токен живет только в памяти вкладки:
   ни в базе, ни в ключ-значение хранилищах он не оседает.
   --------------------------------------------------------------------- */
var GoogleAuth = (function () {
  var token = null;      // { value, exp }
  var stateKey = '';
  var waiting = null;    // { resolve, reject, timer }

  function redirectUri() {
    // должен совпасть с зарегистрированным в консоли Google буква в букву
    var p = window.location.pathname.replace(/index\.html$/i, '');
    return window.location.origin + p;
  }

  function authUrl() {
    stateKey = U.id('st_') + U.id('');
    var q = [
      'client_id=' + encodeURIComponent(C.CLOUD.CLIENT_ID),
      'redirect_uri=' + encodeURIComponent(redirectUri()),
      'response_type=token',
      'scope=' + encodeURIComponent(C.CLOUD.SCOPE),
      'include_granted_scopes=true',
      'state=' + encodeURIComponent(stateKey)
    ];
    return C.CLOUD.AUTH_URL + '?' + q.join('&');
  }

  function accept(p) {
    if (!p) return;
    if (p.state && stateKey && p.state !== stateKey) {
      finish(null, new Error('Ответ входа не совпал с запросом'));
      return;
    }
    if (p.error) {
      finish(null, new Error(p.error === 'access_denied' ? 'Вход отменен' : ('Google вернул ошибку: ' + p.error)));
      return;
    }
    if (!p.access_token) return;
    token = {
      value: p.access_token,
      exp: U.now() + (Number(p.expires_in) || 3600) * 1000 - 60000
    };
    // кладем в базу устройства: Safari на iPhone выгружает страницу из памяти
    // при каждом переключении приложений, и без этого вход просили бы заново
    Storage.writeLocal('auth', token).catch(function () {});
    finish(token, null);
  }

  function finish(tok, err) {
    if (!waiting) return;
    var w = waiting;
    waiting = null;
    if (w.timer) clearTimeout(w.timer);
    if (err) w.reject(err); else w.resolve(tok);
  }

  window.addEventListener('message', function (ev) {
    if (ev.origin !== window.location.origin) return;
    if (!ev.data || !ev.data.ppOAuth) return;
    accept(ev.data.ppOAuth);
  });

  return {
    redirectUri: redirectUri,
    authUrl: authUrl,
    accept: accept,

    has: function () { return !!token && token.exp > U.now(); },
    value: function () { return token ? token.value : ''; },
    drop: function () {
      token = null;
      Storage.writeLocal('auth', null).catch(function () {});
    },
    expiresIn: function () { return token ? Math.max(0, token.exp - U.now()) : 0; },

    /* Поднять вход, переживший перезагрузку страницы. */
    restore: function () {
      return Storage.readLocal('auth').then(function (t) {
        if (t && t.value && Number(t.exp) > U.now()) { token = t; return true; }
        if (t) Storage.writeLocal('auth', null).catch(function () {});
        return false;
      }).catch(function () { return false; });
    },

    /* Вход. Вызывается только по нажатию кнопки: без жеста браузер
       не даст открыть окно. Если окно заблокировано, уходим на вход
       прямо этой вкладкой, правки к этому моменту уже сохранены. */
    signIn: function () {
      if (GoogleAuth.has()) return Promise.resolve(token);
      if (!C.CLOUD.CLIENT_ID) return Promise.reject(new Error('Идентификатор клиента Google не задан в коде приложения'));
      var url = authUrl();
      var win = null;
      try {
        win = window.open(url, 'pp_google_auth', 'width=520,height=680,menubar=no,toolbar=no');
      } catch (e) { win = null; }
      if (!win) {
        return Storage.flush().catch(function () {}).then(function () {
          window.location.href = url;
          return new Promise(function () {});
        });
      }
      return new Promise(function (resolve, reject) {
        waiting = { resolve: resolve, reject: reject, timer: null };
        waiting.timer = setTimeout(function () {
          finish(null, new Error('Вход не завершен за две минуты'));
        }, 120000);
        var watch = setInterval(function () {
          if (win.closed) {
            clearInterval(watch);
            setTimeout(function () { finish(null, new Error('Окно входа закрыто')); }, 400);
          }
          if (!waiting) clearInterval(watch);
        }, 500);
      });
    }
  };
})();

/* ---------------------------------------------------------------------
   6b. Drive. Три операции: найти, прочитать, записать.
   Область доступа drive.file: приложение видит только то, что создало само.
   --------------------------------------------------------------------- */
var Drive = (function () {
  function req(url, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers.Authorization = 'Bearer ' + GoogleAuth.value();
    if (!navigator.onLine) return Promise.reject(mkErr('offline', 'Нет связи'));
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) {
        GoogleAuth.drop();
        return Promise.reject(mkErr('needauth', 'Доступ к Диску потерян, нужен вход заново'));
      }
      if (!r.ok) {
        return r.text().then(function (t) {
          var body = String(t);
          /* 403 у Google означает и потерю доступа, и превышение частоты запросов.
             Вход сбрасываем только в первом случае, иначе значок желтел бы на ровном месте. */
          if (r.status === 403 && /authError|insufficientPermissions|Invalid Credentials|invalid_token/i.test(body)) {
            GoogleAuth.drop();
            return Promise.reject(mkErr('needauth', 'Доступ к Диску потерян, нужен вход заново'));
          }
          return Promise.reject(mkErr('api', 'Диск ответил ' + r.status + '. ' + body.slice(0, 160)));
        });
      }
      return r;
    }, function () {
      return Promise.reject(mkErr('offline', 'Нет связи с Диском'));
    });
  }

  function mkErr(code, msg) {
    var e = new Error(msg);
    e.code = code;
    return e;
  }

  function list(q) {
    var url = C.CLOUD.API + '/files?q=' + encodeURIComponent(q) +
      '&spaces=drive&fields=' + encodeURIComponent('files(id,name,modifiedTime)') + '&pageSize=10';
    return req(url).then(function (r) { return r.json(); }).then(function (j) { return j.files || []; });
  }

  return {
    mkErr: mkErr,

    findFolder: function (name) {
      return list("name='" + name + "' and mimeType='application/vnd.google-apps.folder' and trashed=false")
        .then(function (f) { return f.length ? f[0].id : ''; });
    },

    createFolder: function (name) {
      return req(C.CLOUD.API + '/files?fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ name: name, mimeType: 'application/vnd.google-apps.folder' })
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    },

    findFile: function (folderId, name) {
      return list("'" + folderId + "' in parents and name='" + name + "' and trashed=false")
        .then(function (f) { return f.length ? f[0].id : ''; });
    },

    read: function (fileId) {
      return req(C.CLOUD.API + '/files/' + encodeURIComponent(fileId) + '?alt=media')
        .then(function (r) { return r.text(); })
        .then(function (t) {
          try { return JSON.parse(t); }
          catch (e) { throw mkErr('bad-file', 'Файл на Диске поврежден и не читается как JSON'); }
        });
    },

    create: function (folderId, name, obj) {
      var b = '-------pp' + U.id('b');
      var meta = { name: name, mimeType: 'application/json', parents: [folderId] };
      var body =
        '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
        '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(obj) +
        '\r\n--' + b + '--';
      return req(C.CLOUD.UPLOAD + '/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Content-Type': 'multipart/related; boundary=' + b },
        body: body
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    },

    update: function (fileId, obj) {
      return req(C.CLOUD.UPLOAD + '/files/' + encodeURIComponent(fileId) + '?uploadType=media&fields=id', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(obj)
      }).then(function (r) { return r.json(); }).then(function (j) { return j.id; });
    }
  };
})();

/* ---------------------------------------------------------------------
   6c. Cloud. Зеркало состояния в файле на Диске.
   Раздел 9.2 ТЗ: четыре точки обмена, фонового опроса нет.
   Раздел 9.4: автоматического слияния нет, при расхождении спрашиваем.
   --------------------------------------------------------------------- */
var Cloud = (function () {
  var st = 'off';        // off | idle | busy | offline | needauth | conflict | error
  var lastError = '';
  var subs = [];
  var pushTimer = null;
  var running = false;
  var askConflict = null; // App подставляет сюда свой вопрос пользователю

  function emit() { subs.forEach(function (fn) { try { fn(st, lastError); } catch (e) {} }); }
  function set(s, err) {
    st = s;
    lastError = err || '';
    emit();
  }

  function cfg() {
    var r = Storage.current();
    return (r && r.settings && r.settings.cloud) || Schema.newSettings().cloud;
  }
  function saveCfg(patch) {
    var k;
    for (k in patch) Storage.setSetting('cloud.' + k, patch[k]);
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' :
      /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac' :
        /Windows/.test(ua) ? 'Windows' : 'браузер';
    var br = /CriOS|Chrome/.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' :
      /Safari/.test(ua) ? 'Safari' : 'браузер';
    return br + ' на ' + os;
  }

  /* Что уходит в облако. Блок настроек синхронизации остается местным:
     у каждого устройства свой номер файла, свой токен и свое состояние. */
  function payload(root, version) {
    var state = U.clone(root);
    delete state.settings.cloud;
    return {
      app: 'poedinok-prep',
      format: 1,
      version: version,
      device: deviceName(),
      savedAt: U.now(),
      state: state
    };
  }

  function unpack(file, localRoot) {
    if (!file || file.app !== 'poedinok-prep' || !file.state) {
      throw Drive.mkErr('bad-file', 'Это не файл приложения «Подготовка к поединку»');
    }
    var next = Schema.migrate(file.state);
    next.settings.cloud = U.clone(localRoot.settings.cloud); // местное не трогаем
    return next;
  }

  /* Чистое решение о том, что делать. Вынесено отдельно, чтобы проверять без сети. */
  function decide(remoteVersion, lastVersion, pendingLocal) {
    if (remoteVersion === null) return 'create';
    if (remoteVersion === lastVersion) return pendingLocal ? 'push' : 'nothing';
    if (remoteVersion > lastVersion) return pendingLocal ? 'ask' : 'pull';
    return 'push'; // в облаке версия старше нашей: наша новее, дописываем
  }

  function ensurePlace() {
    var c = cfg();
    if (c.folderId && c.fileId) return Promise.resolve();
    return Promise.resolve(c.folderId || Drive.findFolder(C.CLOUD.FOLDER))
      .then(function (fid) { return fid || Drive.createFolder(C.CLOUD.FOLDER); })
      .then(function (fid) {
        saveCfg({ folderId: fid });
        return Drive.findFile(fid, C.CLOUD.FILE);
      })
      .then(function (id) { saveCfg({ fileId: id || '' }); });
  }

  function readRemote() {
    var c = cfg();
    if (!c.fileId) return Promise.resolve(null);
    return Drive.read(c.fileId);
  }

  function writeRemote(root, version) {
    var c = cfg();
    var obj = payload(root, version);
    var p = c.fileId ? Drive.update(c.fileId, obj) : Drive.create(c.folderId, C.CLOUD.FILE, obj);
    return p.then(function (id) {
      saveCfg({ fileId: id, lastVersion: version, lastSync: U.now(), pendingLocal: false });
      return version;
    });
  }

  /* Одна попытка обмена. reason: 'open' | 'focus' | 'idle' | 'hide' | 'manual' */
  function sync(reason) {
    var c = cfg();
    if (!c.connected) return Promise.resolve('off');
    if (running) return Promise.resolve('busy');
    if (!navigator.onLine) { set('offline'); return Promise.resolve('offline'); }
    if (!GoogleAuth.has()) { set('needauth'); return Promise.resolve('needauth'); }

    running = true;
    set('busy');
    var root;
    return Storage.load()
      .then(function (r) { root = r; return Storage.flush().catch(function () {}); })
      .then(ensurePlace)
      .then(readRemote)
      .then(function (remote) {
        var c2 = cfg();
        var remoteVersion = remote ? (Number(remote.version) || 0) : null;
        var action = decide(remoteVersion, Number(c2.lastVersion) || 0, !!c2.pendingLocal);

        if (action === 'nothing') { saveCfg({ lastSync: U.now() }); return 'ok'; }
        if (action === 'create') return writeRemote(root, 1).then(function () { return 'ok'; });
        if (action === 'push') return writeRemote(root, (remoteVersion || 0) + 1).then(function () { return 'ok'; });
        if (action === 'pull') {
          var next = unpack(remote, root);
          return Storage.replaceAll(next).then(function () {
            saveCfg({ lastVersion: remoteVersion, lastSync: U.now(), pendingLocal: false });
            return 'pulled';
          });
        }
        // расхождение: молча не решаем, спрашиваем
        set('conflict');
        if (!askConflict) return 'conflict';
        return askConflict({
          remoteVersion: remoteVersion,
          localVersion: Number(c2.lastVersion) || 0,
          device: remote.device || '',
          savedAt: Number(remote.savedAt) || 0
        }).then(function (answer) {
          if (answer === 'remote') {
            var next2 = unpack(remote, root);
            return Storage.replaceAll(next2).then(function () {
              saveCfg({ lastVersion: remoteVersion, lastSync: U.now(), pendingLocal: false });
              return 'pulled';
            });
          }
          if (answer === 'local') {
            return writeRemote(root, remoteVersion + 1).then(function () { return 'ok'; });
          }
          return 'conflict';
        });
      })
      .then(function (res) {
        running = false;
        if (res === 'conflict') set('conflict');
        else set('idle');
        return res;
      })
      .catch(function (e) {
        running = false;
        if (e && e.code === 'offline') set('offline');
        else if (e && e.code === 'needauth') set('needauth');
        else set('error', e && e.message ? e.message : String(e));
        return 'error';
      });
  }

  return {
    decide: decide,
    payload: payload,
    unpack: unpack,
    deviceName: deviceName,

    state: function () { return st; },
    error: function () { return lastError; },
    subscribe: function (fn) { subs.push(fn); return function () { var i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; },
    onConflict: function (fn) { askConflict = fn; },

    connected: function () { return !!cfg().connected; },
    sync: sync,

    /* Первое подключение. Раздел 9.5 ТЗ. */
    connect: function () {
      return GoogleAuth.signIn().then(function () {
        Storage.setSetting('cloud.connected', true);
        Storage.setSetting('cloud.provider', 'google');
        return sync('open');
      });
    },

    signInAgain: function () {
      return GoogleAuth.signIn().then(function () { return sync('manual'); });
    },

    /* Поднять вход после перезагрузки страницы и, если он жив, сразу обменяться. */
    resume: function () {
      return GoogleAuth.restore().then(function (alive) {
        if (!cfg().connected) { set('off'); return 'off'; }
        if (!alive) { set('needauth'); return 'needauth'; }
        return sync('open');
      });
    },

    disconnect: function () {
      GoogleAuth.drop();
      Storage.setSetting('cloud.connected', false);
      Storage.setSetting('cloud.fileId', '');
      Storage.setSetting('cloud.folderId', '');
      Storage.setSetting('cloud.lastVersion', 0);
      Storage.setSetting('cloud.pendingLocal', false);
      set('off');
      return Storage.flush().catch(function () {});
    },

    /* Правка данных: помечаем, что местное ушло вперед, и через 20 секунд
       тишины отправляем. Раздел 9.2, точка 3. */
    touched: function () {
      if (!cfg().connected) return;
      if (!cfg().pendingLocal) Storage.setSetting('cloud.pendingLocal', true);
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        pushTimer = null;
        sync('idle');
      }, C.CLOUD.IDLE_SYNC_MS);
    },

    flushNow: function (reason) {
      if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
      return sync(reason || 'manual');
    }
  };
})();

/* ---------------------------------------------------------------------
   6d. CloudAdapter. Тот же интерфейс, что у LocalAdapter (раздел 4 ТЗ):
   IndexedDB остается основным хранилищем, облако добавляется сверху.
   --------------------------------------------------------------------- */
function makeCloudAdapter(base) {
  return {
    name: 'cloud',
    init: function () { return base.init(); },
    readLocal: function (k) { return base.readLocal(k); },
    writeLocal: function (k, v) { return base.writeLocal(k, v); },
    write: function (batch) {
      return base.write(batch).then(function (r) {
        var onlyCloudMeta = !batch.situations.length && !batch.removed.length && !batch.history.length;
        if (!onlyCloudMeta) Cloud.touched();
        return r;
      });
    },
    replaceAll: function (root) { return base.replaceAll(root); },
    status: function () {
      var s = Cloud.state();
      if (s === 'off') return 'local';
      if (s === 'offline' || s === 'needauth' || s === 'error') return 'cloud-offline';
      return 'cloud-online';
    }
  };
}
/* ---------------------------------------------------------------------
   7. Иконки. Только inline SVG, эмодзи в интерфейсе не используются.
   --------------------------------------------------------------------- */
var Icons = (function () {
  var P = {
    back: '<path d="M15 5l-7 7 7 7"/>',
    chev: '<path d="M9 5l7 7-7 7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
    up: '<path d="M12 19V6M6 12l6-6 6 6"/>',
    down: '<path d="M12 5v13M6 12l6 6 6-6"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
    moon: '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>',
    auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 010 16" fill="currentColor" stroke="none"/>',

var Modal = (function () {
  var node = null, lastFocus = null;

  function close() {
    if (!node) return;
    if (node.parentNode) node.parentNode.removeChild(node);
    node = null;
    document.removeEventListener('keydown', onKey, true);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); if (cur && cur.onCancel) cur.onCancel(); }
  }
  var cur = null;

  /* opts = { title, html, actions:[{label, kind, value}], onCancel }
     Возвращает промис со значением нажатой кнопки или null. */
  function open(opts) {
    close();
    cur = opts;
    lastFocus = document.activeElement;
    return new Promise(function (resolve) {
      node = document.createElement('div');
      node.className = 'modal';
      node.setAttribute('role', 'dialog');
      node.setAttribute('aria-modal', 'true');
      var acts = (opts.actions || []).map(function (a, i) {
        return '<button class="btn ' + (a.kind || '') + '" data-i="' + i + '">' + U.esc(a.label) + '</button>';
      }).join('');
      node.innerHTML =
        '<div class="modal-bg" data-close="1"></div>' +
        '<div class="modal-w">' +
        (opts.title ? '<h2>' + U.esc(opts.title) + '</h2>' : '') +
        '<div class="modal-body">' + (opts.html || '') + '</div>' +
        '<div class="modal-acts">' + acts + '</div>' +
        '</div>';
      document.body.appendChild(node);
      document.addEventListener('keydown', onKey, true);

      node.addEventListener('click', function (e) {
        var t = e.target;
        if (t.closest && t.closest('[data-close]')) { close(); resolve(null); return; }
        var b = t.closest ? t.closest('[data-i]') : null;
        if (b) {
          var a = opts.actions[Number(b.getAttribute('data-i'))];
          var val = a.value;
          if (a.collect) val = a.collect(node);
          close();
          resolve(val === undefined ? null : val);
        }
      });
      var first = node.querySelector('.modal-w input, .modal-w textarea, .modal-w button');
      if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 30);
    });
  }

  return {
    open: open,
    close: close,
    /* Подтверждение деструктивного действия с названием объекта. Раздел 11 ТЗ. */
    confirm: function (title, text, okLabel) {
      return open({
        title: title,
        html: '<p class="pre">' + U.esc(text) + '</p>',
        actions: [
          { label: 'Отмена', value: false },
          { label: okLabel || 'Удалить', kind: 'btn-danger', value: true }
        ]
      }).then(function (v) { return v === true; });
    },
    prompt: function (title, label, value, okLabel) {
      return open({
        title: title,
        html: '<div class="field"><label class="label" for="m-inp">' + U.esc(label) + '</label>' +
          '<input type="text" id="m-inp" value="' + U.esc(value || '') + '"></div>',
        actions: [
          { label: 'Отмена', value: null },
          {
            label: okLabel || 'Сохранить', kind: 'btn-primary',
            collect: function (n) { return n.querySelector('#m-inp').value.trim(); }
          }
        ]
      });
    }
  };
})();

/* ---------------------------------------------------------------------
   9. Роли: порядок и разбор из текста ситуации
   --------------------------------------------------------------------- */
var Roles = {
  /* Порядок показа: трудные роли первыми, остальные по полю order.
     Раздел 5.4 ТЗ: если положительного героя не удается найти именно
     в трудной роли, вся подготовка стоит на песке. */
  sorted: function (roles) {
    return (roles || []).slice().sort(function (a, b) {
      if (!!a.hard !== !!b.hard) return a.hard ? -1 : 1;
      return (a.order || 0) - (b.order || 0);
    });
  },

  renumber: function (roles) {
    roles.forEach(function (r, i) { r.order = i + 1; });
    return roles;
  },

  nameOf: function (r) {
    return (r && String(r.name || '').trim()) || 'Роль без названия';
  },

  /* Разбор блока ролей из вставленного текста ситуации.
     Формат исходников: строка со словом "Роли", ниже по строке на роль,
     название и интересы разделены тире или двоеточием.
     Результат всегда показывается на правку и никогда не применяется молча. */
  parse: function (text) {
    var lines = String(text || '').split(/\r?\n/);
    var start = -1;
    for (var i = 0; i < lines.length; i++) {
      // граница слова тут не годится: в JS она считается только по латинице
      if (/^\s*роли(\s|:|$)/i.test(lines[i])) { start = i + 1; break; }
    }
    if (start < 0) return { found: false, roles: [] };

    var out = [];
    for (var j = start; j < lines.length; j++) {
      var t = lines[j].trim();
      if (!t) { if (out.length) break; else continue; }
      // – короткое тире, — длинное тире: в исходниках ситуаций встречаются оба
      t = t.replace(/^[•*]+\s*/, '').replace(/^\d+[.)]\s*/, '').replace(/^[-–—]\s+/, '');
      if (!t) continue;
      var m = t.match(/^(.{1,90}?)\s*[—–:]\s*(.+)$/) || t.match(/^(.{1,90}?)\s+-\s+(.+)$/);
      var name = m ? m[1].trim() : t;
      var interest = m ? m[2].trim() : '';
      name = name.replace(/[.,;:]+$/, '').trim();
      if (!name) continue;
      out.push({ name: name, interest: interest });
      if (out.length >= 40) break;
    }
    return { found: out.length > 0, roles: out };
  }
};

/* ---------------------------------------------------------------------
   10. Архив: сборка файла, слияние при импорте
   --------------------------------------------------------------------- */
var Archive = {
  fileName: function () { return 'poedinok-prep-' + U.dateFile() + '.json'; },

  download: function (root) {
    var text = JSON.stringify(root, null, 2);
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = Archive.fileName();
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 400);
  },

  /* Слияние: настройки остаются местными, совпадающие id получают новые.
     Раздел 8 ТЗ. Чистая функция: хранилище о слиянии не знает. */
  merge: function (current, incoming) {
    var out = U.clone(current);
    var usedS = {};
    out.situations.forEach(function (s) { usedS[s.id] = 1; });
    var usedF = {};
    out.formulaLibrary.forEach(function (f) { usedF[f.id] = 1; });

    incoming.situations.forEach(function (s) {
      var c = U.clone(s);
      if (usedS[c.id]) c.id = U.id('s_');
      usedS[c.id] = 1;
      out.situations.push(c);
    });
    (incoming.formulaLibrary || []).forEach(function (f) {
      var c = U.clone(f);
      if (usedF[c.id]) c.id = U.id('f_');
      usedF[c.id] = 1;
      out.formulaLibrary.push(c);
    });
    return out;
  },

  readFile: function (file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        try { resolve(JSON.parse(String(fr.result))); }
        catch (e) { reject(new Error('Файл не является корректным JSON')); }
      };
      fr.onerror = function () { reject(new Error('Не удалось прочитать файл')); };
      fr.readAsText(file);
    });
  }
};
