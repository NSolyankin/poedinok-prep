          return m.word.toLowerCase() === w.toLowerCase() && m.layer === layer.id && String(m.text || '').trim();
        });
        return '<button class="chip' + (has ? ' on' : '') + '" data-act="word" data-i="' + i + '" data-word="' + U.esc(w) + '">' + U.esc(w) + '</button>';
      }).join('');

      // уже записанные значения слов в этом слое
      var wms = p.wordMeanings.map(function (m, k) {
        if (m.layer !== layer.id) return '';
        return '<div class="reading"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
          '<span class="wtag">' + U.esc(m.word) + '</span>' +
          '<textarea rows="1" data-field="' + base + '.wordMeanings.' + k + '.text" placeholder="Что значит это слово в слое «' + U.esc(layer.name) + '»">' + U.esc(m.text) + '</textarea>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-wm" data-i="' + i + '" data-k="' + k + '" title="Убрать" aria-label="Убрать">' + Icons('trash') + '</button>' +
          '</div></div>';
      }).join('');

      return '<div class="card phrase' + (silent ? ' ph-silent' : '') + '">' +
        '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
        '<span class="pnum' + (passed ? ' done' : '') + '">' + (i + 1) + '</span>' +
        '<div class="pq">' + U.esc(p.quote || 'фраза без цитаты') + '</div>' +
        '</div>' +
        (silent ? '' :
          '<div class="field" style="margin:10px 0 8px">' +
          '<textarea rows="2" ' + (rd ? 'data-field="' + base + '.readings.' + rIdx + '.text"' : 'data-pass="' + i + '" data-pass-kind="text"') +
          ' placeholder="Как фраза читается в слое «' + U.esc(layer.name) + '»">' + U.esc(rd ? rd.text : '') + '</textarea>' +
          '<textarea rows="1" ' + (rd ? 'data-field="' + base + '.readings.' + rIdx + '.use"' : 'data-pass="' + i + '" data-pass-kind="use"') +
          ' placeholder="Что это дает в переговорах">' + U.esc(rd ? rd.use : '') + '</textarea>' +
          '</div>' +
          '<div class="label" style="font-weight:600">Слова</div>' +
          '<div class="hint">Нажмите слово, чтобы записать его значение в этом слое.</div>' +
          '<div class="chips" style="margin-bottom:6px">' + chips + '</div>' + wms) +
        '<label class="chk' + (silent ? ' on' : '') + '" style="margin-top:8px"><input type="checkbox" data-check="silent" data-i="' + i + '"' + (silent ? ' checked' : '') + '>' +
        'в этом слое фраза не звучит</label>' +
        '</div>';
    }).join('');

    var doneCount = s2.phrases.filter(function (p) { return Schema.passedInLayer(p, layer.id); }).length;
    var nextLayer = null;
    for (var li = 0; li < C.LAYERS.length; li++) {
      if (C.LAYERS[li].id !== layer.id &&
        s2.phrases.some(function (p) { return !Schema.passedInLayer(p, C.LAYERS[li].id); })) { nextLayer = C.LAYERS[li]; break; }
    }

    return tabsHtml +
      '<details class="det"><summary>Слой «' + U.esc(layer.name) + '»: что это</summary><div class="det-b">' + U.esc(layer.about) + '</div></details>' +
      '<div class="muted" style="margin:0 0 10px">Пройдено фраз в этом слое: ' + doneCount + ' из ' + s2.phrases.length + '.</div>' +
      cards +
      (doneCount === s2.phrases.length && nextLayer
        ? '<div class="row row-end"><button class="btn btn-primary" data-act="s2layer" data-id="' + nextLayer.id + '">Слой пройден, дальше: ' + U.esc(nextLayer.name) + '</button></div>'
        : '');
  }

  /* ---- свод по одной фразе: все семь слоев сразу ----
     Прогон разносит работу по слоям, а здесь она собирается обратно:
     одно предложение и весь его разбор в одном месте, чтобы ничего не потерять. */
  function step2One(s2, phraseIdx) {
    if (!s2.phrases.length) {
      return '<div class="empty">Фраз пока нет.<br>Нажмите «Нарезать текст на фразы» или выделите кусок текста выше.</div>';
    }
    var i = Math.min(Math.max(Number(phraseIdx) || 0, 0), s2.phrases.length - 1);
    var p = s2.phrases[i];
    var base = 'step2.phrases.' + i;
    var nLayers = C.LAYERS.length;

    // лента фраз с прогрессом по слоям у каждой
    var bar = '<div class="roles-bar">' + s2.phrases.map(function (x, k) {
      var done = C.LAYERS.filter(function (l) { return Schema.passedInLayer(x, l.id); }).length;
      return '<button class="role-tab' + (k === i ? ' on' : '') + '" data-act="s2one" data-i="' + k + '" ' +
        'title="' + U.esc(U.cut(String(x.quote || ''), C.QUOTE_PREVIEW)) + '">' +
        '<span class="dot' + (done === nLayers ? ' filled' : '') + '"></span>' +
        '<span class="nm">' + (k + 1) + '</span>' +
        '<span class="muted" style="font-size:11px">' + done + '/' + nLayers + '</span>' +
        '</button>';
    }).join('') + '</div>';

    var blocks = C.LAYERS.map(function (l) {
      var silent = (p.silent || []).indexOf(l.id) >= 0;

      var rn = 0, rds = '';
      p.readings.forEach(function (r, j) {
        if (r.layer !== l.id) return;
        if (String(r.text || '').trim()) rn++;
        var rb = base + '.readings.' + j;
        rds += '<div class="reading">' +
          '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
          '<textarea rows="2" data-field="' + rb + '.text" placeholder="Как фраза читается в слое «' + U.esc(l.name) + '»">' + U.esc(r.text) + '</textarea>' +
          '<button class="btn btn-ghost btn-icon' + (r.starred ? ' starred' : '') + '" data-act="star" data-i="' + i + '" data-j="' + j +
          '" title="Отметить главной" aria-label="Отметить главной">' + Icons(r.starred ? 'star_on' : 'star') + '</button>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-reading" data-i="' + i + '" data-j="' + j +
          '" title="Удалить трактовку" aria-label="Удалить трактовку">' + Icons('trash') + '</button>' +
          '</div>' +
          '<textarea rows="1" data-field="' + rb + '.use" placeholder="Что это дает в переговорах">' + U.esc(r.use) + '</textarea>' +
          '</div>';
      });

      var wn = 0, wms = '';
      p.wordMeanings.forEach(function (m, k) {
        if (m.layer !== l.id) return;
        if (String(m.text || '').trim()) wn++;
        wms += '<div class="reading"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
          '<span class="wtag">' + U.esc(m.word) + '</span>' +
          '<textarea rows="1" data-field="' + base + '.wordMeanings.' + k + '.text" placeholder="Что значит это слово в слое «' + U.esc(l.name) + '»">' + U.esc(m.text) + '</textarea>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-wm" data-i="' + i + '" data-k="' + k +
          '" title="Убрать" aria-label="Убрать">' + Icons('trash') + '</button>' +
          '</div></div>';
      });

      var status = silent
        ? 'в этом слое фраза не звучит'
        : (rn + wn ? 'трактовок ' + rn + ', слов ' + wn : 'не разобрано');
      var cls = silent ? ' lb-sil' : (rn + wn ? '' : ' lb-idle');

      return '<div class="lblock' + cls + '">' +
        '<div class="lb-h"><b>' + U.esc(l.name) + '</b><span class="st">' + status + '</span></div>' +
        (silent ? '' :
          (rds || '<div class="muted" style="margin-bottom:8px">Трактовки в этом слое нет.</div>') +
          (wms ? '<div class="label" style="margin-top:6px">Слова</div>' + wms : '') +
          '<div class="row">' +
          '<button class="btn btn-sm" data-act="add-reading-l" data-i="' + i + '" data-layer="' + l.id + '">' + Icons('plus', 16) + 'Трактовку</button>' +
          '<button class="btn btn-sm" data-act="go-layer" data-i="' + i + '" data-layer="' + l.id + '">Разобрать слова в прогоне</button>' +
          '</div>') +
        '<label class="chk' + (silent ? ' on' : '') + '" style="margin-top:8px">' +
        '<input type="checkbox" data-check="silent1" data-i="' + i + '" data-layer="' + l.id + '"' + (silent ? ' checked' : '') + '>' +
        'в этом слое фраза не звучит</label>' +
        '</div>';
    }).join('');

    var done = C.LAYERS.filter(function (l) { return Schema.passedInLayer(p, l.id); }).length;

    return bar +
      '<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:center;margin-bottom:8px">' +
      '<button class="btn btn-sm" data-act="s2one" data-i="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>Предыдущая</button>' +
      '<span class="muted" style="font-size:13px">Фраза ' + (i + 1) + ' из ' + s2.phrases.length + '</span>' +
      '<button class="btn btn-sm" data-act="s2one" data-i="' + (i + 1) + '"' + (i === s2.phrases.length - 1 ? ' disabled' : '') + '>Следующая</button>' +
      '</div>' +
      '<div class="one-q">' + U.esc(p.quote || 'фраза без цитаты') + '</div>' +
      (p.purpose ? '' : '<div class="hint" style="margin-top:8px">Зачем эта фраза в тексте, стоит записать: это половина смысла разбора.</div>') +
      (Express.on() ? '' :
        '<div class="field" style="margin-top:10px"><span class="label">Зачем эта фраза в тексте</span>' +
        '<textarea rows="2" data-field="' + base + '.purpose" placeholder="Смысл и причина существования фразы">' + U.esc(p.purpose) + '</textarea></div>') +
      '<div class="muted" style="margin:0 0 10px">Пройдено слоев по этой фразе: ' + done + ' из ' + nLayers + '.</div>' +
      blocks;
  }

  function step2Matrix(s2) {
    var usedCount = 0;
    var cols = C.LAYERS.map(function (l) {
      var used = s2.phrases.some(function (p) { return p.layers.indexOf(l.id) >= 0; });
      if (used) usedCount++;
      return '<th class="' + (used ? '' : 'idle') + '" title="' + U.esc(l.name) + '">' + U.esc(l.short) + '</th>';
    }).join('');

    var rows = s2.phrases.map(function (p, i) {
      var q = String(p.quote || '').trim();
      var cells = C.LAYERS.map(function (l) {
        var r = p.readings.filter(function (x) { return x.layer === l.id && String(x.text || '').trim(); });
        var wm = p.wordMeanings.filter(function (x) { return x.layer === l.id && String(x.text || '').trim(); });
        var total = r.length + wm.length;
        var silent = (p.silent || []).indexOf(l.id) >= 0;
        var tip = r.map(function (x) { return x.text; })
          .concat(wm.map(function (x) { return x.word + ': ' + x.text; })).join(' | ');
        if (total > 0) {
          return '<td class="on" title="' + U.esc(tip) + '">' + (total > 1 ? total : Icons('check', 14)) + '</td>';
        }
        return '<td' + (silent ? ' class="sil" title="Отмечено: в этом слое фраза не звучит"' : '') + '>' + (silent ? '&middot;' : '') + '</td>';
      }).join('');
      return '<tr><td class="qcell">' +
        '<button class="linkq" data-act="s2one" data-i="' + i + '" title="Открыть разбор этой фразы по всем слоям">' +
        '<span class="pnum">' + (i + 1) + '</span> ' +
        U.esc(q.length > C.QUOTE_PREVIEW ? U.cut(q, C.QUOTE_PREVIEW) + '...' : (q || 'без цитаты')) +
        '</button></td>' + cells + '</tr>';
    }).join('');

    var notes = Express.on() ? '' : C.LAYERS.map(function (l) {
      return '<div class="field">' +
        '<details class="det"><summary>' + U.esc(l.name) + '</summary><div class="det-b">' + U.esc(l.about) + '</div></details>' +
        '<textarea rows="2" data-field="step2.layerNotes.' + l.id + '" placeholder="Что в этой ситуации относится к слою">' +
        U.esc(s2.layerNotes[l.id]) + '</textarea></div>';
    }).join('');

    return '<div class="muted" style="margin:4px 0 10px">Задействовано слоев: ' + usedCount + ' из ' + C.LAYERS.length +
      '. Пустой столбец означает слой, который вы не тронули ни разу. Нажатие на фразу открывает ее разбор по всем слоям.</div>' +
      (s2.phrases.length
        ? '<div class="mx-wrap"><table class="mx"><thead><tr><th class="qcell">Фраза</th>' + cols + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">Фраз пока нет, матрица пуста.</div>') +
      '<div class="sep"></div><h3 style="margin-bottom:4px">Заметки по слоям</h3>' +
      '<div class="hint">Нажмите на название слоя, чтобы увидеть, что он означает.</div>' + notes;
  }

  function step3Body(sit, role) {
    var d = Schema.step3ForRole(sit, role.id);
    var asms = d.assumptions.map(function (a, i) {
      var susp = !a.necessary && !a.sufficient;
      return '<div class="asm' + (susp ? ' susp' : '') + '" data-asm="' + a.id + '">' +
        '<div class="row" style="flex-wrap:nowrap;align-items:flex-start">' +
        '<textarea rows="2" data-field="step3.byRole.' + role.id + '.assumptions.' + i + '.text" placeholder="Минимальная вводная">' + U.esc(a.text) + '</textarea>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-asm" data-id="' + a.id + '" title="Удалить вводную" aria-label="Удалить вводную">' + Icons('trash') + '</button>' +
        '</div>' +
        '<div class="row" style="margin-top:8px">' +
        '<label class="chk' + (a.necessary ? ' on' : '') + '"><input type="checkbox" data-check="necessary" data-i="' + i + '"' + (a.necessary ? ' checked' : '') + '>необходима</label>' +
        '<label class="chk' + (a.sufficient ? ' on' : '') + '"><input type="checkbox" data-check="sufficient" data-i="' + i + '"' + (a.sufficient ? ' checked' : '') + '>достаточна</label>' +
        '</div>' +
        '<div class="asm-warn"' + (susp ? '' : ' hidden') + '>' + Icons('alert', 15) + 'Ни одной отметки: вводная подозрительна</div>' +
        '</div>';
    }).join('');

    return (role.interest ? '<div class="det-b" style="padding:0 0 12px"><b>Интересы роли:</b> ' + U.esc(role.interest) + '</div>' : '') +
      field('Как эта роль выглядит положительным героем', '',
        '<textarea rows="5" data-field="step3.byRole.' + role.id + '.heroVersion" placeholder="Положительный герой в этой роли">' + U.esc(d.heroVersion) + '</textarea>',
        'step3.byRole.' + role.id + '.heroVersion') +
      copyFrom(sit, role.id, 'hero') +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Вводные</h3>' +
      '<div class="hint">Минимальные, необходимые и достаточные. Вводная без обеих отметок помечается как подозрительная.</div>' +
      (asms || '<div class="muted" style="margin-bottom:12px">Вводных пока нет.</div>') +
      '<div class="row"><button class="btn" data-act="add-asm">' + Icons('plus') + 'Добавить вводную</button></div>';
  }

  /* ---------------- шаг 9: стратегия связанных раундов ---------------- */

  function roundRibbon(sit, active) {
    var rs = sit.step9.rounds;
    var parts = [];
    rs.forEach(function (r, i) {
      var goal = String(r.goal || '').trim();
      parts.push('<button class="rnd' + (i === active ? ' on' : '') + '" data-act="round" data-i="' + i + '">' +
        '<div class="rn">Раунд ' + r.n + '</div>' +
        '<div class="rg' + (goal ? '' : ' no') + '">' + U.esc(goal ? U.cut(goal, 60) + (U.len(goal) > 60 ? '...' : '') : 'цель не записана') + '</div>' +
        '</button>');
      if (i < rs.length - 1) {
        var linked = Schema.roundLinked(rs, i);
        parts.push('<div class="link' + (linked ? '' : ' brk') + '" title="' +
          (linked ? 'связка есть' : 'связки нет: лента рвется') + '">' +
          Icons(linked ? 'arrow' : 'broken', 22) + '</div>');
      }
    });
    return '<div class="ribbon">' + parts.join('') + '</div>';
  }

  function step9Head(sit) {
    var p = Schema.step9Progress(sit);
    return '<span class="muted" data-r-done="1">раундов ' + p.total + ', с целью ' + p.goals +
      (p.breaks ? ', разрывов ленты ' + p.breaks : ', лента цела') + '</span>';
  }

  function step9Body(sit, view, settings) {
    Schema.ensureStep9(sit, settings.roundsCount);
    var rs = sit.step9.rounds;
    var i = Math.min(Math.max(Number(view.round) || 0, 0), rs.length - 1);
    var r = rs[i];
    var last = i === rs.length - 1;
    var roles = Roles.sorted(sit.roles);
    var opts = '<option value="">роль не выбрана</option>' + roles.map(function (x) {
      return '<option value="' + x.id + '"' + (r.myRoleId === x.id ? ' selected' : '') + '>' + U.esc(Roles.nameOf(x)) + '</option>';
    }).join('');
    var cnt = [];
    for (var k = C.ROUNDS_MIN; k <= C.ROUNDS_MAX; k++) {
      cnt.push('<option value="' + k + '"' + (rs.length === k ? ' selected' : '') + '>' + k + '</option>');
    }

    return '<div class="hint">Раунды связаны: то, чем кончился один, становится входом следующего. Раунд без связки рвет ленту - это и есть отсутствие стратегии, а не мелкая недоделка.</div>' +
      field('Общая стратегия', 'Куда ведет вся цепочка раундов.',
        '<textarea rows="3" data-field="step9.strategy" placeholder="Чего добиваюсь всей цепочкой">' + U.esc(sit.step9.strategy) + '</textarea>', 'step9.strategy') +
      '<div class="row" style="margin:0 0 8px">' +
      '<span class="label" style="margin:0">Раундов</span>' +
      '<select class="lsel" data-rcount="1" aria-label="Число раундов">' + cnt.join('') + '</select>' +
      '<span class="spacer"></span><span id="s9-head">' + step9Head(sit) + '</span>' +
      '</div>' +
      roundRibbon(sit, i) +
      '<div class="cellbox">' +
      '<h4>Раунд ' + r.n + ' из ' + rs.length + '</h4>' +
      field('Моя роль в этом раунде', 'Роли назначает соперник, но готовиться надо к той, которую ждете.',
        '<select class="lsel" data-rrole="' + i + '" aria-label="Роль в раунде">' + opts + '</select>') +
      field('Цель раунда', 'Чего добиваюсь именно здесь.',
        '<textarea rows="3" data-field="step9.rounds.' + i + '.goal" placeholder="Цель этого раунда">' + U.esc(r.goal) + '</textarea>', 'step9.rounds.' + i + '.goal') +
      (last
        ? '<div class="det-b" style="padding:0 0 12px">Это последний раунд: связку с ним никто не спрашивает, дальше ничего нет.</div>'
        : field('Связка со следующим раундом', 'С чем я выхожу из этого раунда и вхожу в следующий.',
          '<textarea rows="3" data-field="step9.rounds.' + i + '.carryOver" placeholder="Что переношу дальше">' + U.esc(r.carryOver) + '</textarea>')) +
      (Express.on() ? '' :
        field('Что если не выйдет', 'Запасной ход, когда раунд пошел не так.',
          '<textarea rows="3" data-field="step9.rounds.' + i + '.ifFails" placeholder="Запасной ход">' + U.esc(r.ifFails) + '</textarea>')) +
      '</div>';
  }

  /* ---------------- вопросы секунданта ---------------- */

  function questionsBody(sit) {
    var list = sit.secondQuestions;
    var open = Schema.openQuestions(sit).length;
    var body = list.map(function (q, i) {
      var has = String(q.text || '').trim();
      var cls = !has ? '' : (q.confident ? ' ok' : ' open');
      return '<div class="qst' + cls + '" data-q="' + q.id + '">' +
        '<div class="csq-h">' +
        '<span class="chip">' + (q.author === 'second' ? 'от секунданта' : 'свой') + '</span>' +
        '<span class="spacer"></span>' +
        '<label class="chk' + (q.confident ? ' on' : '') + '">' +
        '<input type="checkbox" data-check="confident" data-i="' + i + '"' + (q.confident ? ' checked' : '') + '>отвечаю уверенно</label>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-q" data-id="' + q.id +
        '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button>' +
        '</div>' +
        '<textarea rows="2" data-field="secondQuestions.' + i + '.text" placeholder="Вопрос">' + U.esc(q.text) + '</textarea>' +
        '<div class="thr-sub">Ответ</div>' +
        '<textarea rows="2" data-field="secondQuestions.' + i + '.answer" placeholder="Что отвечаю">' + U.esc(q.answer) + '</textarea>' +
        '</div>';
    }).join('');

    return '<div class="hint">Вопросы записываете вы: свои при самопроверке и те, что задал секундант при разборе. Приложение не подсказывает вопросов и не предлагает шаблонов: универсальный вопрос либо повторяет шаг 1, либо бесполезен.</div>' +
      '<div class="row" style="margin:0 0 12px"><span class="muted" data-q-done="1">вопросов ' + list.length +
      ', без уверенного ответа ' + open + '</span></div>' +
      (body || '<div class="muted" style="margin:0 0 12px">Вопросов пока нет.</div>') +
      '<div class="row">' +
      '<button class="btn" data-act="add-q" data-author="self">' + Icons('plus') + 'Свой вопрос</button>' +
      '<button class="btn" data-act="add-q" data-author="second">' + Icons('plus') + 'Вопрос секунданта</button>' +
      '</div>';
  }

  /* ---------------- комментарии к полям ---------------- */

  function commentsBody(sit) {
    var groups = Comments.grouped(sit);
    var open = Comments.open(sit).length;
    var body = groups.map(function (g) {
      var items = g.items.map(function (c) {
        var i = sit.comments.indexOf(c);
        return '<div class="cmt' + (c.resolved ? ' res' : '') + '" data-cmt="' + c.id + '">' +
          '<div class="csq-h">' +
          '<span class="chip">' + (c.author === 'second' ? 'от секунданта' : 'свой') + '</span>' +
          '<span class="muted">' + U.dateShort(c.ts) + '</span>' +
          '<span class="spacer"></span>' +
          '<label class="chk' + (c.resolved ? ' on' : '') + '">' +
          '<input type="checkbox" data-check="resolved" data-i="' + i + '"' + (c.resolved ? ' checked' : '') + '>снято</label>' +
          '<button class="btn btn-ghost btn-icon" data-act="del-cmt" data-id="' + c.id +
          '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button>' +
          '</div>' +
          '<textarea rows="2" data-field="comments.' + i + '.text" placeholder="Возражение">' + U.esc(c.text) + '</textarea>' +
          '</div>';
      }).join('');
      return '<div class="cmt-g"><div class="h"><b>' + U.esc(g.place.label) + '</b>' +
        '<button class="btn btn-sm" data-act="go-step" data-sec="' + g.place.sec + '">к полю</button></div>' +
        items + '</div>';
    }).join('');

    return '<div class="hint">Секундант не правит ваши формулировки, он их оспаривает. Возражение висит на конкретном поле, а не на ситуации вообще. В приложение секундант не заходит: записываете вы, с его слов.</div>' +
      '<div class="row" style="margin:0 0 12px"><span class="muted" data-c-open="1">возражений ' +
      (sit.comments || []).length + ', открытых ' + open + '</span></div>' +
      (body || '<div class="muted" style="margin:0 0 12px">Возражений пока нет. Точка стоит рядом с названием поля: нажмите ее там, где секундант возразил.</div>');
  }

  /* ---------------- шаг 5: судья, решение и последствия ---------------- */

  function csqCard(sit, nd, path, i, nodes) {
    var coords = C.COORDS.map(function (c) {
      var on = nd.coord.indexOf(c.id) >= 0;
      return '<button class="csq-c' + (on ? ' on' : '') + '" data-act="coord" data-id="' + nd.id +
        '" data-coord="' + c.id + '" title="Координата: ' + U.esc(c.name) + '" aria-pressed="' + (on ? 'true' : 'false') +
        '">' + c.letter + '</button>';
    }).join('');
    var hor = C.HORIZONS.map(function (h) {
      return '<option value="' + h.id + '"' + (nd.horizon === h.id ? ' selected' : '') + '>' + U.esc(h.name) + '</option>';
    }).join('');
    var sign = nd.sign === 'plus' ? 'plus' : 'minus';
    var signShort = '';
    C.SIGNS.forEach(function (x) { if (x.id === sign) signShort = x.short; });
    var canAdd = Schema.canBranch(nodes, nd);
    return '<div class="csq ' + sign + '" data-csq="' + nd.id + '">' +
      '<div class="csq-h">' +
      '<button class="csq-s ' + sign + '" data-act="csq-sign" data-id="' + nd.id +
      '" title="Знак: ' + (sign === 'plus' ? 'положительное' : 'отрицательное') + '">' + signShort + '</button>' +
      '<select class="lsel" data-chor="' + nd.id + '" aria-label="Горизонт">' + hor + '</select>' +
      coords +
      '<span class="spacer"></span>' +
      (canAdd ? '<button class="btn btn-sm" data-act="csq-add" data-id="' + nd.id + '">Следствие</button>' : '') +
      '<button class="btn btn-ghost btn-icon" data-act="csq-del" data-id="' + nd.id +
      '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button>' +
      '</div>' +
      '<textarea rows="2" data-field="' + path + '.' + i + '.text" placeholder="Что из этого следует">' + U.esc(nd.text) + '</textarea>' +
      '</div>';
  }

  /* Список с отступами: узел, под ним его следствия со сдвигом. */
  function csqBranch(sit, nodes, parentId, indexOf) {
    var kids = Schema.childrenOf(nodes, parentId);
    if (!kids.length) return '';
    var body = kids.map(function (nd) {
      return csqCard(sit, nd, 'step5.consequences.nodes', indexOf[nd.id], nodes) +
        csqBranch(sit, nodes, nd.id, indexOf);
    }).join('');
    return parentId ? '<div class="tree-lvl">' + body + '</div>' : body;
  }

  /* Компактная схема. Рисуется тем же деревом, что и список: цвет
     означает знак, буквы справа - координаты, под текстом горизонт. */
  function csqScheme(sit, nodes) {
    var W = 250, H = 46, GAP_X = 26, GAP_Y = 14, PAD = 12;
    var rows = [];
    var walk = function (parentId, depth) {
      Schema.childrenOf(nodes, parentId).forEach(function (nd) {
        rows.push({ node: nd, depth: depth });
        walk(nd.id, depth + 1);
      });
    };
    walk(null, 1);
    if (!rows.length) return '';
    var maxDepth = rows.reduce(function (a, r) { return Math.max(a, r.depth); }, 0);
    var width = PAD * 2 + (maxDepth + 1) * (W + GAP_X) - GAP_X;
    var height = PAD * 2 + (rows.length + 1) * (H + GAP_Y) - GAP_Y;
    var yOf = {}, i;
    var box = function (x, y, w, h, cls, title, sub, tags) {
      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" class="' + cls + '"/>' +
        '<text x="' + (x + 10) + '" y="' + (y + 19) + '" class="sch-t">' +
        U.esc(U.cut(title, 34)) + (U.len(title) > 34 ? '&#8230;' : '') + '</text>' +
        '<text x="' + (x + 10) + '" y="' + (y + 35) + '" class="sch-s">' + U.esc(sub) + '</text>' +
        (tags ? '<text x="' + (x + w - 10) + '" y="' + (y + 35) + '" class="sch-g" text-anchor="end">' + U.esc(tags) + '</text>' : '');
    };
    var out = '';
    var rootY = PAD;
    out += box(PAD, rootY, W, H, 'sch-root', String(sit.step5.decision || '').trim() || 'решение не записано', 'решение', '');
    rows.forEach(function (r, k) {
      var x = PAD + r.depth * (W + GAP_X);
      var y = PAD + (k + 1) * (H + GAP_Y);
      yOf[r.node.id] = { x: x, y: y };
      var px = r.node.parent ? yOf[r.node.parent].x + W : PAD + W;
      var py = r.node.parent ? yOf[r.node.parent].y + H / 2 : rootY + H / 2;
      out += '<path d="M' + px + ' ' + py + ' C' + (px + GAP_X / 2) + ' ' + py + ',' +
        (x - GAP_X / 2) + ' ' + (y + H / 2) + ',' + x + ' ' + (y + H / 2) + '" class="sch-l"/>';
      var tags = r.node.coord.map(function (c) {
        var L = '';
        C.COORDS.forEach(function (z) { if (z.id === c) L = z.letter; });
        return L;
      }).join(' ');
      var hn = '';
      C.HORIZONS.forEach(function (h) { if (h.id === r.node.horizon) hn = h.name; });
      out += box(x, y, W, H, 'sch-b ' + (r.node.sign === 'plus' ? 'p' : 'm'),
        String(r.node.text || '').trim() || 'без текста', hn, tags);
    });
    return '<div class="scheme"><svg viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height +
      '" role="img" aria-label="Схема последствий">' + out + '</svg></div>';
  }

  function step5Head(sit) {
    var st = Schema.treeStats(sit);
    return '<span class="muted" data-n-done="1">последствий ' + st.filled + ' из ' + C.TREE_NODES_GREEN +
      ' нужных' + (st.filled ? ', плюс ' + st.plus + ', минус ' + st.minus +
        ', близких ' + st.near + ', отдаленных ' + st.far : '') + '</span>';
  }

  function step5Body(sit, view) {
    var s5 = Schema.ensureStep5(sit);
    var nodes = s5.consequences.nodes;
    var indexOf = {};
    nodes.forEach(function (nd, i) { indexOf[nd.id] = i; });
    var top = Schema.childrenOf(nodes, null);
    var canAddTop = top.length < C.TREE_KIDS_MAX;
    var pm = s5.consequences.premortem.map(function (m, i) {
      return '<div class="pm" data-pm="' + m.id + '">' +
        '<div class="csq-h"><b style="font-size:14px">Решение провалилось, потому что</b><span class="spacer"></span>' +
        '<button class="btn btn-ghost btn-icon" data-act="del-pm" data-id="' + m.id +
        '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button></div>' +
        '<textarea rows="2" data-field="step5.consequences.premortem.' + i + '.text" placeholder="Почему оно провалилось">' + U.esc(m.text) + '</textarea>' +
        (Express.on() ? '' :
          '<div class="thr-sub">Что делаю заранее</div>' +
          '<textarea rows="2" data-field="step5.consequences.premortem.' + i + '.counter" placeholder="Упреждающее действие">' + U.esc(m.counter) + '</textarea>') +
        '</div>';
    }).join('');

    return '<div class="hint">Мировой судья это не участник спора, а тот, кто смотрит со стороны и не заинтересован в исходе. Сначала его позиция, потом решение, потом то, что из решения следует.</div>' +
      (Express.on() ? '' :
        field('Что сказал бы мировой судья', 'Взгляд со стороны, без вашей заинтересованности.',
          '<textarea rows="4" data-field="step5.judgeStatement" placeholder="Позиция мирового судьи">' + U.esc(s5.judgeStatement) + '</textarea>')) +
      field('Критерий', 'По чему видно, что решение правильное.',
        '<textarea rows="3" data-field="step5.criteria" placeholder="Как я пойму, что оно верное">' + U.esc(s5.criteria) + '</textarea>', 'step5.criteria') +
      field('Решение', 'Из него растет дерево последствий.',
        '<textarea rows="3" data-field="step5.decision" placeholder="Что я решаю">' + U.esc(s5.decision) + '</textarea>', 'step5.decision') +
      '<div class="sep"></div>' +
      '<div class="row" style="margin:0 0 8px"><h3 style="margin:0">Последствия</h3>' +
      '<span class="spacer"></span><span id="s5-head">' + step5Head(sit) + '</span></div>' +
      '<div class="hint">Обозначения те же, что в «А что потом?»: координаты Л - люди, В - власть, Д - дело; горизонт близкий или отдаленный; знак плюс или минус. Ветвление до трех уровней, до четырех следствий на узел.</div>' +
      '<div class="tabs">' +
      '<button class="tab' + (view.s5view !== 'scheme' ? ' on' : '') + '" data-act="s5view" data-tab="list">Список</button>' +
      '<button class="tab' + (view.s5view === 'scheme' ? ' on' : '') + '" data-act="s5view" data-tab="scheme">Схема</button>' +
      '</div>' +
      '<div class="csq-root"><b>Решение:</b> ' +
      (String(s5.decision || '').trim() ? U.esc(s5.decision) : '<span class="muted">не записано, поле выше</span>') + '</div>' +
      (view.s5view === 'scheme'
        ? (csqScheme(sit, nodes) || '<div class="empty">Последствий пока нет.</div>')
        : (csqBranch(sit, nodes, null, indexOf) || '<div class="muted" style="margin:0 0 12px">Последствий пока нет.</div>')) +
      (view.s5view !== 'scheme' && canAddTop
        ? '<div class="row"><button class="btn" data-act="csq-add" data-id="">' + Icons('plus') + 'Прямое следствие</button></div>'
        : '') +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Пре-мортем</h3>' +
      '<div class="hint">Представьте, что решение уже провалилось, и объясните почему. Рядом - что можно сделать заранее.</div>' +
      (pm || '<div class="muted" style="margin:0 0 12px">Здесь пока пусто.</div>') +
      '<div class="row"><button class="btn" data-act="add-pm">' + Icons('plus') + 'Причину провала</button></div>';
  }

  /* ---------------- шаг 4: нежелательные построения ---------------- */

  /* Отметка о том, чем закрыта угроза. Считается на лету, поэтому
     обновляется отдельно от карточки: поле с курсором не перерисовывается. */
  function threatStatus(sit, roleId, t) {
    if (!String(t.text || '').trim()) return '';
    var closed = Schema.threatClosedBy(sit, roleId, t.id);
    if (closed.block) return '<span class="thr-st">блок есть</span>';
    if (closed.formula) return '<span class="thr-st">закрыта формулой шага 7</span>';
    return '<span class="thr-st no">блока нет</span>';
  }

  function threatCard(sit, roleId, t, path, i, level) {
    return '<div class="thr' + (level === 'common' ? ' thr-c' : '') + '" data-thr="' + t.id + '">' +
      '<div class="thr-h">' +
      (level === 'common' ? '<span class="chip">общая</span>' : '') +
      '<span data-thr-st="' + t.id + '">' + threatStatus(sit, roleId, t) + '</span>' +
      '<span class="spacer"></span>' +
      '<label class="chk' + (t.preemptive ? ' on' : '') + '">' +
      '<input type="checkbox" data-check="preempt" data-level="' + level + '" data-i="' + i + '"' +
      (t.preemptive ? ' checked' : '') + '>на упреждение</label>' +
      '<button class="btn btn-ghost btn-icon" data-act="del-threat" data-level="' + level + '" data-i="' + i +
      '" title="Удалить" aria-label="Удалить">' + Icons('trash') + '</button>' +
      '</div>' +
      '<textarea rows="2" data-field="' + path + '.' + i + '.text" placeholder="Нежелательное построение соперника">' + U.esc(t.text) + '</textarea>' +
      (Express.on() ? '' :
        '<div class="thr-sub">Чем опасно</div>' +
        '<textarea rows="2" data-field="' + path + '.' + i + '.why" placeholder="Что оно со мной делает">' + U.esc(t.why) + '</textarea>') +
      '<div class="thr-sub">Блок</div>' +
      '<textarea rows="2" data-field="' + path + '.' + i + '.block" placeholder="Чем отвечаю">' + U.esc(t.block) + '</textarea>' +
      '</div>';
  }

  function step4Head(sit, roleId) {
    var all = Schema.threatsOf(sit, roleId);
    var closed = Schema.threatsClosedCount(sit, roleId);
    var pre = Schema.preemptiveOf(sit, roleId).length;
    return '<span class="muted" data-t-done="1">угроз ' + all.length + ', с блоком ' + closed +
      ' из ' + C.THREATS_PER_ROLE + ' нужных' + (pre ? ', на упреждение ' + pre : '') + '</span>';
  }

  function step4Body(sit, role) {
    var d = Schema.step4ForRole(sit, role.id);
    var s4 = sit.step4;
    var common = s4.common.map(function (t, i) {
      return threatCard(sit, role.id, t, 'step4.common', i, 'common');
    }).join('');
    var own = d.threats.map(function (t, i) {
      return threatCard(sit, role.id, t, 'step4.byRole.' + role.id + '.threats', i, role.id);
    }).join('');

    return '<div class="hint">Что соперник может построить так, что вам станет неудобно, и чем вы на это отвечаете. Общие построения опасны в любой роли; они видны из каждой роли и правятся только здесь.</div>' +
      '<div class="row" id="s4-head" style="margin:0 0 14px">' + step4Head(sit, role.id) + '</div>' +
      '<h3 style="margin-bottom:4px">Общие построения</h3>' +
      '<div class="hint">Опасны независимо от того, какую роль вам дадут.</div>' +
      (common || '<div class="muted" style="margin:0 0 12px">Здесь пока пусто.</div>') +
      '<div class="row"><button class="btn" data-act="add-threat" data-level="common">' + Icons('plus') + 'Построение</button></div>' +
      '<div class="sep"></div>' +
      '<h3 style="margin-bottom:4px">Построения против роли «' + U.esc(Roles.nameOf(role)) + '»</h3>' +
      '<div class="hint">То, что опасно именно в этой роли.</div>' +
      (own || '<div class="muted" style="margin:0 0 12px">Здесь пока пусто.</div>') +
      '<div class="row"><button class="btn" data-act="add-threat" data-level="' + role.id + '">' + Icons('plus') + 'Построение</button></div>';
  }

  /* ---------------- шаг 6: ролевые соотношения ---------------- */

  function step6Matrix(sit, view) {
    var roles = Roles.sorted(sit.roles);
    var head = '<tr><th class="qcell">я в роли &rarr; соперник &darr;</th>' +
      roles.map(function (r) { return '<th title="' + U.esc(Roles.nameOf(r)) + '">' + U.esc(r.short || Roles.nameOf(r)) + '</th>'; }).join('') +
      '</tr>';
    var rows = roles.map(function (mine) {
      var tds = roles.map(function (theirs) {
        if (mine.id === theirs.id) return '<td class="diag" aria-hidden="true">&mdash;</td>';
        var c = (sit.step6.cells || {})[Schema.cellKey(mine.id, theirs.id)] || null;
        var st = (c && c.state) || 'empty';
        var mark = '';
        C.CELL_STATES.forEach(function (x) { if (x.id === st) mark = x.short; });
        var sel = (view.s6mine === mine.id && view.s6theirs === theirs.id) ? ' sel' : '';
        return '<td class="cell st-' + st + sel + '" data-act="cell" data-mine="' + mine.id + '" data-theirs="' + theirs.id +
          '" role="button" tabindex="0" title="я ' + U.esc(Roles.nameOf(mine)) + ', соперник ' + U.esc(Roles.nameOf(theirs)) + '">' +
          (mark || '&nbsp;') + '</td>';
      }).join('');
      return '<tr><th class="qcell" style="text-align:left">' + U.esc(Roles.nameOf(mine)) + '</th>' + tds + '</tr>';
    }).join('');
    return '<div class="mx-wrap"><table class="mx">' + head + rows + '</table></div>';
  }

  function step6Cell(sit, view) {
    var mine = null, theirs = null;
    sit.roles.forEach(function (r) {
      if (r.id === view.s6mine) mine = r;
      if (r.id === view.s6theirs) theirs = r;
    });
    if (!mine || !theirs || mine.id === theirs.id) return '';
    var c = Schema.cellOf(sit, mine.id, theirs.id);
    var key = Schema.cellKey(mine.id, theirs.id);
    var help = String(Schema.step6ForRole(sit, mine.id).helpAny || '').trim();
    var btns = C.CELL_STATES.map(function (x) {
      return '<button class="chip' + (c.state === x.id ? ' on' : '') + '" data-act="cell-state" data-id="' + x.id +
        '" title="' + U.esc(x.about) + '">' + U.esc(x.name) + '</button>';
    }).join('');
    return '<div class="cellbox">' +
      '<h4>Я в роли «' + U.esc(Roles.nameOf(mine)) + '», соперник в роли «' + U.esc(Roles.nameOf(theirs)) + '»</h4>' +
      '<div class="chips" style="margin-bottom:10px">' + btns + '</div>' +
      (help ? '<div class="det-b" style="padding:0 0 10px"><b>Общий ответ этой роли:</b> ' + U.esc(help) + '</div>'
        : '<div class="det-b" style="padding:0 0 10px">Общий ответ этой роли не заполнен. Клетки уточняют его, а не заменяют.</div>') +
      (Express.on() ? '' :
        field('Чем это соотношение особенное', 'Заполняется там, где пара дает что-то, чего нет в общем ответе.',
          '<textarea rows="3" data-field="step6.cells.' + key + '.notes" placeholder="Что тут не как обычно">' + U.esc(c.notes) + '</textarea>') +
        field('Ответ именно для этой пары', 'Перекрывает общий ответ роли. Пусто - работает общий.',
          '<textarea rows="3" data-field="step6.cells.' + key + '.helpOverride" placeholder="Как вытаскиваю в герои именно эту роль">' + U.esc(c.helpOverride) + '</textarea>')) +
      '</div>';
  }

  function step6Head(sit) {
    var p = Schema.step6Progress(sit);
    return '<span class="muted" data-c-done="1">разобрано ' + p.done + ' из ' + p.total + '</span>';
  }

  function step6Body(sit, role, view) {
    var d = Schema.step6ForRole(sit, role.id);
    var hero = String(Schema.step3ForRole(sit, role.id).heroVersion || '').trim();
    return '<div class="hint">Сначала общий ответ по роли: как вы из нее вытаскиваете в положительные герои любого соперника. Это девяносто процентов шага. Матрица потом уточняет остальное.</div>' +
      (hero
        ? '<div class="det-b" style="padding:0 0 12px"><b>Положительный герой этой роли:</b> ' + U.esc(hero) + '</div>'
        : '<div class="det-b" style="padding:0 0 12px">Положительный герой этой роли в шаге 3 не описан. Помощь сопернику оказывается из этой позиции, а не из абстрактной роли.</div>') +
      field('Как я в этой роли помогаю любому сопернику стать положительным героем', '',
        '<textarea rows="4" data-field="step6.byRole.' + role.id + '.helpAny" placeholder="Общий ответ этой роли">' + U.esc(d.helpAny) + '</textarea>',
        'step6.byRole.' + role.id + '.helpAny') +
      copyFrom(sit, role.id, 'help') +
      '<div class="sep"></div>' +
      '<div class="row" style="margin:0 0 10px"><h3 style="margin:0">Матрица соотношений</h3>' +
      '<span class="spacer"></span><span id="s6-head">' + step6Head(sit) + '</span></div>' +
      '<div class="hint">Строка - моя роль, столбец - роль соперника. Диагональ выключена. «Как обычно» тоже считается разобранным: большинство клеток закрывается одним нажатием.</div>' +
      step6Matrix(sit, view) +
      step6Cell(sit, view);
  }

  /* ---------------- шаг 7: формулы ---------------- */

  function typeSelect(attr, path, value) {
    var opts = C.FORMULA_TYPES.map(function (t) {
      return '<option value="' + t.id + '"' + (t.id === value ? ' selected' : '') + '>' + U.esc(t.name) + '</option>';
    }).join('');
    return '<select class="lsel" ' + attr + '="' + path + '" aria-label="Тип формулы">' + opts + '</select>';
  }

  /* Блок ставится не вообще, а против конкретной вводной соперника:
     раздел 5.8 ТЗ. Список угроз берется из шага 4 для текущей роли. */
  function threatSelect(sit, roleId, path, value) {
    var list = Schema.threatsOf(sit, roleId);
    if (!list.length) return '<span class="fm-o">в шаге 4 угроз пока нет</span>';
    var opts = '<option value="">против угрозы: не выбрано</option>' + list.map(function (x) {
      return '<option value="' + x.threat.id + '"' + (x.threat.id === value ? ' selected' : '') + '>' +
        (x.common ? 'общая: ' : '') + U.esc(U.cut(x.threat.text, 60)) + '</option>';
    }).join('');
    return '<select class="lsel" data-fthreat="' + path + '" aria-label="Против какой угрозы">' + opts + '</select>';
  }

  function formulaCard(sit, roleId, f, path, i, level) {
    var text = String(f.text || '').trim();
    /* Кнопка «В копилку» рисуется сразу, но прячется у пустой формулы:
       так она появляется во время набора, а не после перерисовки шага. */
    return '<div class="fm" data-fm="' + f.id + '">' +
      '<div class="fm-h">' +
      typeSelect('data-ftype', path + '.' + i + '.type', f.type) +
      (f.originId ? '<span class="fm-o">из копилки</span>' : '') +
      '<span class="spacer"></span>' +
      (f.originId ? '' :
        '<button class="btn btn-sm" data-act="to-lib" data-level="' + level + '" data-i="' + i +
        '" data-fm-send="' + f.id + '"' + (text ? '' : ' hidden') + '>В копилку</button>') +
      '<button class="btn btn-ghost btn-icon" data-act="del-formula" data-level="' + level + '" data-i="' + i +
      '" title="Удалить формулу" aria-label="Удалить формулу">' + Icons('trash') + '</button>' +
      '</div>' +
      '<textarea rows="3" data-field="' + path + '.' + i + '.text" placeholder="Текст формулы">' + U.esc(f.text) + '</textarea>' +
      (f.type === 'block'
        ? '<div class="fm-h" style="margin:8px 0 0">' + threatSelect(sit, roleId, path + '.' + i + '.threatId', f.threatId) + '</div>'
        : '') +
      '</div>';
  }

  function step7Level(sit, roleId, list, path, level, title, hint) {
    var body = (list || []).map(function (f, i) { return formulaCard(sit, roleId, f, path, i, level); }).join('');
    return '<h3 style="margin-bottom:4px">' + U.esc(title) + '</h3>' +
      '<div class="hint">' + U.esc(hint) + '</div>' +
      (body || '<div class="muted" style="margin:0 0 12px">Здесь пока пусто.</div>') +
      '<div class="row">' +
      '<button class="btn" data-act="add-formula" data-level="' + level + '">' + Icons('plus') + 'Формулу</button>' +
      '<button class="btn" data-act="from-lib" data-level="' + level + '">Взять из копилки</button>' +
      '</div>';
  }

  /* Отметки закрытых типов. Считаются на лету, поэтому вынесены отдельно:
     при наборе текста формулы перерисовывается только эта строка. */
  function step7Head(sit, roleId) {
    var have = Schema.formulaTypesOf(sit, roleId);
    var chips = C.FORMULA_REQUIRED.map(function (id) {
      var k = have[id] || 0;
      return '<span class="chip' + (k ? ' on' : '') + '">' + U.esc(Library.typeName(id)) + (k > 1 ? ' &middot; ' + k : '') + '</span>';
    }).join('');
    var done = C.FORMULA_REQUIRED.filter(function (id) { return have[id]; }).length;
    return '<div class="chips">' + chips + '</div><span class="spacer"></span>' +
      '<span class="muted" data-f-done="1">типов закрыто ' + done + ' из ' + C.FORMULA_REQUIRED.length + '</span>';
  }

  function step7Body(sit, role) {
    var d = Schema.step7ForRole(sit, role.id);

    return '<div class="hint">Формула это заготовленный кусок речи. Общие работают из любой роли, остальные привязаны к роли; светофор считает сумму обоих уровней.</div>' +
      '<div class="row" id="s7-head" style="margin:0 0 14px">' + step7Head(sit, role.id) + '</div>' +
      step7Level(sit, role.id, sit.step7.common, 'step7.common', 'common', 'Общие формулы',
        'Годятся из любой роли. Чаще всего общими оказываются объяснение и взывание к совести.') +
      '<div class="sep"></div>' +
      step7Level(sit, role.id, d.formulas, 'step7.byRole.' + role.id + '.formulas', role.id,
        'Формулы роли «' + Roles.nameOf(role) + '»', 'Отказ и защитный блок обычно привязаны к роли.');
  }

  function step8Body(sit, role) {
    var d = Schema.step8ForRole(sit, role.id);
    var hero = String(Schema.step3ForRole(sit, role.id).heroVersion || '').trim();
    var pre = Schema.preemptiveOf(sit, role.id).length;
    /* Порядок полей повторяет шаблон: сначала роли, потом цель, потом фраза.
       Фраза вытекает из назначения ролей и цели, а не наоборот. */
    return (hero
      ? '<div class="det-b" style="padding:0 0 12px"><b>Положительный герой этой роли:</b> ' + U.esc(hero) + '</div>'
      : '<div class="det-b" style="padding:0 0 12px">Положительный герой этой роли в шаге 3 не описан. Первая фраза выводится из него, а не наоборот.</div>') +
      (Express.on() ? '' :
        field('Какие задать роли', 'Кем называю себя и кем соперника.',
          '<textarea rows="3" data-field="step8.byRole.' + role.id + '.roleAssignment" placeholder="Кем называю себя и соперника">' + U.esc(d.roleAssignment) + '</textarea>') +
        copyFrom(sit, role.id, 'assign')) +
      field('Цель на раунд', 'Чего добиваюсь именно в этом раунде.',
        '<textarea rows="3" data-field="step8.byRole.' + role.id + '.roundGoal" placeholder="Чего добиваюсь в этом раунде">' + U.esc(d.roundGoal) + '</textarea>',
        'step8.byRole.' + role.id + '.roundGoal') +
      copyFrom(sit, role.id, 'goal') +
      field('Первая фраза', 'Вытекает из ролей и цели. Не длиннее ' + C.PHRASE_MAX + ' символов, это примерно ' + U.seconds(C.PHRASE_MAX) + ' секунд речи.',
        textarea({ id: 'fp', path: 'step8.byRole.' + role.id + '.firstPhrase', value: d.firstPhrase, rows: 5, max: C.PHRASE_MAX, time: true, placeholder: 'С чего начинаю' }),
        'step8.byRole.' + role.id + '.firstPhrase') +
      copyFrom(sit, role.id, 'first') +
      '<div class="row"><button class="btn" data-act="preempt-list">' + Icons('doc', 18) + 'Блоки на упреждение' +
      (pre ? ' <span class="muted">' + pre + '</span>' : '') + '</button></div>';
  }

  /* ---------------- экран 8: разбор после поединка ---------------- */

  /* Все формулы ситуации подряд: разбор идет по ним, а не по ролям.
     В бою формула либо сработала, либо нет, и роль тут ни при чем. */
  function afterFormulas(sit) {
    var out = [];
    (sit.step7.common || []).forEach(function (f, i) {
      if (String(f.text || '').trim()) out.push({ f: f, path: 'step7.common.' + i, where: 'общая' });
    });
    Roles.sorted(sit.roles).forEach(function (r) {
      var d = Schema.step7ForRole(sit, r.id);
      d.formulas.forEach(function (f, i) {
        if (String(f.text || '').trim()) {
          out.push({ f: f, path: 'step7.byRole.' + r.id + '.formulas.' + i, where: Roles.nameOf(r) });
        }
      });
    });
    return out;
  }

  function screenAfter(root, state, view) {
    var sit = Storage.getSituation(view.sitId);
    if (!sit) return screenList(root, state);
    var list = afterFormulas(sit);
    var rows = list.map(function (x) {
      var mark = x.f.outcome === 'worked' ? ' ok' : (x.f.outcome === 'failed' ? ' no' : '');
      return '<div class="after-fm' + mark + '" data-af="' + x.f.id + '">' +
        '<div class="csq-h"><span class="chip">' + U.esc(x.where) + '</span>' +
        '<span class="muted">' + U.esc(Library.typeName(x.f.type)) + '</span>' +
        (x.f.originId ? '<span class="fm-o">из копилки</span>' : '') +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm' + (x.f.outcome === 'worked' ? ' btn-primary' : '') +
        '" data-act="outcome" data-id="' + x.f.id + '" data-v="worked">Сработала</button>' +
        '<button class="btn btn-sm' + (x.f.outcome === 'failed' ? ' btn-danger' : '') +
        '" data-act="outcome" data-id="' + x.f.id + '" data-v="failed">Нет</button>' +
        '</div>' +
        '<div class="pre">' + U.esc(x.f.text) + '</div>' +
        '</div>';
    }).join('');

    var counted = list.filter(function (x) { return x.f.outcome; }).length;
    var toLib = list.filter(function (x) { return x.f.outcome && x.f.originId; }).length;

    return '<header class="hdr"><div class="hdr-in">' +
      '<button class="btn btn-ghost btn-icon" data-act="back-sit" title="К ситуации" aria-label="К ситуации">' + Icons('back') + '</button>' +
      '<div class="hdr-title"><h1>После поединка</h1>' +
      '<div class="hdr-sub">' + U.esc(sit.title || C.TITLE_DEFAULT) + '</div></div>' +
      saveIndicator(state) + cloudBtn(Cloud.state()) + themeBtn(root.settings.theme) +
      '</div></header>' +
      '<div class="wrap"><div style="height:14px"></div>' +
      '<div class="card">' +
      field('Что было на самом деле', 'Как прошел поединок, что сработало не так, как готовили.',
        '<textarea rows="6" data-field="afterNotes" placeholder="Разбор своими словами">' + U.esc(sit.afterNotes) + '</textarea>',
        'afterNotes') +
      '</div>' +
      '<div class="card" style="margin-top:12px">' +
      '<div class="row" style="margin-bottom:8px"><h3 style="margin:0">Формулы в бою</h3>' +
      '<span class="spacer"></span><span class="muted" data-af-done="1">отмечено ' + counted + ' из ' + list.length +
      (toLib ? ', в копилку ушло ' + toLib : '') + '</span></div>' +
      '<div class="hint">Отметка идет в копилку тем заготовкам, откуда формула взята: по ним потом видно, что работает. Формула, написанная здесь и не отправленная в копилку, считается только в этой ситуации.</div>' +
      (rows || '<div class="muted">Формул в этой ситуации нет.</div>') +
      '</div><div style="height:20px"></div></div>';
  }

  /* ---------------- экран 6: корзина ---------------- */

  function screenTrash(root, state) {
    var list = Trash.inTrash(root.situations);
    var cards = list.map(function (s) {
      var d = Trash.daysLeft(s, U.now());
      return '<div class="card sit-card">' +
        '<div class="sit-main">' +
        '<div class="sit-title">' + U.esc(s.title || C.TITLE_DEFAULT) + '</div>' +
        '<div class="muted">удалена ' + U.dateShort(s.deletedAt) + ' &middot; ' +
        (d ? ('сотрется через ' + d + ' ' + plural(d, 'день', 'дня', 'дней')) : 'сотрется при следующем открытии') +
        '</div></div>' +
        '<button class="btn btn-sm" data-act="restore" data-id="' + s.id + '">Вернуть</button>' +
        '<button class="btn btn-ghost btn-icon" data-act="purge" data-id="' + s.id +
        '" title="Стереть насовсем" aria-label="Стереть насовсем">' + Icons('trash') + '</button>' +
        '</div>';
    }).join('');

    return '<header class="hdr"><div class="hdr-in">' +
      '<button class="btn btn-ghost btn-icon" data-act="back" title="К списку" aria-label="К списку">' + Icons('back') + '</button>' +
      '<div class="hdr-title"><h1>Корзина</h1>' +
      '<div class="hdr-sub">Удаленное хранится ' + C.TRASH_DAYS + ' дней</div></div>' +
      saveIndicator(state) + cloudBtn(Cloud.state()) + themeBtn(root.settings.theme) +
      '</div></header>' +
      '<div class="wrap"><div style="height:14px"></div>' +
      (cards || '<div class="empty">Корзина пуста.</div>') +
      (list.length ? '<div class="row" style="margin-top:14px">' +
        '<button class="btn btn-danger" data-act="trash-empty">Очистить корзину</button></div>' : '') +
      '</div>';
  }

  /* ---------------- экран 7: история изменений ---------------- */

  function screenHistory(root, state, view) {
    var sit = Storage.getSituation(view.sitId);
    if (!sit) return screenList(root, state);
    var list = (view.history || []).slice().sort(function (a, b) { return b.ts - a.ts; });
    var short = function (v) {
      if (v === null || v === undefined) return 'пусто';
      if (typeof v === 'string') return String(v).trim() ? '«' + U.cut(v, 70) + (U.len(v) > 70 ? '...' : '') + '»' : 'пусто';
      if (typeof v === 'boolean') return v ? 'да' : 'нет';
      if (Array.isArray(v)) return 'список из ' + v.length;
      if (typeof v === 'object') return 'запись';
      return String(v);
    };
    var snapList = (view.snaps || []).slice().sort(function (a, b) { return b.ts - a.ts; });
    var snaps = snapList.length ? '<div class="card">' + snapList.map(function (sn, i) {
      var t = new Date(sn.ts);
      var hh = function (x) { return (x < 10 ? '0' : '') + x; };
      var filled = Traffic.of(sn.data || {}).filter(function (p) { return p.state !== 'red'; }).length;
      return '<div class="rd-row" style="cursor:default">' +
        '<span><b>' + U.dateShort(sn.ts) + ', ' + hh(t.getHours()) + ':' + hh(t.getMinutes()) + '</b><br>' +
        '<span class="muted">начатых шагов ' + filled + ' из 9</span></span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-act="snap-restore" data-i="' + i + '">Вернуть целиком</button>' +
        '</div>';
    }).join('') + '</div>' : '';

    var rows = list.map(function (h, i) {
      var place = Comments.locate(h.path);
      var t = new Date(h.ts);
      var hh = function (x) { return (x < 10 ? '0' : '') + x; };
      return '<div class="rd-row" style="cursor:default">' +
        '<span><b>' + U.esc(place.label) + '</b> ' +
        '<span class="muted">' + U.dateShort(h.ts) + ', ' + hh(t.getHours()) + ':' + hh(t.getMinutes()) + '</span><br>' +
        '<span class="muted">было ' + U.esc(short(h.oldValue)) + ' &rarr; стало ' + U.esc(short(h.newValue)) + '</span></span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-act="undo" data-i="' + i + '">Вернуть</button>' +
        '</div>';
    }).join('');

    return '<header class="hdr"><div class="hdr-in">' +
      '<button class="btn btn-ghost btn-icon" data-act="back-sit" title="К ситуации" aria-label="К ситуации">' + Icons('back') + '</button>' +
      '<div class="hdr-title"><h1>История</h1>' +
      '<div class="hdr-sub">' + U.esc(sit.title || C.TITLE_DEFAULT) + '</div></div>' +
      saveIndicator(state) + cloudBtn(Cloud.state()) + themeBtn(root.settings.theme) +
      '</div></header>' +
      '<div class="wrap"><div style="height:14px"></div>' +
      '<h3 style="margin:0 0 6px">Снимки состояния</h3>' +
      '<div class="muted" style="margin-bottom:10px">Последние ' + C.SNAPSHOTS_PER_SITUATION +
      ' состояний ситуации целиком. Возврат к снимку откатывает всю ситуацию сразу, а прежнее состояние тут же становится новым снимком.</div>' +
      (snaps || '<div class="empty" style="margin-bottom:16px">Снимков пока нет: они появляются по ходу работы.</div>') +
      '<div class="sep"></div>' +
      '<h3 style="margin:0 0 6px">Отдельные правки</h3>' +
      '<div class="muted" style="margin-bottom:10px">Последние ' + C.HISTORY_PER_SITUATION +
      ' правок этой ситуации. «Вернуть» кладет в поле прежнее значение и само становится правкой: откат тоже можно откатить.</div>' +
      (rows ? '<div class="card">' + rows + '</div>' : '<div class="empty">Правок пока нет.</div>') +
      '<div style="height:20px"></div></div>';
  }

  /* ---------------- экран 5: репетиция ---------------- */

  function screenRehearsal(root, state, view) {
    var sit = Storage.getSituation(view.sitId);
    if (!sit) return screenList(root, state);
    var roles = Roles.sorted(sit.roles);
    var role = null;
    roles.forEach(function (r) { if (r.id === view.rehRole) role = r; });
    if (!role) role = roles[0];
    var st = view.reh;
    var left = Rehearsal.left(st, U.now());
    var d8 = Schema.step8ForRole(sit, role.id);
    var rounds = (sit.step9 && sit.step9.rounds) || [];
    var rn = Math.min(Math.max(view.rehRound || 0, 0), Math.max(0, rounds.length - 1));
    var rd = rounds[rn] || null;

    var roleOpts = roles.map(function (r) {
      return '<option value="' + r.id + '"' + (r.id === role.id ? ' selected' : '') + '>' + U.esc(Roles.nameOf(r)) + '</option>';
    }).join('');
    var roundOpts = rounds.map(function (r, i) {
      return '<option value="' + i + '"' + (i === rn ? ' selected' : '') + '>раунд ' + r.n + '</option>';
    }).join('');
    var minOpts = '';
    for (var m = C.ROUND_MINUTES_MIN; m <= C.ROUND_MINUTES_MAX; m++) {
      minOpts += '<option value="' + m + '"' + (st.total === m * 60 ? ' selected' : '') + '>' + m + ' мин</option>';
    }

    var phrase = String(d8.firstPhrase || '').trim();
    var card = '<div class="reh-card">' +
      '<div class="card">' +
      '<div class="label">Первая фраза</div>' +
      (phrase
        ? '<div class="q">' + U.esc(phrase) + '</div><div class="muted">' + U.len(phrase) +
          ' знаков, около ' + U.seconds(U.len(phrase)) + ' секунд речи</div>'
        : '<div class="muted">Не написана. Шаг 8.</div>') +
      '<div class="sep" style="margin:12px 0"></div>' +
      '<div class="label">Цель на раунд</div>' +
      '<div class="q">' + (String(d8.roundGoal || '').trim() ? U.esc(d8.roundGoal) : '<span class="muted">не записана</span>') + '</div>' +
      '<div class="label" style="margin-top:10px">Какие задать роли</div>' +
      '<div class="q">' + (String(d8.roleAssignment || '').trim() ? U.esc(d8.roleAssignment) : '<span class="muted">не записано</span>') + '</div>' +
      (rd && String(rd.goal || '').trim()
        ? '<div class="label" style="margin-top:10px">Цель раунда ' + rd.n + ' по стратегии</div><div class="q">' + U.esc(rd.goal) + '</div>'
        : '') +
      '</div></div>';

    var cls = 'clock' + (left === 0 ? ' over' : (left <= C.WARN_SECONDS ? ' warn' : ''));

    return '<div class="reh">' +
      '<div class="reh-top">' +
      '<button class="btn btn-ghost btn-icon" data-act="reh-exit" title="Выйти" aria-label="Выйти">' + Icons('close') + '</button>' +
      '<select class="lsel" data-rehrole="1" aria-label="Роль">' + roleOpts + '</select>' +
      (roundOpts ? '<select class="lsel" data-rehround="1" aria-label="Раунд">' + roundOpts + '</select>' : '') +
      '<select class="lsel" data-rehmin="1" aria-label="Длительность">' + minOpts + '</select>' +
      '<span class="spacer"></span>' +
      '<span class="muted">' + U.esc(sit.title || C.TITLE_DEFAULT) + '</span>' +
      '</div>' +
      '<div class="reh-mid">' +
      '<div class="' + cls + '" id="reh-clock">' + Rehearsal.clock(left) + '</div>' +
      '<div class="muted" id="reh-hint">' +
      (left === 0 ? 'Раунд кончился' : (st.running ? 'Идет' : (st.elapsed ? 'Пауза' : 'Готов к старту'))) +
      '</div>' + card +
      '</div>' +
      '<div class="reh-acts">' +
      '<button class="btn btn-primary" data-act="reh-run">' + (st.running ? 'Пауза' : 'Старт') + '</button>' +
      '<button class="btn" data-act="reh-reset">Сброс</button>' +
      '<button class="btn" data-act="reh-panel" data-p="formulas">Формулы</button>' +
      '<button class="btn" data-act="reh-panel" data-p="blocks">Блоки</button>' +
      '<button class="btn" data-act="reh-panel" data-p="question">Вопрос</button>' +
      '</div>' +
      (view.rehPanel ? rehPanel(sit, role, view) : '') +
      '</div>';
  }

  /* Выдвижные панели репетиции. Раздел 7 ТЗ. */
  function rehPanel(sit, role, view) {
    var body = '', title = '';
    if (view.rehPanel === 'formulas') {
      title = 'Формулы роли «' + Roles.nameOf(role) + '»';
      var groups = Rehearsal.formulasByType(sit, role.id);
      body = groups.length ? groups.map(function (g) {
        return '<div class="ftype">' + U.esc(g.type.name) + '</div>' +
          g.items.map(function (x) {
            return '<div class="fm" style="margin-bottom:8px">' +
              (x.common ? '<span class="chip">общая</span> ' : '') +
              '<span class="pre">' + U.esc(x.f.text) + '</span></div>';
          }).join('');
      }).join('') : '<div class="muted">Формул нет. Шаг 7.</div>';
    } else if (view.rehPanel === 'blocks') {
      title = 'Блоки на упреждение';
      var pre = Schema.preemptiveOf(sit, role.id);
      body = pre.length ? pre.map(function (x) {
        return '<div class="thr' + (x.common ? ' thr-c' : '') + '" style="margin-bottom:8px">' +
          (x.common ? '<span class="chip">общая</span><br>' : '') +
          '<b>' + U.esc(x.threat.text) + '</b>' +
          (String(x.threat.block || '').trim()
            ? '<div style="margin-top:6px">' + U.esc(x.threat.block) + '</div>'
            : '<div class="muted" style="margin-top:6px">Блок не написан.</div>') +
          '</div>';
      }).join('') : '<div class="muted">Построений с отметкой «на упреждение» нет. Шаг 4.</div>';
    } else {
      title = 'Вопрос секунданта';
      var q = view.rehQuestion;
      body = q
        ? '<div class="qst open"><b>' + U.esc(q.text) + '</b>' +
          (String(q.answer || '').trim()
            ? '<div class="muted" style="margin-top:6px">Ваш ответ: ' + U.esc(q.answer) + '</div>'
            : '<div class="muted" style="margin-top:6px">Ответа не записано. Ответьте вслух.</div>') + '</div>' +
          '<div class="row"><button class="btn" data-act="reh-question">Другой вопрос</button></div>'
        : '<div class="muted">Вопросов в этой ситуации нет. Раздел «Вопросы секунданта».</div>';
    }
    return '<div class="panel" role="dialog" aria-label="' + U.esc(title) + '">' +
      '<div class="row" style="margin-bottom:8px"><h3 style="margin:0">' + U.esc(title) + '</h3>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-ghost btn-icon" data-act="reh-panel" data-p="" title="Закрыть" aria-label="Закрыть">' +
      Icons('close') + '</button></div>' + body + '</div>';
  }

  /* ---------------- экран 4: «Готов?» ---------------- */

  function screenReady(root, state, view) {
    var sit = Storage.getSituation(view.sitId);
    if (!sit) return screenList(root, state);
    var sum = Traffic.summary(sit);
    var rows = sum.points.map(function (p) {
      var frac = (p.total !== null && p.total > 0) ? (' &middot; ролей ' + p.done + ' из ' + p.total) : '';
      var word = p.state === 'green' ? 'закрыт' : (p.state === 'yellow' ? 'начат' : 'не начат');
      return '<div class="rd-row" data-act="go-step" data-sec="' + p.sec + '" role="button" tabindex="0">' +
        '<span class="rd-n ' + p.state + '">' + p.n + '</span>' +
        '<span><b>' + U.esc(p.title) + '</b><br>' +
        '<span class="muted">' + word + frac + (p.note ? ' &middot; ' + U.esc(p.note) : '') + '</span></span>' +
        '</div>';
    }).join('');

    var qs = sum.openQuestions.map(function (q) {
      return '<div class="qst open" style="margin-bottom:8px"><b>' + U.esc(q.text) + '</b>' +
        (String(q.answer || '').trim() ? '<div class="muted" style="margin-top:4px">' + U.esc(q.answer) + '</div>' : '') +
        '</div>';
    }).join('');

    var verdict = sum.red === 0 && sum.yellow === 0
      ? 'Все девять шагов закрыты.'
      : (sum.green + ' закрыто, ' + sum.yellow + ' начато, ' + sum.red + ' не начато.');

    return '<header class="hdr"><div class="hdr-in">' +
